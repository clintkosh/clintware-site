name: Deploy Mind to Form

on:
  push:
    branches: [main]
    paths:
      - "mindtoform-worker/**"
      - ".github/workflows/deploy-mindtoform.yml"
  pull_request:
    paths:
      - "mindtoform-worker/**"
      - ".github/workflows/deploy-mindtoform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mindtoform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check mindtoform-worker/src/index.js
      - run: XDG_CONFIG_HOME=/tmp/mtf-xdg npx --yes --cache /tmp/mtf-npm-cache wrangler@4 deploy --dry-run --config mindtoform-worker/wrangler.jsonc

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Mind to Form Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd mindtoform-worker
      - name: Verify Mind to Form
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            page=$(curl -sS --connect-timeout 5 --max-time 15 https://mindtoform.clintware.com/ || true)
            health=$(curl -sS --connect-timeout 5 --max-time 15 https://mindtoform.clintware.com/healthz || true)
            vet=$(curl -sS --connect-timeout 5 --max-time 45 -X POST -H 'Content-Type: application/json' --data '{"idea":"Design a compact weatherproof enclosure for a small outdoor temperature sensor that mounts to a pole."}' https://mindtoform.clintware.com/api/vet || true)
            if grep -Fq 'Agree on what' <<< "$page"               && grep -Fq 'adaptive-vet-dod-gated-local-form' <<< "$health"               && grep -Fq '"ok":true' <<< "$vet"               && grep -Fq '"questions":' <<< "$vet"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
