name: Deploy CPL CS Operating System

on:
  push:
    branches: [main]
    paths:
      - "projects/cpl-cs-os/**"
      - "projects/dpl-crm/**"
      - "projects/dplr-crm/scripts/browser-local-runtime.mjs"
      - "projects/dplr-crm/public/cw-astro-local-store.js"
      - "tests/cpl_browser_smoke.mjs"
      - ".github/workflows/deploy-cpl-cs-os.yml"
  pull_request:
    paths:
      - "projects/cpl-cs-os/**"
      - "projects/dpl-crm/**"
      - "projects/dplr-crm/scripts/browser-local-runtime.mjs"
      - "projects/dplr-crm/public/cw-astro-local-store.js"
      - "tests/cpl_browser_smoke.mjs"
      - ".github/workflows/deploy-cpl-cs-os.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-cpl-cs-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Materialize and validate browser-local source
        run: |
          set -euo pipefail
          node projects/cpl-cs-os/scripts/materialize.mjs
          cd .build/cpl-cs-os
          npm install --no-audit --no-fund
          npm run check
          ! grep -Fq '"durable_objects"' wrangler.jsonc
          grep -Fq '"deleted_classes"' wrangler.jsonc
          grep -Fq '/cw-astro-local-store.js' public/index.html
          grep -Fq 'databaseRowsPerDemoSession:0' src/index.js
          grep -Fq 'durableObjectsRequired:false' src/index.js
          grep -Fq 'Northstar Financial Group' public/cw-astro-local-bootstrap.js
          grep -Fq 'SAMPLE_SEED_VERSION' src/sample-customers.js
          grep -Fq 'CPL // CUSTOMER SUCCESS CRM' public/index.html
          grep -Fq 'RenewNudge' public/cpl.js
          grep -Fq 'Customer Success CRM' public/cpl.js
          grep -Fq 'Edit account' public/cpl.js
          grep -Fq 'Add task' public/cpl.js
          grep -Fq 'Add risk' public/cpl.js
          grep -Fq 'Add stakeholder' public/cpl.js
          grep -Fq 'Edit renewal' public/cpl.js
          grep -Fq 'Why I built this' public/cpl.js
          ! grep -Rqi '<img' public
          npx wrangler deploy --dry-run

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build deployable browser-local artifact
        run: |
          set -euo pipefail
          node projects/cpl-cs-os/scripts/materialize.mjs
          cd .build/cpl-cs-os
          npm install --no-audit --no-fund
          npm run check

      - name: Deploy stateless Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd .build/cpl-cs-os

      - name: Attach cpl.clintware.com
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data '{"hostname":"cpl.clintware.com","service":"clintware-cpl-cs-os","zone_name":"clintware.com"}')
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d' <<< "$response"

      - name: Verify live stateless and security contract
        run: |
          set -euo pipefail
          base=https://cpl.clintware.com
          ready=0
          for i in $(seq 1 48); do
            h=$(curl -fsS --connect-timeout 5 --max-time 15 "$base/health" || true)
            p=$(curl -fsS --connect-timeout 5 --max-time 15 "$base/" || true)
            j=$(curl -fsS --connect-timeout 5 --max-time 15 "$base/cpl.js" || true)
            if grep -Fq '"service":"clintware-cpl-cs-os"' <<< "$h"               && grep -Fq '"storage":"browser-local"' <<< "$h"               && grep -Fq '"databaseRowsPerDemoSession":0' <<< "$h"               && grep -Fq '"durableObjectsRequired":false' <<< "$h"               && grep -Fq 'CPL // CUSTOMER SUCCESS CRM' <<< "$p"               && grep -Fq 'Customer Success CRM' <<< "$j"; then
              ready=1; break
            fi
            sleep 5
          done
          test "$ready" = "1"
          headers=$(curl -fsS -D - -o /dev/null "$base/")
          grep -Fqi 'strict-transport-security:' <<< "$headers"
          grep -Fqi 'x-frame-options: DENY' <<< "$headers"
          grep -Fqi 'x-robots-tag: noindex' <<< "$headers"
          grep -Fqi 'content-security-policy:' <<< "$headers"
          grep -Fqi "script-src 'self'" <<< "$headers"
          grep -Fqi "form-action 'self'" <<< "$headers"
          domains=$(curl --fail-with-body -sS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=cpl.clintware.com" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True and len(r)==1,d; x=r[0]; assert x.get("hostname")=="cpl.clintware.com",x; assert x.get("service")=="clintware-cpl-cs-os",x' <<< "$domains"

      - name: Real browser CRUD and reload persistence smoke
        timeout-minutes: 6
        run: |
          set -euo pipefail
          google-chrome --version
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          PLAYWRIGHT_CHANNEL=chrome timeout 240s node tests/cpl_browser_smoke.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpl-browser-evidence
          path: |
            cpl-desktop-smoke.png
            cpl-mobile-smoke.png
            cpl-failure.png
          if-no-files-found: ignore
