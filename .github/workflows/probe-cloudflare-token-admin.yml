name: Probe Cloudflare Token Admin

on:
  push:
    paths:
      - ".github/workflows/probe-cloudflare-token-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Probe token administration permissions
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          headers=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Accept: application/json")
          user_code=$(curl --compressed -sS -o /tmp/user_tokens.json -w '%{http_code}' "${api}/user/tokens?per_page=1" "${headers[@]}")
          account_code=$(curl --compressed -sS -o /tmp/account_tokens.json -w '%{http_code}' "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens?per_page=1" "${headers[@]}")
          user_groups_code=$(curl --compressed -sS -o /tmp/user_groups.json -w '%{http_code}' "${api}/user/tokens/permission_groups" "${headers[@]}")
          account_groups_code=$(curl --compressed -sS -o /tmp/account_groups.json -w '%{http_code}' "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/permission_groups" "${headers[@]}")
          echo "USER_TOKEN_ADMIN_HTTP=${user_code}"
          echo "ACCOUNT_TOKEN_ADMIN_HTTP=${account_code}"
          echo "USER_PERMISSION_GROUPS_HTTP=${user_groups_code}"
          echo "ACCOUNT_PERMISSION_GROUPS_HTTP=${account_groups_code}"
          if [[ "$user_code" == "200" || "$account_code" == "200" ]]; then
            echo "TOKEN_ADMIN_PATH_AVAILABLE=true"
          else
            echo "TOKEN_ADMIN_PATH_AVAILABLE=false"
            exit 3
          fi
