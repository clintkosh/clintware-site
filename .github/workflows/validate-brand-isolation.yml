name: Validate Brand and Quillgeist Isolation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scan current repository and public Quillgeist source
        run: node scripts/validate-brand-isolation.mjs
