name: Verify Meet DNS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-meet-dns.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install DNS tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null

      - name: Verify authoritative delegation and public record
        run: |
          set -euo pipefail
          echo '=== Parent delegation ==='
          dig @a.gtld-servers.net clintware.com NS +noall +answer || true
          echo '=== Cloudflare recursive ==='
          dig @1.1.1.1 clintware.com NS +noall +answer
          dig @1.1.1.1 meet.clintware.com A +noall +answer
          echo '=== Google recursive ==='
          dig @8.8.8.8 clintware.com NS +noall +answer
          dig @8.8.8.8 meet.clintware.com A +noall +answer
          test -n "$(dig +short @1.1.1.1 meet.clintware.com A | head -n1)"
          test -n "$(dig +short @8.8.8.8 meet.clintware.com A | head -n1)"

      - name: Verify Worker binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=meet.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True and len(r)==1,d; x=r[0]; assert x.get("hostname")=="meet.clintware.com" and x.get("service")=="clintware-meet",x; print("Binding:",x["hostname"],"->",x["service"])' <<< "$response"

      - name: Verify embedded HTTPS scheduler
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            headers=$(mktemp)
            body=$(mktemp)
            code=$(curl -sS -D "$headers" --connect-timeout 5 --max-time 20 -o "$body" -w '%{http_code}' https://meet.clintware.com/ || true)
            if [ "$code" = "200" ] \
              && grep -Fq 'CLINTWARE™' "$body" \
              && grep -Fq 'GO FURTHEST.™' "$body" \
              && grep -Fq 'https://koalendar.com/e/meet-with-clinton?embed=true' "$body" \
              && ! grep -Eqi '^location:' "$headers"; then
              rm -f "$headers" "$body"
              echo 'PUBLIC_OK: DNS, HTTPS, and embedded Koalendar scheduler verified without redirect.'
              exit 0
            fi
            rm -f "$headers" "$body"
            sleep 5
          done
          exit 1

      - name: Verify health endpoint
        run: |
          set -euo pipefail
          curl --fail-with-body -sS https://meet.clintware.com/health | grep -Fq '"mode":"embedded-koalendar"'
