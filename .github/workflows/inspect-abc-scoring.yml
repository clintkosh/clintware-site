name: Inspect ABC Scoring Engine

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-abc-scoring.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect bind/modal source
        run: |
          python3 - <<'PY'
          import re,base64,gzip
          from pathlib import Path
          parts=[]
          for n in range(1,6):
              s=Path(f'abc/src/app-part{n}.js').read_text()
              m=re.search(r'PART_\d+\s*=\s*[`\"\']([^`\"\']+)',s)
              if not m: raise SystemExit(f'part {n} not found')
              parts.append(m.group(1))
          raw=gzip.decompress(base64.b64decode(''.join(parts))).decode('utf-8')
          lines=raw.splitlines()
          for i in range(408,min(len(lines),469)+1): print(f'{i:05d}: {lines[i-1]}')
          PY
