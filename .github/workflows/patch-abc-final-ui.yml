name: Patch ABC final UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-abc-final-ui.yml"
      - "abc/tools/patch_final_ui.py"
      - "abc/tools/postpatch_cleanup.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch ABC application bundle
        run: |
          set -euo pipefail
          python3 abc/tools/patch_final_ui.py
          python3 abc/tools/postpatch_cleanup.py
          node --check abc/src/index.js
          node abc/tests/smoke.mjs
          python3 abc/tests/regression.py
          node abc/tests/auth-roundtrip.mjs
      - name: Commit patched bundle
        run: |
          set -euo pipefail
          if git diff --quiet -- abc/src/app-part1.js abc/src/app-part2.js abc/src/app-part3.js abc/src/app-part4.js abc/src/app-part5.js; then
            echo "No bundle changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add abc/src/app-part1.js abc/src/app-part2.js abc/src/app-part3.js abc/src/app-part4.js abc/src/app-part5.js
          git commit -m "Finish ABC overview, notes, PDF, analytics, and branding"
          git push origin HEAD:main
