name: Deploy Clintware Homepage

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "payloads/teamsgallery/**"
      - "materialize_teamsgallery.py"
      - "build_site.py"
      - "generate_crm_pdfs.py"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "public/**"
      - "payloads/teamsgallery/**"
      - "materialize_teamsgallery.py"
      - "build_site.py"
      - "generate_crm_pdfs.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "clintware-homepage-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  activate_contact_form:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[activate-contact-form]')
    runs-on: ubuntu-latest
    steps:
      - name: Send one-time FormSubmit activation request
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request POST 'https://formsubmit.co/clint@clintware.com' \
            --data-urlencode 'name=Clint Kosh' \
            --data-urlencode 'email=clint@clintware.com' \
            --data-urlencode 'phone=' \
            --data-urlencode 'message=Clintware contact form activation test. Please confirm this address so website submissions can be delivered.' \
            --data-urlencode '_subject=CLINTWARE CONTACT - Activation test' \
            --data-urlencode '_template=table' \
            --data-urlencode '_next=https://www.clintware.com/contact/thanks/' \
            --data-urlencode '_url=https://www.clintware.com/contact/' \
            --output /tmp/formsubmit-response.html
          grep -Eiq 'activate|activation|confirm|thank|success' /tmp/formsubmit-response.html || {
            echo 'FormSubmit returned a response, but no expected activation marker was found.'
            sed -n '1,120p' /tmp/formsubmit-response.html
          }

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out homepage source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PDF build dependency
        run: python -m pip install --disable-pip-version-check "reportlab>=4.2,<5"

      - name: Materialize Teams gallery assets
        run: python materialize_teamsgallery.py

      - name: Verify production bundle
        run: python build_site.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out homepage source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PDF build dependency
        run: python -m pip install --disable-pip-version-check "reportlab>=4.2,<5"

      - name: Materialize Teams gallery assets
        run: python materialize_teamsgallery.py

      - name: Build instrumented production bundle
        run: python build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Clintware homepage
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  notify_blog_subscribers:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find changed post pages
        run: |
          python3 newsletter/scripts/changed_posts.py \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}" \
            --output /tmp/clintware-blog-posts.json
      - id: changed_posts
        name: Count changed posts
        run: |
          count=$(python3 - <<'PY'
          import json
          with open("/tmp/clintware-blog-posts.json", encoding="utf-8") as source:
              print(len(json.load(source)))
          PY
          )
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Send confirmed subscribers the update
        if: steps.changed_posts.outputs.count != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          export NEWSLETTER_PUBLISH_SECRET=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          python3 newsletter/scripts/notify_posts.py --posts /tmp/clintware-blog-posts.json --endpoint https://clintware-blog-newsletter.clint-kosh.workers.dev
