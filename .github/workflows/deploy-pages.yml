name: Deploy Clintware Homepage

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: clintware-homepage-pages
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out homepage source
        uses: actions/checkout@v4

      - name: Verify production bundle
        run: |
          test -s public/index.html
          test -s public/tools/index.html
          test -s public/blog/index.html
          test -s public/privacy/index.html
          test -s public/contact/index.html
          test -s public/robots.txt
          test -s public/sitemap.xml
          ! grep -Ril "Aggieland" public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Clintware homepage
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
