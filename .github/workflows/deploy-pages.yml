name: Deploy Clintware Homepage

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "build_site.py"
      - "generate_crm_pdfs.py"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "public/**"
      - "build_site.py"
      - "generate_crm_pdfs.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "clintware-homepage-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out homepage source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PDF build dependency
        run: python -m pip install --disable-pip-version-check "reportlab>=4.2,<5"

      - name: Verify production bundle
        run: python build_site.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out homepage source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PDF build dependency
        run: python -m pip install --disable-pip-version-check "reportlab>=4.2,<5"

      - name: Build instrumented production bundle
        run: python build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Clintware homepage
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  notify_blog_subscribers:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find changed post pages
        run: |
          python3 newsletter/scripts/changed_posts.py \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}" \
            --output /tmp/clintware-blog-posts.json
      - id: changed_posts
        name: Count changed posts
        run: |
          count=$(python3 - <<'PY'
          import json
          with open("/tmp/clintware-blog-posts.json", encoding="utf-8") as source:
              print(len(json.load(source)))
          PY
          )
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Send confirmed subscribers the update
        if: steps.changed_posts.outputs.count != '0'
        env:
          NEWSLETTER_PUBLISH_SECRET: ${{ secrets.NEWSLETTER_PUBLISH_SECRET }}
        run: python3 newsletter/scripts/notify_posts.py --posts /tmp/clintware-blog-posts.json --endpoint https://newsletter.clintware.com
