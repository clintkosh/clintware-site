name: Inspect deployed DTex login

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-dtex-login.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inventory likely DTex Cloudflare resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/domains.json
          curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/scripts.json
          curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/pages.json || true
          python3 - <<'PY'
          import json,re
          terms=re.compile(r'dtex|summertime|crm|csm|customer',re.I)
          for label,path in [('domains','/tmp/domains.json'),('scripts','/tmp/scripts.json'),('pages','/tmp/pages.json')]:
              try:
                  d=json.load(open(path))
              except Exception as e:
                  print(label, 'unavailable', e)
                  continue
              print('\n###',label)
              for x in d.get('result',[]) or []:
                  text=json.dumps(x,sort_keys=True)
                  if terms.search(text):
                      if label=='domains':
                          print({'hostname':x.get('hostname'),'service':x.get('service')})
                      elif label=='scripts':
                          print({'id':x.get('id'),'etag':x.get('etag')})
                      else:
                          print({'name':x.get('name'),'subdomain':x.get('subdomain'),'domains':x.get('domains')})
          PY
