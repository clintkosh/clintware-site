name: Deploy N7 Customer Value OS

on:
  push:
    branches: [main]
    paths:
      - "projects/n7-customer-value-os/**"
      - ".github/workflows/deploy-n7-customer-value-os.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-n7-customer-value-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/n7-customer-value-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
      - name: Verify portability guardrails
        run: |
          set -euo pipefail
          ! grep -R "@lovable.dev" -n package.json vite.config.ts src || false
          test -f EXIT.md
          test -f .env.example
          grep -Fq "Lovable is not required" EXIT.md
          grep -Fq "G-DCY144YM9P" src/routes/__root.tsx

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --prefix projects/n7-customer-value-os --no-audit --no-fund
      - name: Build production Worker bundle
        run: npm run build --prefix projects/n7-customer-value-os
      - name: Deploy N7 Worker runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          projects/n7-customer-value-os/node_modules/.bin/wrangler deploy \
            --config projects/n7-customer-value-os/dist/server/wrangler.json
      - name: Attach N7 custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --compressed -sS -X PUT             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H "Accept: application/json"             -H "Content-Type: application/json"             --data '{"hostname":"n7crm.clintware.com","service":"n7-customer-value-os","zone_name":"clintware.com"}')
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; r=d.get("result") or {}; assert r.get("hostname")=="n7crm.clintware.com",r; assert r.get("service")=="n7-customer-value-os",r' <<< "$response"
      - name: Verify live N7 site
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 30); do
            page=$(curl -sS --connect-timeout 5 --max-time 15 https://n7crm.clintware.com/ || true)
            if grep -Fq 'N7 Customer Value OS' <<< "$page"; then
              ready=1
              break
            fi
            sleep 3
          done
          test "$ready" = 1
      - name: Verify live N7 analytics bundle
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -L https://n7crm.clintware.com/ -o /tmp/n7-home.html
          grep -Fq 'G-DCY144YM9P' /tmp/n7-home.html
          grep -Fq 'send_page_view:false' /tmp/n7-home.html
          python3 - <<'PY'
          import re, urllib.request
          base='https://n7crm.clintware.com'
          pages=[
              '/',
              '/customers/official-case/live-prompt',
              '/customers/official-case/live-assist',
              '/customers/official-case/meeting-prep',
              '/customers/official-case/deployment-board',
              '/customers/official-case/engineering-issues',
          ]
          htmls=[]
          for page in pages:
              req=urllib.request.Request(base+page, headers={'User-Agent':'Mozilla/5.0 N7-Deploy-Check'})
              htmls.append(urllib.request.urlopen(req, timeout=20).read().decode('utf-8','ignore'))
          refs=set()
          for html in htmls:
              for ref in re.findall(r'(?:src|href)="([^"]+\.js(?:\?[^"]*)?)"', html):
                  if ref.startswith('/'):
                      ref=base+ref
                  if ref.startswith(base):
                      refs.add(ref)
          assets=[]
          for ref in sorted(refs):
              req=urllib.request.Request(ref, headers={'User-Agent':'Mozilla/5.0 N7-Deploy-Check'})
              assets.append(urllib.request.urlopen(req, timeout=20).read().decode('utf-8','ignore'))
          bundle='\n'.join(assets)
          required=[
              'live_prompt_proposal_approved',
              'live_assist_started',
              'live_assist_session_saved',
              'meeting_prep_pdf_prepared',
              'meeting_checkpoint_recorded',
              'jira_deployment_issue_created',
              'jira_engineering_issue_created',
          ]
          missing=[x for x in required if x not in bundle]
          if missing:
              raise SystemExit('Missing live analytics event markers: '+', '.join(missing))
          print('Live analytics markers present:', ', '.join(required))
          PY
      - name: Verify N7 Control Plane service binding
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 20); do
            code=$(curl -sS -L -o /tmp/n7-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 https://n7crm.clintware.com/internal-health || true)
            if [ "$code" = "200" ] && python3 -c 'import json; d=json.load(open("/tmp/n7-health.json")); assert d.get("ok") is True; assert d.get("controlPlane")=="ready"; assert d.get("state")=="ready"; assert d.get("ai")=="ready"; assert d.get("audio")=="authorized"; j=d.get("jira") or {}; assert j.get("authorized") is True; assert j.get("configured") is True' 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/n7-health.json || true
            exit 1
          fi
      - name: Verify live N7 workspace routes
        run: |
          set -euo pipefail
          sections=(
            executive-summary
            implementation
            deployment-board
            rollout-sprints
            critical-path
            risks-decisions
            raci
            environment
            documents
            engineering-issues
            accuracy-triage
            messaging
            meeting-prep
            live-prompt
            live-assist
            roi-workshop
            kpi-contract
            executive-qbr
            readiness-gate
            assumption-change
            evidence
          )
          check_route() {
            label="$1"
            url="$2"
            echo "Checking ${label}: ${url}"
            for attempt in $(seq 1 10); do
              code=$(curl -sS -L -o /tmp/n7-route.html -w '%{http_code}' --connect-timeout 5 --max-time 20 "$url" || true)
              if [ "$code" = "200" ] && grep -aFq 'N7 Customer Value OS' /tmp/n7-route.html; then
                echo "PASS ${label}"
                return 0
              fi
              echo "Attempt ${attempt}: HTTP ${code}"
              sleep 2
            done
            echo "FAIL ${label}"
            head -c 1200 /tmp/n7-route.html || true
            return 1
          }
          for section in "${sections[@]}"; do
            check_route "$section" "https://n7crm.clintware.com/customers/official-case/${section}"
          done
          check_route "legacy virtual-liaison alias" "https://n7crm.clintware.com/customers/official-case/virtual-liaison"
