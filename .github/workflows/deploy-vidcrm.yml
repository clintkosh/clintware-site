name: Deploy Vanish Fluid CRM Demo

on:
  push:
    branches: [main]
    paths:
      - "vidcrm-worker/**"
      - "control-plane/**"
      - ".github/workflows/deploy-vidcrm.yml"
  pull_request:
    paths:
      - "vidcrm-worker/**"
      - "control-plane/**"
      - ".github/workflows/deploy-vidcrm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vidcrm-fluid-system
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --prefix vidcrm-worker --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run check --prefix vidcrm-worker
      - name: Validate vidCRM analytics integration
        run: |
          set -euo pipefail
          grep -Fq 'G-DCY144YM9P' vidcrm-worker/src/index.js
          grep -Fq 'www.googletagmanager.com/gtag/js' vidcrm-worker/src/index.js
          grep -Fq "gtag('config'" vidcrm-worker/src/index.js
          grep -Fq 'googletagmanager.com' vidcrm-worker/src/index.js
          grep -Fq 'google-analytics.com' vidcrm-worker/src/index.js
      - name: Wrangler dry run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --prefix vidcrm-worker wrangler deploy --dry-run --config vidcrm-worker/wrangler.jsonc

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require demo password verifier before touching production
        env:
          VIDCRM_DEMO_PASSWORD_SHA256: ${{ secrets.VIDCRM_DEMO_PASSWORD_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$VIDCRM_DEMO_PASSWORD_SHA256" || { echo "VIDCRM_DEMO_PASSWORD_SHA256 is not configured" >&2; exit 1; }
      - name: Install dependencies
        run: npm install --prefix vidcrm-worker --ignore-scripts --no-audit --no-fund
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd vidcrm-worker
      - name: Sync protected runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VIDCRM_DEMO_PASSWORD_SHA256: ${{ secrets.VIDCRM_DEMO_PASSWORD_SHA256 }}
          VIDCRM_INGEST_TOKEN_OPTIONAL: ${{ secrets.VIDCRM_INGEST_TOKEN }}
        run: |
          set -euo pipefail
          # Derive non-user-facing runtime secrets from the existing Cloudflare
          # deployment credential so no new plaintext credentials enter git.
          session_secret=$(python3 - <<'PY'
          import hashlib, os
          print(hashlib.sha256(("vidcrm-session-v1:"+os.environ["CLOUDFLARE_API_TOKEN"]).encode()).hexdigest())
          PY
          )
          if [ -n "$VIDCRM_INGEST_TOKEN_OPTIONAL" ]; then
            ingest_token="$VIDCRM_INGEST_TOKEN_OPTIONAL"
          else
            ingest_token=$(python3 - <<'PY'
          import hashlib, os
          print(hashlib.sha256(("vidcrm-ingest-v1:"+os.environ["CLOUDFLARE_API_TOKEN"]).encode()).hexdigest())
          PY
            )
          fi
          echo "::add-mask::$session_secret"
          echo "::add-mask::$ingest_token"
          cd vidcrm-worker
          put_secret() { printf '%s' "$2" | npx wrangler secret put "$1" >/dev/null; }
          put_secret VIDCRM_DEMO_PASSWORD_SHA256 "$VIDCRM_DEMO_PASSWORD_SHA256"
          put_secret VIDCRM_SESSION_SECRET "$session_secret"
          put_secret VIDCRM_INGEST_TOKEN "$ingest_token"
      - name: Verify public health and auth gate
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 24); do
            body=$(curl -fsS --max-time 20 https://vidcrmdemo.clintware.com/health || true)
            if echo "$body" | grep -Fq '"product":"vidcrm"'; then
              echo "$body"
              echo "$body" | grep -Fq '"auth_configured":true'
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"
          page=$(curl -fsS --max-time 20 https://vidcrmdemo.clintware.com/)
          echo "$page" | grep -Fq 'Vanish Fluid System'
          if echo "$page" | grep -Fq 'Account Context'; then
            echo "Protected workspace leaked without authentication" >&2
            exit 1
          fi
