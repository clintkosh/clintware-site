name: Deploy Vanish Fluid CRM Demo

on:
  push:
    branches: [main]
    paths:
      - "vidcrm-worker/**"
      - "control-plane/manifests/vidcrm.json"
      - ".github/workflows/deploy-vidcrm.yml"
  pull_request:
    paths:
      - "vidcrm-worker/**"
      - "control-plane/manifests/vidcrm.json"
      - ".github/workflows/deploy-vidcrm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vidcrm-fluid-system
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --prefix vidcrm-worker --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run check --prefix vidcrm-worker
      - name: Validate vidCRM analytics integration
        run: |
          set -euo pipefail
          grep -Fq 'G-DCY144YM9P' vidcrm-worker/src/index.js
          grep -Fq 'www.googletagmanager.com/gtag/js' vidcrm-worker/src/index.js
          grep -Fq "gtag('config'" vidcrm-worker/src/index.js
          grep -Fq 'googletagmanager.com' vidcrm-worker/src/index.js
          grep -Fq 'google-analytics.com' vidcrm-worker/src/index.js
      - name: Wrangler dry run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --prefix vidcrm-worker wrangler deploy --dry-run --config vidcrm-worker/wrangler.jsonc

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require runtime secrets before touching production
        env:
          VIDCRM_DEMO_PASSWORD_SHA256: ${{ secrets.VIDCRM_DEMO_PASSWORD_SHA256 }}
          VIDCRM_SESSION_SECRET: ${{ secrets.VIDCRM_SESSION_SECRET }}
          VIDCRM_INGEST_TOKEN: ${{ secrets.VIDCRM_INGEST_TOKEN }}
          CONTROL_PLANE_ADMIN_TOKEN: ${{ secrets.CONTROL_PLANE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VIDCRM_DEMO_PASSWORD_SHA256" || { echo "VIDCRM_DEMO_PASSWORD_SHA256 is not configured" >&2; exit 1; }
          test -n "$VIDCRM_SESSION_SECRET" || { echo "VIDCRM_SESSION_SECRET is not configured" >&2; exit 1; }
          test -n "$VIDCRM_INGEST_TOKEN" || { echo "VIDCRM_INGEST_TOKEN is not configured" >&2; exit 1; }
          test -n "$CONTROL_PLANE_ADMIN_TOKEN" || { echo "CONTROL_PLANE_ADMIN_TOKEN is not configured" >&2; exit 1; }
      - name: Install dependencies
        run: npm install --prefix vidcrm-worker --ignore-scripts --no-audit --no-fund
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd vidcrm-worker
      - name: Register vidCRM and sync runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_PLANE_ADMIN_TOKEN: ${{ secrets.CONTROL_PLANE_ADMIN_TOKEN }}
          VIDCRM_DEMO_PASSWORD_SHA256: ${{ secrets.VIDCRM_DEMO_PASSWORD_SHA256 }}
          VIDCRM_SESSION_SECRET: ${{ secrets.VIDCRM_SESSION_SECRET }}
          VIDCRM_INGEST_TOKEN: ${{ secrets.VIDCRM_INGEST_TOKEN }}
        run: |
          set -euo pipefail

          # Register the least-privilege product manifest. The manifest itself
          # contains no credentials; the admin credential never leaves Actions.
          curl --fail-with-body -sS -X POST https://mcp.clintware.com/api/v1/products/register \
            -H "Authorization: Bearer ${CONTROL_PLANE_ADMIN_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @control-plane/manifests/vidcrm.json >/tmp/vidcrm-register.json

          # Mint a scoped runtime token and inject it directly into the Worker.
          # Only the token hash remains in the Control Plane registry.
          client_json=$(curl --fail-with-body -sS -X POST https://mcp.clintware.com/api/v1/products/client \
            -H "Authorization: Bearer ${CONTROL_PLANE_ADMIN_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"product":"vidcrm"}')
          control_plane_token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$client_json")
          echo "::add-mask::$control_plane_token"

          cd vidcrm-worker
          put_secret() { printf '%s' "$2" | npx wrangler secret put "$1" >/dev/null; }
          put_secret VIDCRM_DEMO_PASSWORD_SHA256 "$VIDCRM_DEMO_PASSWORD_SHA256"
          put_secret VIDCRM_SESSION_SECRET "$VIDCRM_SESSION_SECRET"
          put_secret VIDCRM_INGEST_TOKEN "$VIDCRM_INGEST_TOKEN"
          put_secret VIDCRM_CONTROL_PLANE_TOKEN "$control_plane_token"
      - name: Verify public health and auth gate
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 24); do
            body=$(curl -fsS --max-time 20 https://vidcrmdemo.clintware.com/health || true)
            if echo "$body" | grep -Fq '"product":"vidcrm"'; then
              echo "$body"
              echo "$body" | grep -Fq '"auth_configured":true'
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"
          page=$(curl -fsS --max-time 20 https://vidcrmdemo.clintware.com/)
          echo "$page" | grep -Fq 'Vanish Fluid System'
          if echo "$page" | grep -Fq 'Account Context'; then
            echo "Protected workspace leaked without authentication" >&2
            exit 1
          fi
