name: Deploy Dedicated Clintware Product Workers

on:
  push:
    branches: [main]
    paths:
      - "product-sites/**"
      - "shouldersoldier-worker/**"
      - "buyerorigin-worker/**"
      - "buyerorigin-shopify/**"
      - "landtheplane-worker/**"
      - "landtheplane-review-worker/**"
      - ".github/workflows/deploy-product-sites.yml"
  pull_request:
    paths:
      - "product-sites/**"
      - "shouldersoldier-worker/**"
      - "buyerorigin-worker/**"
      - "buyerorigin-shopify/**"
      - "landtheplane-worker/**"
      - "landtheplane-review-worker/**"
      - ".github/workflows/deploy-product-sites.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-product-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker syntax
        run: |
          node --check product-sites/src/index.js
          node --check shouldersoldier-worker/src/index.js
          node --check buyerorigin-worker/src/index.js
          node --check buyerorigin-worker/src/browser-engine.js
          node --check buyerorigin-worker/src/browser-app.js
          node --check landtheplane-worker/src/index.js
          node --check landtheplane-review-worker/src/index.js
      - name: Test BuyerOrigin browser audit
        run: npm test --prefix buyerorigin-worker
      - name: Check BuyerOrigin browser audit syntax
        run: npm run check --prefix buyerorigin-worker
      - name: Test BuyerOrigin Shopify logic
        run: npm test --prefix buyerorigin-shopify
      - name: Check BuyerOrigin Shopify source
        run: npm run check --prefix buyerorigin-shopify
      - name: Install and generate BuyerOrigin Shopify app
        working-directory: buyerorigin-shopify
        run: |
          npm install --no-audit --no-fund
          npx prisma validate
          npx prisma generate
      - name: Typecheck BuyerOrigin Shopify app
        working-directory: buyerorigin-shopify
        env:
          SHOPIFY_API_KEY: test-client-id
          SHOPIFY_API_SECRET: test-secret
          SHOPIFY_APP_URL: https://buyerorigin.invalid
          BUYERORIGIN_MASTER_KEY: ci-test-master-key-not-for-production
          SCOPES: read_orders,write_discounts
        run: npm run typecheck
      - name: Build BuyerOrigin Shopify app
        working-directory: buyerorigin-shopify
        env:
          SHOPIFY_API_KEY: test-client-id
          SHOPIFY_API_SECRET: test-secret
          SHOPIFY_APP_URL: https://buyerorigin.invalid
          BUYERORIGIN_MASTER_KEY: ci-test-master-key-not-for-production
          SCOPES: read_orders,write_discounts
        run: npm run build
      - name: Test ShoulderSoldier interaction evaluator
        run: node --test shouldersoldier-worker/test/*.test.mjs
      - name: Validate Worker configurations
        run: |
          XDG_CONFIG_HOME=/tmp/clintware-products-xdg npx --yes --cache /tmp/clintware-products-npm-cache wrangler@4 deploy --dry-run --config product-sites/wrangler.jsonc
          XDG_CONFIG_HOME=/tmp/clintware-products-xdg npx --yes --cache /tmp/clintware-products-npm-cache wrangler@4 deploy --dry-run --config shouldersoldier-worker/wrangler.jsonc
          XDG_CONFIG_HOME=/tmp/clintware-products-xdg npx --yes --cache /tmp/clintware-products-npm-cache wrangler@4 deploy --dry-run --config buyerorigin-worker/wrangler.jsonc
          XDG_CONFIG_HOME=/tmp/clintware-products-xdg npx --yes --cache /tmp/clintware-products-npm-cache wrangler@4 deploy --dry-run --config landtheplane-worker/wrangler.jsonc
          XDG_CONFIG_HOME=/tmp/clintware-products-xdg npx --yes --cache /tmp/clintware-products-npm-cache wrangler@4 deploy --dry-run --config landtheplane-review-worker/wrangler.jsonc
      - name: Check pull-request diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

  deploy-shouldersoldier:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy ShoulderSoldier Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd shouldersoldier-worker

  deploy-buyerorigin:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy BuyerOrigin Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd buyerorigin-worker
      - name: Verify BuyerOrigin
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            page=$(curl -sS --connect-timeout 5 --max-time 15 https://buyerorigin.clintware.com/ || true)
            health=$(curl -sS --connect-timeout 5 --max-time 15 https://buyerorigin.clintware.com/healthz || true)
            if grep -Fq 'Stop the same buyer from using the same coupon again.' <<< "$page" && grep -Fq 'same-coupon-reuse-audit' <<< "$health"; then exit 0; fi
            sleep 3
          done
          exit 1

  deploy-landtheplane:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy LandThePlane Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd landtheplane-worker

  deploy-landtheplane-review:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy LandThePlane Interview Review Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd landtheplane-review-worker
