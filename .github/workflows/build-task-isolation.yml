name: Build Clintware Task Isolation

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/task-isolation/**'
      - '.github/workflows/build-task-isolation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Format and build Windows GUI executable
        shell: pwsh
        run: |
          Push-Location tools/task-isolation
          gofmt -w main.go
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o ../../Clintware-TaskIsolation.exe .
          Pop-Location

      - name: Run embedded self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\Clintware-TaskIsolation.exe" -ArgumentList "--selftest" -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "Task Isolation self-test failed: $($p.ExitCode)" }

      - name: End-to-end Scheduled Task simulation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $task = "CI Console Popup Canary"
          $marker = Join-Path $env:WINDIR "Temp\clintware-task-isolation-canary.txt"
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue

          # Create the exact class of task we are trying to fix: recurring PowerShell.
          $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument ('-NoProfile -Command "Set-Content -LiteralPath ''' + $marker + ''' -Value background-canary"')
          $trigger = New-ScheduledTaskTrigger -Once -At ((Get-Date).AddMinutes(1)) -RepetitionInterval (New-TimeSpan -Minutes 1)
          $settings = New-ScheduledTaskSettingsSet -MultipleInstances IgnoreNew
          Register-ScheduledTask -TaskName $task -Action $action -Trigger $trigger -Settings $settings -User "SYSTEM" -RunLevel Highest | Out-Null

          $before = Get-ScheduledTask -TaskName $task
          $beforeXml = [xml](Export-ScheduledTask -TaskName $task)
          $beforeUser = [string]$beforeXml.Task.Principals.Principal.UserId
          $beforeTrigger = [string]$beforeXml.Task.Triggers.TimeTrigger.Repetition.Interval
          if ($before.Actions[0].Execute -notmatch "powershell") { throw "Canary did not start as PowerShell" }

          # Apply the real production binary, silently.
          $p = Start-Process -FilePath ".\Clintware-TaskIsolation.exe" -ArgumentList "--quiet" -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) {
            $diag = Join-Path $env:ProgramData "Clintware\TaskIsolation\last-run.log"
            if (Test-Path $diag) { Get-Content $diag | Write-Host }
            throw "Isolation run failed: $($p.ExitCode)"
          }

          $after = Get-ScheduledTask -TaskName $task
          $afterXml = [xml](Export-ScheduledTask -TaskName $task)
          if ($after.Actions[0].Execute -notmatch "Clintware-TaskIsolation.exe") { throw "Canary action was not routed through Task Isolation" }
          if ($after.Actions[0].Arguments -notmatch "--worker-b64") { throw "Hidden worker payload missing" }
          if ([string]$afterXml.Task.Principals.Principal.UserId -ne $beforeUser) { throw "Task principal changed" }
          if ([string]$afterXml.Task.Triggers.TimeTrigger.Repetition.Interval -ne $beforeTrigger) { throw "Task repetition trigger changed" }

          # Execute the rewritten task and prove the original payload still runs.
          Start-ScheduledTask -TaskName $task
          $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $marker)) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path $marker)) {
            $ti = Get-ScheduledTaskInfo -TaskName $task
            $ta = (Get-ScheduledTask -TaskName $task).Actions[0]
            Write-Host ("CANARY_LAST_RESULT=" + $ti.LastTaskResult)
            Write-Host ("CANARY_ACTION=" + $ta.Execute + " " + $ta.Arguments)
            throw "Rewritten task did not execute original PowerShell payload"
          }
          if ((Get-Content $marker -Raw).Trim() -ne "background-canary") { throw "Canary payload output mismatch" }

          # Verify the executable is GUI-subsystem; no console is allocated by the helper itself.
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path ".\Clintware-TaskIsolation.exe"))
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $opt = $pe + 24
          $magic = [BitConverter]::ToUInt16($bytes, $opt)
          $subOffset = $opt + 0x44
          $subsystem = [BitConverter]::ToUInt16($bytes, $subOffset)
          if ($subsystem -ne 2) { throw "Expected Windows GUI subsystem (2), got $subsystem" }

          Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          "TASK_ISOLATION_SIMULATION=PASS"

      - name: Verify executable and checksum
        shell: pwsh
        run: |
          $exe = Resolve-Path ".\Clintware-TaskIsolation.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Invalid PE/MZ executable" }
          if ((Get-Item $exe).Length -lt 500000) { throw "Unexpectedly small executable" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Clintware-TaskIsolation.exe" | Set-Content Clintware-TaskIsolation-SHA256.txt
          "SHA256=$hash"
          "SIZE=$((Get-Item $exe).Length)"

      - name: Publish executable to site and QQ runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path downloads,quillgeist-lite/tools | Out-Null
          Copy-Item Clintware-TaskIsolation.exe downloads/Clintware-TaskIsolation.exe -Force
          Copy-Item Clintware-TaskIsolation-SHA256.txt downloads/Clintware-TaskIsolation-SHA256.txt -Force
          Copy-Item Clintware-TaskIsolation.exe quillgeist-lite/tools/Clintware-TaskIsolation.exe -Force
          Copy-Item Clintware-TaskIsolation-SHA256.txt quillgeist-lite/tools/Clintware-TaskIsolation-SHA256.txt -Force
          git config user.name "clintware-build"
          git config user.email "actions@users.noreply.github.com"
          git add tools/task-isolation/main.go downloads/Clintware-TaskIsolation.exe downloads/Clintware-TaskIsolation-SHA256.txt quillgeist-lite/tools/Clintware-TaskIsolation.exe quillgeist-lite/tools/Clintware-TaskIsolation-SHA256.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish hardened Task Isolation Windows build"
            git push
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Clintware-TaskIsolation-win-x64
          path: |
            Clintware-TaskIsolation.exe
            Clintware-TaskIsolation-SHA256.txt
          retention-days: 30
