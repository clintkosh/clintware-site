name: Deploy Clintware Blog Newsletter

on:
  push:
    branches: [main]
    paths:
      - "newsletter/**"
      - ".github/workflows/deploy-newsletter-worker.yml"
  pull_request:
    paths:
      - "newsletter/**"
      - ".github/workflows/deploy-newsletter-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-blog-newsletter
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run newsletter unit tests
        run: npm --prefix newsletter test
      - name: Validate Worker configuration
        run: XDG_CONFIG_HOME=/tmp/clintware-newsletter-xdg npx --yes --cache /tmp/clintware-newsletter-npm-cache wrangler@4 deploy --dry-run --config newsletter/wrangler.jsonc

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy newsletter Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd newsletter --keep-vars
      - name: Configure delegated Google broker access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          google_bridge_secret=$(printf 'clintware-google-delegated:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          printf '%s' "$google_bridge_secret" | npx --yes wrangler@4 secret put GOOGLE_DELEGATED_BRIDGE_SECRET --config newsletter/wrangler.jsonc

      - name: Configure publish authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          publish_secret=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          printf '%s' "$publish_secret" | npx --yes wrangler@4 secret put NEWSLETTER_PUBLISH_SECRET --config newsletter/wrangler.jsonc
      - name: Configure internal mail authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          internal_mail_secret=$(printf 'clintware-internal-mail:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          printf '%s' "$internal_mail_secret" | npx --yes wrangler@4 secret put INTERNAL_MAIL_SECRET --config newsletter/wrangler.jsonc
      - name: Verify broker wiring and first-party newsletter endpoint
        run: |
          set -euo pipefail
          grant=$(curl -fsS --connect-timeout 5 --max-time 20 https://auth.clintware.com/delegated/google/status || echo '{"connected":false}')
          echo "$grant"
          if echo "$grant" | grep -Fq '"connected":true'; then
            echo "Delegated Google grant is active."
          else
            echo "Delegated Google grant is not active yet. Publications will queue until one-time consent is completed."
          fi

          ready=0
          for i in $(seq 1 24); do
            body=$(curl -fsS --connect-timeout 5 --max-time 20 https://newsletter.clintware.com/health || true)
            if echo "$body" | grep -Fq '"ok":true' && echo "$body" | grep -Fq '"deliveryConfigured":true'; then
              ready=1
              echo "$body"
              break
            fi
            echo "Waiting for newsletter.clintware.com ($i/24)"
            sleep 5
          done
          test "$ready" = "1"
