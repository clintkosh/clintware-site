name: Deploy Clintware Blog Newsletter

on:
  push:
    branches: [main]
    paths:
      - "newsletter/**"
      - ".github/workflows/deploy-newsletter-worker.yml"
  pull_request:
    paths:
      - "newsletter/**"
      - ".github/workflows/deploy-newsletter-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-blog-newsletter
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run newsletter unit tests
        run: npm --prefix newsletter test
      - name: Validate Worker configuration
        run: XDG_CONFIG_HOME=/tmp/clintware-newsletter-xdg npx --yes --cache /tmp/clintware-newsletter-npm-cache wrangler@4 deploy --dry-run --config newsletter/wrangler.jsonc

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy newsletter Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd newsletter --keep-vars
      - name: Check Google delegated-access prerequisites
        id: google_ready
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_DELEGATED_REFRESH_TOKEN: ${{ secrets.GOOGLE_DELEGATED_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_OAUTH_CLIENT_ID" ] && [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ] && [ -n "$GOOGLE_DELEGATED_REFRESH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Google delegated access is not configured yet; Worker code deployed without Gmail delivery activation."
          fi

      - name: Configure Gmail OAuth delivery
        if: steps.google_ready.outputs.ready == 'true'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_DELEGATED_REFRESH_TOKEN: ${{ secrets.GOOGLE_DELEGATED_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_OAUTH_CLIENT_ID" | npx --yes wrangler@4 secret put GOOGLE_OAUTH_CLIENT_ID --config newsletter/wrangler.jsonc
          printf '%s' "$GOOGLE_OAUTH_CLIENT_SECRET" | npx --yes wrangler@4 secret put GOOGLE_OAUTH_CLIENT_SECRET --config newsletter/wrangler.jsonc
          printf '%s' "$GOOGLE_DELEGATED_REFRESH_TOKEN" | npx --yes wrangler@4 secret put GOOGLE_DELEGATED_REFRESH_TOKEN --config newsletter/wrangler.jsonc

      - name: Configure publish authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          publish_secret=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          printf '%s' "$publish_secret" | npx --yes wrangler@4 secret put NEWSLETTER_PUBLISH_SECRET --config newsletter/wrangler.jsonc
      - name: Configure internal mail authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          internal_mail_secret=$(printf 'clintware-internal-mail:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          printf '%s' "$internal_mail_secret" | npx --yes wrangler@4 secret put INTERNAL_MAIL_SECRET --config newsletter/wrangler.jsonc
