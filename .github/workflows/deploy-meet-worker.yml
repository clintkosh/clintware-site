name: Deploy Meet Redirect

on:
  push:
    branches: [main]
    paths:
      - "meet-worker/**"
      - ".github/workflows/deploy-meet-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-meet
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Meet Worker
        run: npx --yes wrangler@4 deploy --dry-run --config meet-worker/wrangler.jsonc

      - name: Deploy Meet Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd meet-worker

      - name: Attach or verify meet.clintware.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          current=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=meet.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          correct=$(python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); print("yes" if d.get("success") is True and len(r)==1 and r[0].get("hostname")=="meet.clintware.com" and r[0].get("service")=="clintware-meet" else "no")' <<< "$current")
          if [ "$correct" != "yes" ]; then
            curl --fail-with-body -sS -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"hostname":"meet.clintware.com","service":"clintware-meet"}' >/tmp/meet-domain-put.json
            python3 -c 'import json; d=json.load(open("/tmp/meet-domain-put.json")); assert d.get("success") is True,d'
          fi
          verify=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=meet.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True and len(r)==1,d; x=r[0]; assert x.get("hostname")=="meet.clintware.com" and x.get("service")=="clintware-meet",x; print("Meet domain verified:",x["hostname"],"->",x["service"])' <<< "$verify"

      - name: Verify public HTTPS redirect
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 24); do
            headers=$(curl -sS -D - --connect-timeout 5 --max-time 20 "https://meet.clintware.com/?release=${GITHUB_SHA}" -o /dev/null || true)
            if grep -Eq '^HTTP/[^ ]+ 302' <<< "$headers" \
              && grep -Fqi 'location: https://koalendar.com/e/meet-with-clinton' <<< "$headers"; then
              echo 'meet.clintware.com is live over HTTPS and redirects to Koalendar.'
              ready=1
              break
            fi
            echo "Waiting for meet.clintware.com propagation ($i/24)"
            sleep 5
          done
          test "$ready" = "1"
