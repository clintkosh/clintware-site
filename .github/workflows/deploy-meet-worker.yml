name: Deploy Meet Scheduler

on:
  push:
    branches: [main]
    paths:
      - "meet-worker/**"
      - ".github/workflows/deploy-meet-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-meet
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Meet Worker
        run: |
          node --check meet-worker/src/worker.js
          npx --yes wrangler@4 deploy --dry-run --config meet-worker/wrangler.jsonc

      - name: Deploy Meet Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd meet-worker

      - name: Attach or verify meet.clintware.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          current=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=meet.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          correct=$(python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); print("yes" if d.get("success") is True and len(r)==1 and r[0].get("hostname")=="meet.clintware.com" and r[0].get("service")=="clintware-meet" else "no")' <<< "$current")
          if [ "$correct" != "yes" ]; then
            curl --fail-with-body -sS -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"hostname":"meet.clintware.com","service":"clintware-meet"}' >/tmp/meet-domain-put.json
            python3 -c 'import json; d=json.load(open("/tmp/meet-domain-put.json")); assert d.get("success") is True,d'
          fi
          verify=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=meet.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True and len(r)==1,d; x=r[0]; assert x.get("hostname")=="meet.clintware.com" and x.get("service")=="clintware-meet",x; print("Meet domain verified:",x["hostname"],"->",x["service"])' <<< "$verify"

      - name: Verify public inline scheduler
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 24); do
            headers=$(mktemp)
            body=$(mktemp)
            code=$(curl -sS -D "$headers" --connect-timeout 5 --max-time 20 \
              -o "$body" -w '%{http_code}' "https://meet.clintware.com/?release=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ] \
              && grep -Fq 'CLINTWARE™' "$body" \
              && grep -Fq 'GO FURTHEST.™' "$body" \
              && grep -Fq 'https://koalendar.com/assets/widget.js' "$body" \
              && grep -Fq "Koalendar('inline'" "$body" \
              && grep -Fq 'https://koalendar.com/e/meet-with-clinton' "$body" \
              && ! grep -Eqi '^location:' "$headers"; then
              echo 'meet.clintware.com serves the Koalendar inline widget without redirecting.'
              ready=1
              rm -f "$headers" "$body"
              break
            fi
            rm -f "$headers" "$body"
            echo "Waiting for inline scheduler deployment ($i/24)"
            sleep 5
          done
          test "$ready" = "1"

      - name: Verify health endpoint
        run: |
          set -euo pipefail
          curl --fail-with-body -sS https://meet.clintware.com/health | grep -Fq '"mode":"koalendar-inline"'
