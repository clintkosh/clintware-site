name: Quillgeist Final Live Check

on:
  pull_request:
    paths:
      - ".github/workflows/quillgeist-final-live-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloudflare binding and production endpoints
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          current=$(curl --fail-with-body -sS \
            "${base}/workers/domains?hostname=quillgeist.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          python3 -c 'import json,sys; d=json.load(sys.stdin); r=[x for x in (d.get("result") or []) if x.get("hostname")=="quillgeist.clintware.com"]; print("domain_count=",len(r)); print("domain_services=",[x.get("service") for x in r]); assert d.get("success") is True and len(r)==1 and r[0].get("service")=="clintware-agentbridge"' <<< "$current"

          page_code=$(curl -L -sS -o /tmp/page -w '%{http_code}' --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/)
          health_code=$(curl -L -sS -o /tmp/health -w '%{http_code}' --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/api/health)
          app_code=$(curl -L -sS -o /tmp/app -w '%{http_code}' --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/app.js)
          echo "page_http=${page_code} health_http=${health_code} app_http=${app_code}"
          test "$page_code" = "200"
          test "$health_code" = "200"
          test "$app_code" = "200"
          grep -Fq 'QUILLGEIST' /tmp/page
          grep -Fq '"service":"Quillgeist Cloud"' /tmp/health
          grep -Fq 'Quillgeist Cloud ready.' /tmp/app
          grep -Fq 'Run the downloaded Quillgeist executable with <code>pair</code>' /tmp/page
          grep -Fq 'Run the downloaded Quillgeist executable with <code>pair</code>' /tmp/app
