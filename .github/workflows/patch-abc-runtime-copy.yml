name: Patch ABC Runtime Copy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-abc-runtime-copy.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply post-render Abnormal copy mapping
        run: |
          set -euo pipefail
          python3 -c "import base64;exec(base64.b64decode(''))"
          node --check abc/src/index.js
          node abc/tests/smoke.mjs
          node abc/tests/auth-roundtrip.mjs
          python3 abc/tests/regression.py
          python3 tests/validate_crm_analytics.py
          grep -Fq 'function applyAbnormalRuntimeCopy()' abc/src/index.js
          grep -Fq "['BUSINESS RHYTHM','VALUE REALIZATION']" abc/src/index.js
      - name: Commit runtime copy patch
        run: |
          set -euo pipefail
          if git diff --quiet -- abc/src/index.js; then
            echo "Runtime copy patch already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add abc/src/index.js
          git commit -m "Apply Abnormal copy after ABC renders"
          git push origin HEAD:main
