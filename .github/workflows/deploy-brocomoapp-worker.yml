name: Deploy Brocomo Application

on:
  push:
    branches: [main]
    paths:
      - "brocomoapp-worker/**"
      - ".github/workflows/deploy-brocomoapp-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-brocomoapp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Brocomo Worker
        run: npx --yes wrangler@4 deploy --dry-run --config brocomoapp-worker/wrangler.jsonc
      - name: Deploy Brocomo Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd brocomoapp-worker
