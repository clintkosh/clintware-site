name: Diagnose ABC final model
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-abc-final-model.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect bundle globals and live gate initialization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          parts=[]
          for p in sorted(Path('abc/src').glob('app-part*.js')):
            parts.append(re.search(r'"([A-Za-z0-9+/=]+)"',p.read_text()).group(1))
          h=gzip.decompress(base64.b64decode(''.join(parts))).decode()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',h,re.I)
          print('APP_SCRIPT_COUNT',len(scripts))
          names=['PASS','SESSION_KEY','DEMO_ID','sendEvent','unlock','lock','bindGate','notify','trackPageView']
          for name in names:
            hits=[]
            for i,s in enumerate(scripts):
              for m in re.finditer(r'\b(?:const|let|var|function)\s+'+re.escape(name)+r'\b',s): hits.append((i,m.start(),s[max(0,m.start()-80):m.start()+180]))
            print('GLOBAL',name,'COUNT',len(hits))
            for x in hits: print(x)
          PY
          mkdir -p /tmp/abc-model && cd /tmp/abc-model
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core >/dev/null 2>&1
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          cat > diag.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage();
          const errs=[],consoleErrors=[];
          page.on('pageerror',e=>errs.push({message:String(e),stack:e.stack||''}));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          await page.goto('https://abc.clintware.com/?gatediag='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(2000);
          const diag=await page.evaluate(()=>({
            readyState:document.readyState,
            gate:!!document.querySelector('#gate'),
            form:!!document.querySelector('#access-form'),
            handler:typeof document.querySelector('#access-form')?.onsubmit,
            gateScript:!!document.querySelector('#dtex-gate-js'),
            gateScriptLen:document.querySelector('#dtex-gate-js')?.textContent.length||0,
            bindGateType:typeof window.bindGate,
            unlocked:document.body.classList.contains('unlocked'),
            storageKeys:Object.keys(localStorage),
            sessionKeys:Object.keys(sessionStorage),
            appText:(document.querySelector('#app')?.textContent||'').slice(0,300)
          }));
          console.log('DIAG',JSON.stringify(diag));
          console.log('PAGE_ERRORS',JSON.stringify(errs));
          console.log('CONSOLE_ERRORS',JSON.stringify(consoleErrors));
          console.log('SCRIPTS',JSON.stringify(await page.evaluate(()=>[...document.scripts].map((s,i)=>({i,id:s.id||'',src:s.src||'',len:(s.textContent||'').length,sample:(s.textContent||'').slice(0,100)})))));
          await browser.close();
          NODE
          CHROME="$chrome" node diag.mjs
