name: Deploy Legacy Abnormal CS Worker

on:
  push:
    branches: [main]
    paths:
      - "abnormal/**"
      - ".github/workflows/deploy-abnormal-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abnormal-cs-command-center
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abnormal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker and workspace syntax
        run: |
          node --check src/worker.js
          node --check src/enhancer.js
          node --check src/account-users.js
          node --check src/functional-cards.js
      - name: Smoke test workspace injection and inspect base startup
        run: |
          node tests/enhancer.mjs
          node tests/account-users.mjs
          node tests/analyze-base.mjs
      - name: Probe base CRM in Chrome before workspace E2E
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$chrome"
          CHROME="$chrome" timeout 20s node tests/cdp-probe.mjs
      - name: Validate account user workflow in real Chrome via DevTools
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$chrome"
          CHROME="$chrome" timeout 35s node tests/account-users-browser.mjs
      - name: Validate privacy and analytics guardrails
        run: |
          python3 tests/regression.py
          python3 ../tests/validate_crm_analytics.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy legacy worker without production custom-domain binding
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd abnormal
      - name: Confirm production hostname is owned by promoted ABC service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=an.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert len(r)==1,d; x=r[0]; assert x.get("service")=="abnormal-enterprise-customer-success",x; print("Production hostname preserved:",x["hostname"],"->",x["service"])'
