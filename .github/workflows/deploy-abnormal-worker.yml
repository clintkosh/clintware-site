name: Deploy Abnormal CS Command Center

on:
  push:
    branches: [main]
    paths:
      - "abnormal/**"
      - ".github/workflows/deploy-abnormal-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abnormal-cs-command-center
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abnormal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker and workspace syntax
        run: |
          node --check src/worker.js
          node --check src/enhancer.js
          node --check src/account-users.js
      - name: Smoke test workspace injection
        run: |
          node tests/enhancer.mjs
          node tests/account-users.mjs
      - name: Validate account user workflow in native Chrome
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$chrome"
          rm -rf /tmp/abnormal-browser-fixture
          node tests/account-users-browser.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/abnormal-browser-fixture >/tmp/abnormal-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          set +e
          timeout 20s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8765/ > /tmp/abnormal-browser-dom.html 2>/tmp/abnormal-chrome.err
          chrome_code=$?
          set -e
          if grep -Fq 'data-cw-browser-test="pass"' /tmp/abnormal-browser-dom.html && grep -Fq 'PASS: account open + 3 seeded stakeholders + add + edit + persistence + remove all work' /tmp/abnormal-browser-dom.html; then
            echo "PASS: native Chrome completed full editable account stakeholder workflow"
          else
            echo "Chrome exit code: $chrome_code"
            grep -o 'FAIL: [^<]*' /tmp/abnormal-browser-dom.html || true
            tail -80 /tmp/abnormal-chrome.err || true
            grep -Eo 'data-cw-browser-test="[^"]+"' /tmp/abnormal-browser-dom.html || true
            exit 1
          fi
      - name: Validate privacy and deployment guardrails
        run: python3 tests/regression.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy private CRM to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd abnormal
      - name: Verify an.clintware.com custom domain without unnecessary mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=an.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          count=$(echo "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(len(d.get("result",[])))')
          if [ "$count" = "0" ]; then
            response=$(curl --fail-with-body -sS -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"hostname":"an.clintware.com","service":"abnormal-cs-command-center"}')
          fi
          echo "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True, d; r=d.get("result",[]); x=(r[0] if isinstance(r,list) and r else r); assert x.get("hostname")=="an.clintware.com" and x.get("service")=="abnormal-cs-command-center", x; print("Custom domain verified:",x["hostname"],"->",x["service"])'
      - name: Verify private login gate over HTTPS
        run: |
          set -euo pipefail
          body=$(curl --fail-with-body -sS --retry 12 --retry-delay 5 --retry-all-errors https://an.clintware.com/)
          grep -Fq "Private Customer Success Command Center" <<< "$body"
          grep -Fq "Synthetic data only" <<< "$body"
          if grep -Fq "Portfolio Command" <<< "$body"; then
            echo "Authenticated CRM content leaked through the public gate" >&2
            exit 1
          fi
          echo "Live HTTPS gate verified: https://an.clintware.com"
