name: Deploy Abnormal CS Command Center

on:
  push:
    branches: [main]
    paths:
      - "abnormal/**"
      - ".github/workflows/deploy-abnormal-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abnormal-cs-command-center
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abnormal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker syntax
        run: node --check src/index.js
      - name: Validate privacy and deployment guardrails
        run: python3 tests/regression.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy private CRM to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd abnormal
