name: Deploy Abnormal CS Command Center

on:
  push:
    branches: [main]
    paths:
      - "abnormal/**"
      - ".github/workflows/deploy-abnormal-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abnormal-cs-command-center
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abnormal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker syntax
        run: node --check src/worker.js
      - name: Validate privacy and deployment guardrails
        run: python3 tests/regression.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy private CRM to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd abnormal
      - name: Attach an.clintware.com custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"hostname":"an.clintware.com","service":"abnormal-cs-command-center"}')
          echo "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("success") is True, data; print("Custom domain attached:", data["result"]["hostname"])'
      - name: Verify private login gate over HTTPS
        run: |
          set -euo pipefail
          body=$(curl --fail-with-body -sS --retry 12 --retry-delay 5 --retry-all-errors https://an.clintware.com/)
          grep -Fq "Private Abnormal CS concept" <<< "$body"
          grep -Fq "Synthetic data only" <<< "$body"
          if grep -Fq "Portfolio Command" <<< "$body"; then
            echo "Authenticated CRM content leaked through the public gate" >&2
            exit 1
          fi
          echo "Live HTTPS gate verified: https://an.clintware.com"
