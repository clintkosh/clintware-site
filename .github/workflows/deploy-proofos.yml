name: Deploy ProofOS

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Validate without deploying"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: clintware-proofos
  cancel-in-progress: true

jobs:
  proofos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify ProofOS deployment scaffold exists
        run: |
          set -euo pipefail
          test -f proofos/package.json || { echo "ProofOS package.json has not been implemented yet."; exit 2; }
          test -f proofos/wrangler.jsonc || { echo "ProofOS wrangler.jsonc has not been implemented yet."; exit 2; }

      - name: Install ProofOS dependencies
        run: npm install --prefix proofos --ignore-scripts --no-audit --no-fund

      - name: Run ProofOS checks
        working-directory: proofos
        run: |
          set -euo pipefail
          if npm run | grep -qE '^  check$'; then npm run check; fi
          if npm run | grep -qE '^  test$'; then npm test; fi
          if npm run | grep -qE '^  build$'; then npm run build; fi

      - name: Wrangler dry run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --prefix proofos wrangler deploy --dry-run --config proofos/wrangler.jsonc

      - name: Deploy ProofOS
        if: inputs.verify_only != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd proofos

      - name: Verify proof.clintware.com
        if: inputs.verify_only != 'true'
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 24); do
            body=$(curl -fsS --connect-timeout 5 --max-time 20 https://proof.clintware.com/health || true)
            if echo "$body" | grep -Fq '"proofos"'; then
              echo "$body"
              ready=1
              break
            fi
            echo "Waiting for ProofOS ($i/24)"
            sleep 5
          done
          test "$ready" = "1"
