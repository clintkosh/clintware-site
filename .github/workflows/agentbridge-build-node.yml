name: Build Quillgeist Desktop

on:
  push:
    branches: [main]
    paths:
      - "agentbridge-node/**"
      - ".github/workflows/agentbridge-build-node.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quillgeist-desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Quillgeist-Windows-x64
          - os: ubuntu-latest
            artifact: Quillgeist-Linux-x64
          - os: macos-14
            artifact: Quillgeist-macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Quillgeist build dependencies
        run: python -m pip install ./agentbridge-node "pyinstaller>=6.11,<7" "pytest>=8,<9"

      - name: Install Windows desktop dependencies
        if: matrix.os == 'windows-latest'
        run: python -m pip install "pystray>=0.19.5,<1" "Pillow>=10,<12"

      - name: Smoke-test real Windows desktop UI startup
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          QUILLGEIST_HOME: ${{ runner.temp }}/quillgeist-ui-smoke-home
        run: python -m pytest agentbridge-node/tests/test_desktop.py -q

      - name: Run usage ledger tests
        shell: bash
        run: python -m pytest agentbridge-node/tests/test_usage.py -q

      - name: Build portable Quillgeist CLI
        shell: bash
        run: pyinstaller --noconfirm --clean --onefile --name "${{ matrix.artifact }}" agentbridge-node/launcher.py

      - name: Verify portable executable identity and core commands
        shell: bash
        env:
          QUILLGEIST_HOME: ${{ runner.temp }}/quillgeist-home
          AGENTBRIDGE_HOME: ${{ runner.temp }}/quillgeist-home
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.artifact }}"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          test -f "$BIN"
          "$BIN" doctor
          "$BIN" help start --no-pager
          "$BIN" --help | tee quillgeist-help.txt
          if grep -qi "AgentBridge" quillgeist-help.txt; then
            echo "ERROR: legacy AgentBridge branding is exposed by the Quillgeist executable"
            exit 1
          fi

      - name: Build Windows desktop executable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Quillgeist" agentbridge-node/desktop_launcher.py

      - name: Smoke-test Windows desktop executable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:QUILLGEIST_HOME = "${{ runner.temp }}\quillgeist-desktop-home"
          $p = Start-Process -FilePath ".\dist\Quillgeist.exe" -ArgumentList "--smoke" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Desktop smoke test failed with exit code $($p.ExitCode)." }
          if (-not (Test-Path "$env:QUILLGEIST_HOME\activity.sqlite3")) { throw "Desktop smoke test did not initialize the local activity ledger." }
          Write-Host "Desktop smoke test passed."

      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "/DSourceDir=$env:GITHUB_WORKSPACE\dist" "/DOutputDir=$env:GITHUB_WORKSPACE\dist" "/DAppVersion=0.3.2-alpha" "agentbridge-node\installer\quillgeist.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path ".\dist\Quillgeist-Setup-Windows-x64.exe")) { throw "Installer was not produced." }

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib
          files = list(pathlib.Path("dist").glob("*"))
          for p in files:
              if not p.is_file() or p.suffix == ".sha256":
                  continue
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              pathlib.Path(str(p)+".sha256").write_text(f"{h}  {p.name}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}*
          if-no-files-found: error

      - name: Upload Windows desktop and installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Quillgeist-Windows-Desktop
          path: |
            dist/Quillgeist.exe
            dist/Quillgeist.exe.sha256
            dist/Quillgeist-Setup-Windows-x64.exe
            dist/Quillgeist-Setup-Windows-x64.exe.sha256
          if-no-files-found: error

  release-alpha:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate release assets
        run: |
          set -euo pipefail
          test -f release-assets/Quillgeist-Setup-Windows-x64.exe
          test -f release-assets/Quillgeist.exe
          test -f release-assets/Quillgeist-Windows-x64.exe
          test -f release-assets/Quillgeist-Linux-x64
          test -f release-assets/Quillgeist-macOS-arm64
          ls -lah release-assets

      - name: Publish Quillgeist v0.3.2 alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="quillgeist-v0.3.2-alpha"
          notes=$'Quillgeist v0.3.2 Windows desktop alpha.\n\nStreamlines the desktop around one obvious primary workflow: START HERE → enter the command in the main window → Prepare command → read result/status without opening a second command dialog. Ctrl+Alt+Space now opens Quillgeist and focuses the inline command field. The duplicate Ask / Compile button is removed, Start/Stop is consolidated into one runtime toggle, and secondary device/usage controls are kept out of the main command path.\n\nAlso retains automatic supported LLM login detection for OpenAI/Codex, Claude, Gemini, Ollama, OpenRouter, and Azure OpenAI without copying browser cookies or secret token values. Windows UI startup, inline-command behavior, provider/usage tests, packaged EXE smoke testing, and installer validation run before release.\n\nWindows recommended: download Quillgeist-Setup-Windows-x64.exe. Portable Windows CLI remains available as Quillgeist-Windows-x64.exe. macOS and Linux remain portable CLI alpha builds.\n\nUnsigned public-alpha builds. Local policy remains authoritative.'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
            gh release edit "$tag" --title "Quillgeist v0.3.2 Alpha" --notes "$notes" --prerelease
          else
            gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "Quillgeist v0.3.2 Alpha" --notes "$notes" --prerelease
          fi

      - name: Promote installer on latest Quillgeist Cloud
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B quillgeist-promote origin/main
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('agentbridge-cloud/public/index.html')
          text = p.read_text(encoding='utf-8')
          installer = 'https://github.com/clintkosh/clintware-site/releases/download/quillgeist-v0.3.2-alpha/Quillgeist-Setup-Windows-x64.exe'
          portable = 'https://github.com/clintkosh/clintware-site/releases/download/quillgeist-v0.3.2-alpha/Quillgeist-Windows-x64.exe'
          mac = 'https://github.com/clintkosh/clintware-site/releases/download/quillgeist-v0.3.2-alpha/Quillgeist-macOS-arm64'
          linux = 'https://github.com/clintkosh/clintware-site/releases/download/quillgeist-v0.3.2-alpha/Quillgeist-Linux-x64'
          text, n = re.subn(r'(<a class="btn primary wide" href=")[^"]+(\">Download Quillgeist for Windows</a>)', r'\1'+installer+r'\2', text, count=1)
          if n != 1: raise SystemExit('Windows primary download button not found')
          if 'Portable Windows CLI</a>' in text:
              text = re.sub(r'(<a class="btn ghost wide" href=")[^"]+(\">Portable Windows CLI</a>)', r'\1'+portable+r'\2', text, count=1)
          else:
              marker = f'<a class="btn primary wide" href="{installer}">Download Quillgeist for Windows</a>'
              text = text.replace(marker, marker+'\n        <a class="btn ghost wide" href="'+portable+'">Portable Windows CLI</a>', 1)
          text = re.sub(r'(<a class="btn ghost wide" href=")[^"]+(\">Download for macOS Apple Silicon</a>)', r'\1'+mac+r'\2', text, count=1)
          text = re.sub(r'(<a class="btn ghost wide" href=")[^"]+(\">Download for Linux x64</a>)', r'\1'+linux+r'\2', text, count=1)
          text = text.replace('1 · Download and run <code>init</code>', '1 · Install and launch Quillgeist', 1)
          p.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet -- agentbridge-cloud/public/index.html; then
            echo "Cloud download page already promoted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agentbridge-cloud/public/index.html
          git commit -m "Promote Quillgeist v0.3.2 Windows installer"
          git push origin HEAD:main
