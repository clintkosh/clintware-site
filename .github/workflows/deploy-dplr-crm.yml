name: Deploy DPLR TCE OS
on:
  push:
    branches: [main]
    paths:
      - "projects/dplr-crm/**"
      - "projects/dpl-crm/**"
      - "tests/dplr_browser_smoke.mjs"
      - ".github/workflows/deploy-dplr-crm.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clintware-dplr-crm
  cancel-in-progress: true
jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Materialize and validate browser-local source
        run: |
          set -euo pipefail
          node projects/dplr-crm/scripts/materialize.mjs
          cd .build/dplr-crm
          npm install --no-audit --no-fund
          npm run check
          ! grep -Fq '"durable_objects"' wrangler.jsonc
          grep -Fq '"deleted_classes"' wrangler.jsonc
          grep -Fq '/cw-astro-local-store.js' public/index.html
          grep -Fq 'databaseRowsPerDemoSession:0' src/index.js
          grep -Fq 'Webhook retry duplicates one takedown workflow action' public/cw-astro-local-bootstrap.js
          grep -Fq 'Sentinel routing misses one normalized entity field' public/cw-astro-local-bootstrap.js
          grep -Fq 'Custom enrichment worker receives HTTP 429' public/cw-astro-local-bootstrap.js
          grep -Fq 'Doppel Technical Customer Engineering OS' public/index.html
      - name: Wrangler dry run
        run: cd .build/dplr-crm && npx wrangler deploy --dry-run
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd .build/dplr-crm
      - name: Attach custom domain
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data '{"hostname":"dplcrm.clintware.com","service":"clintware-dplr-crm","zone_name":"clintware.com"}')
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d' <<< "$response"
      - name: Verify live stateless contract
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            h=$(curl -fsS https://dplcrm.clintware.com/health || true)
            p=$(curl -fsS https://dplcrm.clintware.com/ || true)
            b=$(curl -fsS https://dplcrm.clintware.com/cw-astro-local-bootstrap.js || true)
            if grep -Fq '"storage":"browser-local"' <<< "$h" && grep -Fq '"databaseRowsPerDemoSession":0' <<< "$h" && grep -Fq '"durableObjectsRequired":false' <<< "$h" && grep -Fq 'Doppel Technical Customer Engineering OS' <<< "$p" && grep -Fq 'Ironwood Bank' <<< "$b"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Real browser functional and persistence smoke
        timeout-minutes: 6
        run: |
          set -euo pipefail
          google-chrome --version
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          PLAYWRIGHT_CHANNEL=chrome timeout 240s node tests/dplr_browser_smoke.mjs
      - name: Upload DPLR browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dplr-browser-evidence
          path: |
            dplr-desktop-smoke.png
            dplr-mobile-smoke.png
            dplr-failure.png
          if-no-files-found: ignore
