name: Deploy Clintware Email Forwarder

on:
  push:
    paths:
      - "email-forwarder/**"
      - ".github/workflows/deploy-email-forwarder.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Email Worker and Wrangler-managed address trigger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd email-forwarder
          npx --yes wrangler@4.129.0 deploy --config wrangler.jsonc
