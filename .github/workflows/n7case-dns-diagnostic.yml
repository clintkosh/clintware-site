name: Diagnose Neuron7 Case DNS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/n7case-dns-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Cloudflare domain and DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          domains=$(curl --fail-with-body -sS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=n7case.clintware.com" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get("result",[]),indent=2))' <<< "$domains"
          zones=$(curl --fail-with-body -sS "https://api.cloudflare.com/client/v4/zones?name=clintware.com&account.id=${CLOUDFLARE_ACCOUNT_ID}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          zone_id=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["result"][0]["id"])' <<< "$zones")
          records=$(curl --fail-with-body -sS "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=n7case.clintware.com" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps([{k:x.get(k) for k in ("id","type","name","content","proxied","ttl")} for x in d.get("result",[])],indent=2))' <<< "$records"
          echo 'Resolver output:'
          getent ahosts n7case.clintware.com || true
          echo 'HTTPS output:'
          curl -sS -I --connect-timeout 10 --max-time 20 https://n7case.clintware.com/ || true
