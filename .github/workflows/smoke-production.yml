name: Smoke Test Clintware Production

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "landtheplane-worker/**"
      - "venture-pages-worker/**"
      - "agentbridge-cloud/public/progress.html"
      - "control-plane/**"
      - ".github/workflows/smoke-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Pages origin and public domain
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local label="$1"
            local url="$2"
            local marker="$3"
            local body headers code
            body=$(mktemp)
            headers=$(mktemp)
            trap 'rm -f "$body" "$headers"' RETURN

            echo "Checking $label: $url"
            for attempt in 1 2 3 4 5 6; do
              code=$(curl --silent --show-error --location --max-time 20 \
                --output "$body" --dump-header "$headers" \
                --write-out '%{http_code}' "$url" || true)
              if [ "$code" = "200" ] && grep -Fq "$marker" "$body"; then
                echo "$label OK (HTTP 200, marker found)."
                return 0
              fi
              echo "Attempt $attempt: HTTP ${code:-curl-error}; marker present: $(grep -Fq "$marker" "$body" && echo yes || echo no)"
              sleep 3
            done

            echo "::error::$label did not return the expected production page."
            echo "Final headers:"
            cat "$headers" || true
            echo "Body preview:"
            head -c 800 "$body" || true
            echo
            return 1
          }

          check_url "Cloudflare Pages origin" "https://clintware-site.pages.dev/tools/stockyard-signal/" "Stockyard Signal"
          check_url "Clintware public domain" "https://www.clintware.com/tools/stockyard-signal/" "Stockyard Signal"
          check_url "Clintware Games hub" "https://www.clintware.com/games/" "GAMES · SYSTEMS YOU CAN PLAY"
          check_url "QBRook live game" "https://www.clintware.com/games/qbrook/" "CUSTOMER SUCCESS × CHESS"
          check_url "Rotorwash contribution proposal" "https://www.clintware.com/games/rotorwash-zombie-rescue/" "PROPOSED CONTRIBUTION · ROTORWASH"
          check_url "Unified venture evidence journal" "https://www.clintware.com/startup/evidence/" "One evidence contract across every venture."
          check_url "LandThePlane prep evidence journal" "https://landtheplane.clintware.com/" "Prep evidence journal · local-first"
          check_url "SuccessOS canonical venture page" "https://successos.clintware.com/" "Clintware SuccessOS"
          check_url "Quillgeist progress journal" "https://quillgeist.clintware.com/progress.html" "Show the work. Track the efficiency."

      - name: Verify Clintware control plane
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          code=$(curl --silent --show-error --location --max-time 20 \
            --output "$body" --write-out '%{http_code}' \
            "https://mcp.clintware.com/health" || true)

          echo "Control plane HTTP: ${code:-curl-error}"
          cat "$body"
          echo

          test "$code" = "200"
          python3 - "$body" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              d = json.load(f)
          assert d.get("ok") is True, d
          assert d.get("service") == "Clintware Control Plane", d
          a = d.get("adapters") or {}
          assert a.get("github_write") is True, a
          assert a.get("cloudflare_dns") is True, a
          print("CONTROL_PLANE_OK=true")
          print("GITHUB_WRITE_OK=true")
          print("CLOUDFLARE_DNS_OK=true")
          PY
