name: Deploy N7 Demo CRM
on:
  push:
    branches: [main]
    paths: ["projects/n7demo-crm/**", ".github/workflows/deploy-n7demo-crm.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clintware-n7demo-crm
  cancel-in-progress: true
jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}

      - name: Validate source
        run: |
          set -euo pipefail
          cd projects/n7demo-crm
          npm install --no-audit --no-fund
          npm run check
          ! grep -R -E -i 'lovable\.dev|@lovable|lovable-vite|lovable-tagger' src public package.json wrangler.jsonc
          grep -Fq "ACME MEDICAL" src/index.js
          grep -Fq "HelioMed Imaging Systems" src/sample-customers.js
          grep -Fq "customersFromFile" public/import-utils.js
          grep -Fq "50% improvement by end of Year 1" src/index.js
          grep -Fq "6–8 weeks from start to go-live" src/index.js
          grep -Fq "8–10 weeks" src/index.js
          grep -Fq "n7demo-crm" src/index.js
          grep -Fq "Engineering-ready" public/app-views.js
          grep -Fq "RACI" public/app-views.js
          grep -Fq "\"live_prompt\",\"Live Prompt\"" public/app-config.js
          grep -Fq "\"live_assistant\",\"Live Assist\"" public/app-config.js
          grep -Fq "getDisplayMedia" public/app-ai.js
          grep -Fq "/api/ai/interpret-change" src/index.js
          grep -Fq "/api/audio/transcribe" src/index.js
          grep -Fq "cross_site_mutation_blocked" src/index.js
          grep -Fq "write_scope_required" src/index.js
          grep -Fq "record_changed_since_interpretation" src/index.js
          grep -Fq "script-src 'self'" src/index.js
          ! grep -Fq "googletagmanager.com" public/index.html
          grep -Fq "dedupeTranscriptChunk" public/app-ai.js
          grep -Fq "NAV_GROUPS" public/app-config.js

      - name: Wrangler dry run
        run: |
          set -euo pipefail
          cd projects/n7demo-crm
          npx wrangler deploy --dry-run

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd projects/n7demo-crm

      - name: Attach custom domain
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"hostname":"n7demo.clintware.com","service":"clintware-n7demo-crm","zone_name":"clintware.com"}')
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d' <<< "$response"

      - name: Verify live CRM
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 40); do
            h=$(curl -fsS --connect-timeout 5 --max-time 15 https://n7demo.clintware.com/health || true)
            p=$(curl -fsS --connect-timeout 5 --max-time 15 https://n7demo.clintware.com/ || true)
            a=$(curl -fsS --connect-timeout 5 --max-time 15 https://n7demo.clintware.com/app-ai.js || true)
            if grep -Fq '"service":"clintware-n7demo-crm"' <<< "$h" \
              && grep -Fq '"lovable":false' <<< "$h" \
              && grep -Fq '"storage":"Durable Objects SQLite + audit history + account export"' <<< "$h" \
              && grep -Fq 'N7 Demo CRM' <<< "$p" \
              && grep -Fq '/app-ai.js' <<< "$p" \
              && grep -Fq 'getDisplayMedia' <<< "$a" \
              && grep -Fq 'Interpret update' <<< "$a"; then
              ready=1
              break
            fi
            echo "Waiting for n7demo.clintware.com (${i}/40)"
            sleep 5
          done
          test "$ready" = "1"
          rm -f /tmp/n7demo.cookies
          curl -fsS -c /tmp/n7demo.cookies https://n7demo.clintware.com/ >/tmp/n7demo.html
          state_code=$(curl -sS -o /tmp/n7state.json -w '%{http_code}' -b /tmp/n7demo.cookies -c /tmp/n7demo.cookies https://n7demo.clintware.com/api/state)
          state_code=$(tr -cd '0-9' <<< "$state_code")
          echo "state HTTP $state_code"; cat /tmp/n7state.json
          test "$state_code" = "200"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["access"]["authenticated"] is False; assert len(d["customers"])==11; assert d["customer"]["name"]=="ACME MEDICAL"; assert sum(1 for c in d["customers"] if c.get("isSynthetic"))==10; assert any(c.get("isGoldenExample") for c in d["customers"])' </tmp/n7state.json
          import_code=$(curl -sS -o /tmp/n7import.json -w '%{http_code}' -b /tmp/n7demo.cookies -H 'content-type: application/json' --data '{"customers":[{"name":"CI Import Test","industry":"Test","stage":"Imported","sourceName":"ci.csv"}],"mode":"append"}' https://n7demo.clintware.com/api/customers/bulk-import)
          import_code=$(tr -cd '0-9' <<< "$import_code")
          echo "import HTTP $import_code"; cat /tmp/n7import.json
          test "$import_code" = "201"
          imported=0
          for j in $(seq 1 6); do
            after=$(curl -fsS -b /tmp/n7demo.cookies https://n7demo.clintware.com/api/state || true)
            if python3 -c 'import json,sys; d=json.load(sys.stdin); assert any(c["name"]=="CI Import Test" for c in d["customers"])' <<< "$after" 2>/dev/null; then
              imported=1
              break
            fi
            sleep 1
          done
          test "$imported" = "1"
          curl -fsS -b /tmp/n7demo.cookies -H 'content-type: application/json' --data '{"overrideGolden":false}' https://n7demo.clintware.com/api/customers/clear >/tmp/n7clear.json
          kept=$(curl -fsS -b /tmp/n7demo.cookies https://n7demo.clintware.com/api/state)
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["customers"])==1; assert d["customers"][0]["name"]=="ACME MEDICAL"' <<< "$kept"
          curl -fsS -b /tmp/n7demo.cookies -H 'content-type: application/json' --data '{}' https://n7demo.clintware.com/api/customers/reset-samples >/tmp/n7reset.json
          reset=$(curl -fsS -b /tmp/n7demo.cookies https://n7demo.clintware.com/api/state)
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["customers"])==11; assert sum(1 for c in d["customers"] if c.get("isSynthetic"))==10' <<< "$reset"
          headers=$(curl -fsSI --connect-timeout 5 --max-time 15 https://n7demo.clintware.com/)
          grep -Fqi "strict-transport-security:" <<< "$headers"
          grep -Fqi "x-frame-options: DENY" <<< "$headers"
          grep -Fqi "content-security-policy:" <<< "$headers"
          grep -Fqi "script-src 'self'" <<< "$headers"
          grep -Fqi "cross-origin-opener-policy: same-origin" <<< "$headers"
          blocked_backup_status=$(curl -sS -o /tmp/n7-backup-blocked.json -w '%{http_code}' https://n7demo.clintware.com/api/backup | tr -cd '0-9')
          test "$blocked_backup_status" = "404"
          blocked_session_status=$(curl -sS -o /tmp/n7-session-blocked.json -w '%{http_code}' https://n7demo.clintware.com/api/session/test | tr -cd '0-9')
          test "$blocked_session_status" = "404"
          ai_auth_status=$(curl -sS -o /tmp/n7-ai-auth.json -w '%{http_code}' -X POST https://n7demo.clintware.com/api/ai/interpret-change -H 'Content-Type: application/json' --data '{"customerId":"x","text":"test"}' | tr -cd '0-9')
          test "$ai_auth_status" = "401"
          auth=$(curl -fsS --connect-timeout 5 --max-time 15 https://auth.clintware.com/client-config/n7demo-crm || true)
          echo "$auth" | grep -Fq '"app":"n7demo-crm"'
          echo "$auth" | grep -Fq '"redirect_uri":"https://n7demo.clintware.com/auth/callback"'
          echo "N7 Demo CRM live with Clintware OAuth configuration."
