name: Deploy N7 Demo CRM
on:
  push:
    branches: [main]
    paths:
      - "projects/n7demo-crm/**"
      - "projects/dplr-crm/scripts/browser-local-runtime.mjs"
      - "projects/dplr-crm/public/cw-astro-local-store.js"
      - "tests/n7_browser_smoke.mjs"
      - ".github/workflows/deploy-n7demo-crm.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clintware-n7demo-crm
  cancel-in-progress: true
jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Materialize browser-local deployment artifact
        run: |
          set -euo pipefail
          node projects/n7demo-crm/scripts/materialize-local.mjs
          cd .build/n7demo-crm-local
          npm install --no-audit --no-fund
          npm run check
          ! grep -Fq '"durable_objects"' wrangler.jsonc
          grep -Fq '"deleted_classes"' wrangler.jsonc
          grep -Fq '/cw-astro-local-store.js' public/index.html
          grep -Fq 'databaseRowsPerDemoSession:0' src/index.js
          grep -Fq 'ACME MEDICAL' public/cw-astro-local-bootstrap.js
          grep -Fq 'HelioMed Imaging Systems' public/cw-astro-local-bootstrap.js
      - name: Wrangler dry run
        run: cd .build/n7demo-crm-local && npx wrangler deploy --dry-run
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd .build/n7demo-crm-local
      - name: Attach custom domain
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data '{"hostname":"n7demo.clintware.com","service":"clintware-n7demo-crm","zone_name":"clintware.com"}')
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d' <<< "$response"
      - name: Verify live stateless contract
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            h=$(curl -fsS https://n7demo.clintware.com/health || true)
            p=$(curl -fsS https://n7demo.clintware.com/ || true)
            if grep -Fq '"storage":"browser-local"' <<< "$h" && grep -Fq '"databaseRowsPerDemoSession":0' <<< "$h" && grep -Fq '"durableObjectsRequired":false' <<< "$h" && grep -Fq 'N7 Demo CRM' <<< "$p"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Real browser persistence smoke
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/n7_browser_smoke.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n7-browser-smoke
          path: n7-home-smoke.png
          if-no-files-found: ignore
