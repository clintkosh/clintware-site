name: Deploy N7 Demo CRM
on:
  push:
    branches: [main]
    paths: ["projects/n7demo-crm/**", ".github/workflows/deploy-n7demo-crm.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clintware-n7demo-crm
  cancel-in-progress: true
jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}

      - name: Validate source
        run: |
          set -euo pipefail
          cd projects/n7demo-crm
          npm install --no-audit --no-fund
          npm run check
          ! grep -R -E -i 'lovable\.dev|@lovable|lovable-vite|lovable-tagger' src public package.json wrangler.jsonc
          grep -Fq "ACME MEDICAL" src/index.js\n          grep -Fq "HelioMed Imaging Systems" src/sample-customers.js\n          grep -Fq "customersFromFile" public/import-utils.js
          grep -Fq "50% improvement by end of Year 1" src/index.js
          grep -Fq "6–8 weeks from start to go-live" src/index.js
          grep -Fq "8–10 weeks" src/index.js
          grep -Fq "n7demo-crm" src/index.js
          grep -Fq "Engineering-ready" public/app-views.js
          grep -Fq "RACI" public/app-views.js

      - name: Wrangler dry run
        run: |
          set -euo pipefail
          cd projects/n7demo-crm
          npx wrangler deploy --dry-run

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd projects/n7demo-crm

      - name: Attach custom domain
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"hostname":"n7demo.clintware.com","service":"clintware-n7demo-crm","zone_name":"clintware.com"}')
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d' <<< "$response"

      - name: Verify live CRM
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 40); do
            h=$(curl -fsS --connect-timeout 5 --max-time 15 https://n7demo.clintware.com/health || true)
            p=$(curl -fsS --connect-timeout 5 --max-time 15 https://n7demo.clintware.com/ || true)
            if grep -Fq '"service":"clintware-n7demo-crm"' <<< "$h" \
              && grep -Fq '"lovable":false' <<< "$h" \
              && grep -Fq '"storage":"Durable Objects SQLite + audit history + account export"' <<< "$h" \
              && grep -Fq 'Clintware Identity' <<< "$p" \
              && grep -Fq 'N7 Demo CRM' <<< "$p"; then
              ready=1
              break
            fi
            echo "Waiting for n7demo.clintware.com (${i}/40)"
            sleep 5
          done
          test "$ready" = "1"
          rm -f /tmp/n7demo.cookies
          curl -fsS -c /tmp/n7demo.cookies https://n7demo.clintware.com/ >/tmp/n7demo.html
          state=$(curl -fsS -b /tmp/n7demo.cookies -c /tmp/n7demo.cookies https://n7demo.clintware.com/api/state)
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["access"]["authenticated"] is False; assert len(d["customers"])==11; assert d["customer"]["name"]=="ACME MEDICAL"; assert sum(1 for c in d["customers"] if c.get("isSynthetic"))==10; assert any(c.get("isGoldenExample") for c in d["customers"])' <<< "$state"
          curl -fsS -b /tmp/n7demo.cookies -H 'content-type: application/json' --data '{"customers":[{"name":"CI Import Test","industry":"Test","stage":"Imported","sourceName":"ci.csv"}],"mode":"append"}' https://n7demo.clintware.com/api/customers/bulk-import >/tmp/n7import.json
          after=$(curl -fsS -b /tmp/n7demo.cookies https://n7demo.clintware.com/api/state)
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert any(c["name"]=="CI Import Test" for c in d["customers"])' <<< "$after"
          curl -fsS -b /tmp/n7demo.cookies -H 'content-type: application/json' --data '{"overrideGolden":false}' https://n7demo.clintware.com/api/customers/clear >/tmp/n7clear.json
          kept=$(curl -fsS -b /tmp/n7demo.cookies https://n7demo.clintware.com/api/state)
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["customers"])==1; assert d["customers"][0]["name"]=="ACME MEDICAL"' <<< "$kept"
          curl -fsS -b /tmp/n7demo.cookies -H 'content-type: application/json' --data '{}' https://n7demo.clintware.com/api/customers/reset-samples >/tmp/n7reset.json
          reset=$(curl -fsS -b /tmp/n7demo.cookies https://n7demo.clintware.com/api/state)
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["customers"])==11; assert sum(1 for c in d["customers"] if c.get("isSynthetic"))==10' <<< "$reset"
          auth=$(curl -fsS --connect-timeout 5 --max-time 15 https://auth.clintware.com/client-config/n7demo-crm || true)
          echo "$auth" | grep -Fq '"app":"n7demo-crm"'
          echo "$auth" | grep -Fq '"redirect_uri":"https://n7demo.clintware.com/auth/callback"'
          echo "N7 Demo CRM live with Clintware OAuth configuration."
