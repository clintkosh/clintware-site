name: Quillgeist Cloudflare Direct Repair

on:
  pull_request:
    paths:
      - ".github/workflows/quillgeist-cloudflare-repair.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Attach Quillgeist domain to deployed Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

          http=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/attach.json -w '%{http_code}' \
            -X PUT "${base}/workers/domains" \
            "${auth[@]}" \
            -H 'Content-Type: application/json' \
            --data '{"hostname":"quillgeist.clintware.com","service":"clintware-agentbridge","zone_name":"clintware.com"}')
          echo "attach_http=${http}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/attach.json').read_text())
          errs=[{'code':e.get('code'),'message':e.get('message')} for e in (d.get('errors') or [])]
          r=d.get('result') or {}
          print('attach_success=',d.get('success'))
          print('attach_errors=',errs)
          print('attached_hostname=',r.get('hostname'))
          print('attached_service=',r.get('service'))
          print('attached_zone=',r.get('zone_name'))
          if d.get('success') is not True or r.get('service')!='clintware-agentbridge' or r.get('hostname')!='quillgeist.clintware.com':
              raise SystemExit(1)
          PY

      - name: Confirm domain binding and live endpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          current=$(curl -sS --connect-timeout 10 --max-time 30 \
            "${base}/workers/domains?hostname=quillgeist.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          python3 -c 'import json,sys; d=json.load(sys.stdin); r=[x for x in (d.get("result") or []) if x.get("hostname")=="quillgeist.clintware.com"]; print("domain_count=",len(r)); print("domain_services=",[x.get("service") for x in r]); assert d.get("success") is True and len(r)==1 and r[0].get("service")=="clintware-agentbridge"' <<< "$current"

          ready=0
          for i in $(seq 1 30); do
            page_code=$(curl -L -sS -o /tmp/page -w '%{http_code}' --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/ || true)
            health_code=$(curl -L -sS -o /tmp/health -w '%{http_code}' --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/api/health || true)
            echo "probe_${i}: page=${page_code} health=${health_code}"
            if [ "$page_code" = "200" ] && [ "$health_code" = "200" ] && grep -Fq 'QUILLGEIST' /tmp/page && grep -Fq '"service":"Quillgeist Cloud"' /tmp/health; then
              ready=1
              break
            fi
            sleep 3
          done
          test "$ready" = 1
