name: Deploy Neuron7 Candidate Case

on:
  push:
    branches: [main]
    paths:
      - "neuron7-case-worker/**"
      - ".github/workflows/deploy-neuron7-case.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-neuron7-case
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate case Worker
        run: |
          node --check neuron7-case-worker/src/worker.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          html = Path('neuron7-case-worker/public/index.html').read_text(encoding='utf-8')
          P().feed(html)
          required = [
            'Neuron7 implementation recovery & value console',
            'NOT NEURON7 PRODUCT UI',
            'Critical-path project plan',
            'ROI measurement contract',
            'Accuracy is down 20%',
            'Implementation Readiness Gate'
          ]
          missing = [x for x in required if x not in html]
          assert not missing, missing
          print('HTML structure/content checks passed')
          PY
          npx --yes wrangler@4 deploy --dry-run --config neuron7-case-worker/wrangler.jsonc

      - name: Deploy case Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd neuron7-case-worker

      - name: Attach or verify n7case.clintware.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          current=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=n7case.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          correct=$(python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); print("yes" if d.get("success") is True and len(r)==1 and r[0].get("hostname")=="n7case.clintware.com" and r[0].get("service")=="clintware-neuron7-case" else "no")' <<< "$current")
          if [ "$correct" != "yes" ]; then
            curl --fail-with-body -sS -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"hostname":"n7case.clintware.com","service":"clintware-neuron7-case"}' >/tmp/n7case-domain-put.json
            python3 -c 'import json; d=json.load(open("/tmp/n7case-domain-put.json")); assert d.get("success") is True,d'
          fi
          verify=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=n7case.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True and len(r)==1,d; x=r[0]; assert x.get("hostname")=="n7case.clintware.com" and x.get("service")=="clintware-neuron7-case",x; print("Case domain verified:",x["hostname"],"->",x["service"])' <<< "$verify"

      - name: Verify HTTPS, headers, UI and health
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 30); do
            headers=$(mktemp)
            body=$(mktemp)
            code=$(curl -sS -D "$headers" --connect-timeout 5 --max-time 20 \
              -o "$body" -w '%{http_code}' "https://n7case.clintware.com/?release=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ] \
              && grep -Fq 'Neuron7 implementation recovery &amp; value console' "$body" || grep -Fq 'Neuron7 implementation recovery & value console' "$body"; then
              if grep -Fq 'NOT NEURON7 PRODUCT UI' "$body" \
                && grep -Fq 'ROI measurement contract' "$body" \
                && grep -Fq 'Implementation Readiness Gate' "$body" \
                && grep -Eqi '^x-robots-tag:.*noindex' "$headers"; then
                ready=1
                rm -f "$headers" "$body"
                break
              fi
            fi
            rm -f "$headers" "$body"
            echo "Waiting for n7case deployment ($i/30)"
            sleep 5
          done
          test "$ready" = "1"
          curl --fail-with-body -sS https://n7case.clintware.com/health | grep -Fq '"service":"clintware-neuron7-case"'
          echo 'n7case.clintware.com passed HTTPS, content, header and health checks.'
