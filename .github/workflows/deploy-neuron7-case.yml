name: Deploy Neuron7 Candidate Case

on:
  push:
    branches: [main]
    paths:
      - "neuron7-case-worker/**"
      - ".github/workflows/deploy-neuron7-case.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-neuron7-case
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate case Worker
        run: |
          node --check neuron7-case-worker/src/worker.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          html = Path('neuron7-case-worker/public/index.html').read_text(encoding='utf-8')
          P().feed(html)
          required = [
            'Neuron7 implementation recovery & value console',
            'NOT NEURON7 PRODUCT UI',
            'Critical-path project plan',
            'ROI measurement contract',
            'Accuracy is down 20%',
            'Implementation Readiness Gate'
          ]
          missing = [x for x in required if x not in html]
          assert not missing, missing
          print('HTML structure/content checks passed')
          PY
          npx --yes wrangler@4 deploy --dry-run --config neuron7-case-worker/wrangler.jsonc

      - name: Deploy case Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd neuron7-case-worker

      - name: Verify Worker domain and ensure DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          domains=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=n7case.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          python3 - <<'PY' <<< "$domains"
          import json,sys
          d=json.load(sys.stdin); r=d.get('result',[])
          assert d.get('success') is True and len(r)==1,d
          x=r[0]
          assert x.get('hostname')=='n7case.clintware.com' and x.get('service')=='clintware-neuron7-case',x
          print('Worker domain:', x.get('hostname'), 'service=',x.get('service'),'zone=',x.get('zone_name'),'cert_id=',x.get('cert_id'))
          PY

          zones=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/zones?name=clintware.com&account.id=${CLOUDFLARE_ACCOUNT_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          zone_id=$(python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True and len(r)==1,d; print(r[0]["id"])' <<< "$zones")

          records=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=n7case.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          count=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(len(d.get("result",[])))' <<< "$records")

          if [ "$count" = "0" ]; then
            echo 'Custom-domain metadata exists but no public DNS record is visible; creating proxied AAAA fallback.'
            create=$(curl --fail-with-body -sS -X POST \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"type":"AAAA","name":"n7case","content":"100::","ttl":1,"proxied":true}')
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; x=d["result"]; print("Created DNS:",x["type"],x["name"],"proxied=",x["proxied"])' <<< "$create"
          else
            python3 - <<'PY' <<< "$records"
          import json,sys
          d=json.load(sys.stdin)
          for x in d.get('result',[]):
              print('Existing DNS:',x.get('type'),x.get('name'),'content=',x.get('content'),'proxied=',x.get('proxied'))
          PY
          fi

      - name: Verify HTTPS, headers, UI and health
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 60); do
            headers=$(mktemp)
            body=$(mktemp)
            err=$(mktemp)
            code=$(curl -sS -D "$headers" --connect-timeout 5 --max-time 20 \
              -o "$body" -w '%{http_code}' "https://n7case.clintware.com/?release=${GITHUB_SHA}" 2>"$err" || true)
            if [ "$code" = "200" ] && { grep -Fq 'Neuron7 implementation recovery &amp; value console' "$body" || grep -Fq 'Neuron7 implementation recovery & value console' "$body"; }; then
              if grep -Fq 'NOT NEURON7 PRODUCT UI' "$body" \
                && grep -Fq 'ROI measurement contract' "$body" \
                && grep -Fq 'Implementation Readiness Gate' "$body" \
                && grep -Eqi '^x-robots-tag:.*noindex' "$headers"; then
                ready=1
                rm -f "$headers" "$body" "$err"
                break
              fi
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "Attempt ${i}: HTTP=${code}; curl=$(tr '\n' ' ' < "$err")"
            fi
            rm -f "$headers" "$body" "$err"
            echo "Waiting for n7case HTTPS/DNS readiness ($i/60)"
            sleep 5
          done
          test "$ready" = "1"
          curl --fail-with-body -sS https://n7case.clintware.com/health | grep -Fq '"service":"clintware-neuron7-case"'
          echo 'n7case.clintware.com passed HTTPS, content, header and health checks.'
