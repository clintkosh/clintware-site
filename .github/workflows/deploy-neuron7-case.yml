name: Deploy Neuron7 Candidate Case

on:
  push:
    branches: [main]
    paths:
      - "neuron7-case-worker/**"
      - ".github/workflows/deploy-neuron7-case.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-neuron7-case
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate case Worker
        run: |
          node --check neuron7-case-worker/src/worker.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          html = Path('neuron7-case-worker/public/index.html').read_text(encoding='utf-8')
          P().feed(html)
          required = [
            'Neuron7 implementation recovery & value console',
            'NOT NEURON7 PRODUCT UI',
            'Critical-path project plan',
            'ROI measurement contract',
            'Accuracy is down 20%',
            'Implementation Readiness Gate'
          ]
          missing = [x for x in required if x not in html]
          assert not missing, missing
          print('HTML structure/content checks passed')
          PY
          npx --yes wrangler@4 deploy --dry-run --config neuron7-case-worker/wrangler.jsonc

      - name: Deploy case Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd neuron7-case-worker

      - name: Verify Worker domains and ensure DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          for host in n7.clintware.com n7case.clintware.com; do
            domains=$(curl --fail-with-body -sS               "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=${host}"               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            HOST="$host" python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=d.get("result",[]); h=os.environ["HOST"]; assert d.get("success") is True and len(r)==1,d; x=r[0]; assert x.get("hostname")==h and x.get("service")=="clintware-neuron7-case",x; print("Worker domain:",h,"service=",x.get("service"),"cert_id=",x.get("cert_id"))' <<< "$domains"
          done

          zones=$(curl --fail-with-body -sS             "https://api.cloudflare.com/client/v4/zones?name=clintware.com&account.id=${CLOUDFLARE_ACCOUNT_ID}"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          zone_id=$(python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True and len(r)==1,d; print(r[0]["id"])' <<< "$zones")

          ensure_dns() {
            host="$1"
            short="$2"
            records=$(curl --fail-with-body -sS               "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=${host}"               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            count=$(python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; print(len(d.get("result",[])))' <<< "$records")
            if [ "$count" = "0" ]; then
              echo "Creating proxied DNS fallback for ${host}."
              create=$(curl --fail-with-body -sS -X POST                 "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records"                 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"                 -H "Content-Type: application/json"                 --data "{\"type\":\"AAAA\",\"name\":\"${short}\",\"content\":\"100::\",\"ttl\":1,\"proxied\":true}")
              python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; x=d["result"]; print("Created DNS:",x["type"],x["name"],"proxied=",x["proxied"])' <<< "$create"
            else
              python3 -c 'import json,sys; d=json.load(sys.stdin); [print("Existing DNS:",x.get("type"),x.get("name"),"content=",x.get("content"),"proxied=",x.get("proxied")) for x in d.get("result",[])]' <<< "$records"
            fi
          }

          ensure_dns n7.clintware.com n7
          ensure_dns n7case.clintware.com n7case

      - name: Verify canonical HTTPS, content, headers and health
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 60); do
            headers=$(mktemp)
            body=$(mktemp)
            err=$(mktemp)
            code=$(curl -sS -D "$headers" --connect-timeout 5 --max-time 20               -o "$body" -w '%{http_code}' "https://n7.clintware.com/?release=${GITHUB_SHA}" 2>"$err" || true)
            if [ "$code" = "200" ] && { grep -Fq 'Neuron7 implementation recovery &amp; value console' "$body" || grep -Fq 'Neuron7 implementation recovery & value console' "$body"; }; then
              if grep -Fq 'NOT NEURON7 PRODUCT UI' "$body"                 && grep -Fq 'ROI measurement contract' "$body"                 && grep -Fq 'Implementation Readiness Gate' "$body"                 && grep -Eqi '^x-robots-tag:.*noindex' "$headers"; then
                ready=1
                rm -f "$headers" "$body" "$err"
                break
              fi
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "Attempt ${i}: HTTP=${code}; curl=$(tr '\n' ' ' < "$err")"
            fi
            rm -f "$headers" "$body" "$err"
            echo "Waiting for n7.clintware.com HTTPS/DNS readiness (${i}/60)"
            sleep 5
          done
          test "$ready" = "1"
          curl --fail-with-body -sS https://n7.clintware.com/health             | grep -Fq '"canonicalUrl":"https://n7.clintware.com"'
          echo 'n7.clintware.com passed HTTPS, content, header and health checks.'

      - name: Verify legacy URL redirects to canonical
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 30); do
            headers=$(mktemp)
            code=$(curl -sS -o /dev/null -D "$headers" --connect-timeout 5 --max-time 20               -w '%{http_code}' https://n7case.clintware.com/ || true)
            if [ "$code" = "308" ]               && grep -Eqi '^location: https://n7\.clintware\.com/?' "$headers"; then
              ready=1
              rm -f "$headers"
              break
            fi
            rm -f "$headers"
            echo "Waiting for legacy redirect readiness (${i}/30)"
            sleep 5
          done
          test "$ready" = "1"
          echo 'n7case.clintware.com redirects permanently to n7.clintware.com.'
