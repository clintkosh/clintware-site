name: Diagnose ZS Domain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-zs-domain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Cloudflare Workers custom-domain binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=zs.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
          | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"success":d.get("success"),"result":[{k:x.get(k) for k in ("id","hostname","service","zone_name","zone_id","cert_id","environment")} for x in d.get("result",[])]},indent=2))'

      - name: Resolve public DNS from multiple resolvers
        run: |
          set -euo pipefail
          echo "Cloudflare 1.1.1.1 A:"; dig +time=3 +tries=1 @1.1.1.1 zs.clintware.com A +noall +answer || true
          echo "Cloudflare 1.1.1.1 AAAA:"; dig +time=3 +tries=1 @1.1.1.1 zs.clintware.com AAAA +noall +answer || true
          echo "Google 8.8.8.8 A:"; dig +time=3 +tries=1 @8.8.8.8 zs.clintware.com A +noall +answer || true
          echo "Google 8.8.8.8 AAAA:"; dig +time=3 +tries=1 @8.8.8.8 zs.clintware.com AAAA +noall +answer || true
          echo "System resolver:"; getent ahosts zs.clintware.com || true

      - name: Verify public HTTPS endpoints
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -D /tmp/root.headers https://zs.clintware.com/ -o /tmp/root.html
          head -20 /tmp/root.headers
          grep -Fq "Open the operating platform" /tmp/root.html
          curl --fail-with-body -sS https://zs.clintware.com/health
          echo
          curl --fail-with-body -sS https://zs.clintware.com/health/auth
          echo
