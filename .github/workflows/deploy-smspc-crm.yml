name: Deploy SimSpace SE Operating System

on:
  push:
    branches: [main]
    paths:
      - "projects/smspc-crm/**"
      - "projects/dplr-crm/**"
      - "projects/dpl-crm/**"
      - ".github/workflows/deploy-smspc-crm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-smspc-crm
  cancel-in-progress: true

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Materialize SimSpace CRM
        run: |
          set -euo pipefail
          node projects/smspc-crm/scripts/materialize.mjs
          cd .build/smspc-crm
          npm install --no-audit --no-fund
          npm run check

      - name: Verify auth-clean role overlay
        run: |
          set -euo pipefail
          root=.build/smspc-crm
          grep -Fq 'SimSpace Senior Solution Engineer OS' "$root/public/index.html"
          grep -Fq 'data-smspc-track' "$root/public/smspc-track.js"
          grep -Fq 'noindex,nofollow,noarchive' "$root/public/index.html"
          ! grep -Fq 'Sign in for durable workspace' "$root/public/dplr-shell.js"
          ! grep -Fq 'Sign in to keep data' "$root/public/app-views.js"
          grep -Fq 'Browser-local workspace' "$root/public/dplr-shell.js"
          grep -Fq '"pattern":"smspc.clintware.com"' "$root/wrangler.jsonc"
          ! grep -Fq '"durable_objects"' "$root/wrangler.jsonc"
          grep -Fq '"deleted_classes"' "$root/wrangler.jsonc"
          grep -Fq 'databaseRowsPerDemoSession:0' "$root/src/index.js"

      - name: Wrangler dry run
        run: |
          set -euo pipefail
          cd .build/smspc-crm
          npx wrangler deploy --dry-run

      - name: Deploy SimSpace CRM
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd .build/smspc-crm

      - name: Verify live shell
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 36); do
            page=$(curl -fsS --connect-timeout 5 --max-time 15 https://smspc.clintware.com/ || true)
            shell=$(curl -fsS --connect-timeout 5 --max-time 15 https://smspc.clintware.com/dplr-shell.js || true)
            health=$(curl -fsS --connect-timeout 5 --max-time 15 https://smspc.clintware.com/health || true)
            if grep -Fq 'SimSpace Senior Solution Engineer OS' <<< "$page" \
              && grep -Fq 'Browser-local workspace' <<< "$shell" \
              && grep -Fq '"storage":"browser-local"' <<< "$health" \
              && grep -Fq '"databaseRowsPerDemoSession":0' <<< "$health" \
              && ! grep -Fq 'Sign in for durable workspace' <<< "$shell"; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"
          echo "SimSpace live with browser-local persistence and no Durable Object dependency."
