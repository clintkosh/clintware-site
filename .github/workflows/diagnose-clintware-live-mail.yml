name: Diagnose Clintware Live Mail

on:
  push:
    paths:
      - ".github/workflows/diagnose-clintware-live-mail.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare SMTP recipient acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet dnspython
          python3 - <<'PY'
          import dns.resolver, smtplib, uuid
          domain='clintware.com'
          real='clint@clintware.com'
          fake=f'route-probe-{uuid.uuid4().hex[:14]}@clintware.com'
          sender='routing-probe@clintware.com'
          mx=sorted((r.preference,str(r.exchange).rstrip('.')) for r in dns.resolver.resolve(domain,'MX'))
          print('REAL='+real)
          print('FAKE='+fake)
          for pref,host in mx:
              print(f'MX={pref} {host}')
              try:
                  with smtplib.SMTP(host,25,timeout=20) as s:
                      s.ehlo('clintware.com')
                      if s.has_extn('starttls'):
                          s.starttls(); s.ehlo('clintware.com')
                      mcode,mresp=s.mail(sender)
                      print(f'MAIL_FROM={mcode} {mresp!r}')
                      rcode,rresp=s.rcpt(real)
                      print(f'REAL_RCPT={rcode} {rresp!r}')
                  with smtplib.SMTP(host,25,timeout=20) as s:
                      s.ehlo('clintware.com')
                      if s.has_extn('starttls'):
                          s.starttls(); s.ehlo('clintware.com')
                      mcode,mresp=s.mail(sender)
                      fcode,fresp=s.rcpt(fake)
                      print(f'FAKE_RCPT={fcode} {fresp!r}')
                  if rcode < 400 and fcode >= 400:
                      print('ADDRESS_RULE_SIGNAL=clint_specific_rule_present')
                  elif rcode < 400 and fcode < 400:
                      print('ADDRESS_RULE_SIGNAL=catch_all_or_deferred_validation')
                  else:
                      print('ADDRESS_RULE_SIGNAL=clint_not_accepted')
                  break
              except Exception as e:
                  print(f'ERROR={host}:{type(e).__name__}:{e}')
          PY
