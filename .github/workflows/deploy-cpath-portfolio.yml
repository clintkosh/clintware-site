name: Deploy CPath Portfolio

on:
  push:
    branches: [main]
    paths:
      - "cpath-worker/**"
      - ".github/workflows/deploy-cpath-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-cpath-portfolio
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate portfolio
        run: |
          node --check cpath-worker/src/worker.js
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.hrefs = []
                  self.h1 = 0
                  self.apps = 0
                  self.images = []
                  self.iframes = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get('id'):
                      self.ids.append(attrs['id'])
                  if attrs.get('href'):
                      self.hrefs.append(attrs['href'])
                  if tag == 'h1':
                      self.h1 += 1
                  if tag == 'article' and 'app' in (attrs.get('class') or '').split():
                      self.apps += 1
                  if tag == 'img':
                      self.images.append(attrs)
                  if tag == 'iframe':
                      self.iframes.append(attrs)

          html = Path('cpath-worker/public/index.html').read_text(encoding='utf-8')
          parser = P()
          parser.feed(html)

          required = [
            'I turn messy work into systems people actually use.',
            'This is my work and how I think',
            '19 published applications / tools',
            '19 implemented skills',
            '18 published and 1 internal',
            'Hi Quinton,',
            'welcome-greeting',
            'welcome-viewport',
            '@media(prefers-reduced-motion:reduce)',
            'I rely on n8n in a similar way for deterministic orchestration.',
            'Clintware Flow',
            'published a sanitized reusable skill',
            'AI slop',
            'RenewNudge',
            'OrgSynapse',
            'Full résumé'
          ]
          missing = [x for x in required if x not in html]
          assert not missing, f'Missing required content: {missing}'

          duplicates = [key for key, count in Counter(parser.ids).items() if count > 1]
          assert not duplicates, f'Duplicate IDs: {duplicates}'

          anchors = [href[1:] for href in parser.hrefs if href.startswith('#')]
          broken = [anchor for anchor in anchors if anchor and anchor not in parser.ids]
          assert not broken, f'Broken internal anchors: {broken}'

          unsafe = [href for href in parser.hrefs if re.match(r'^(javascript|data):', href, re.I)]
          assert not unsafe, f'Unsafe href schemes: {unsafe}'

          assert parser.h1 == 1, f'Expected exactly one H1, found {parser.h1}'
          assert parser.apps == 19, f'Expected 19 application/tool cards, found {parser.apps}'
          assert parser.images and all(img.get('alt') for img in parser.images), 'Every image must have alt text'
          assert parser.iframes and all(frame.get('title') for frame in parser.iframes), 'Every iframe must have a title'
          assert '18 implemented skills' not in html
          assert '17 published and 1 internal' not in html
          assert 'CodePath' not in html
          print('Portfolio content, structure, accessibility and link checks passed')
          PY
          npx --yes wrangler@4 deploy --dry-run --config cpath-worker/wrangler.jsonc

      - name: Deploy portfolio Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd cpath-worker

      - name: Verify custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          host=cpath.clintware.com
          domains=$(curl --fail-with-body -sS             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=${host}"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True and len(r)==1,d; x=r[0]; assert x.get("hostname")=="cpath.clintware.com" and x.get("service")=="clintware-cpath-portfolio",x; print("Worker domain ready:",x.get("hostname"))' <<< "$domains"

      - name: Verify HTTPS and content
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 60); do
            headers=$(mktemp)
            body=$(mktemp)
            code=$(curl -sS -D "$headers" --connect-timeout 5 --max-time 20 -o "$body" -w '%{http_code}' "https://cpath.clintware.com/?release=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ]               && grep -Fq 'I turn messy work into systems people actually use.' "$body"               && grep -Fq '19 published applications / tools' "$body"               && grep -Fq 'This is my work and how I think' "$body"               && grep -Fq 'Hi Quinton,' "$body"               && grep -Fq 'Clintware Flow' "$body"               && grep -Fq 'published a sanitized reusable skill' "$body"               && grep -Eqi '^x-robots-tag:.*noindex' "$headers"; then
              ready=1
              rm -f "$headers" "$body"
              break
            fi
            rm -f "$headers" "$body"
            sleep 5
          done
          test "$ready" = "1"
          curl --fail-with-body -sS https://cpath.clintware.com/health | grep -Fq '"ok":true'

          resume_headers=$(mktemp)
          curl --fail-with-body -sS -D "$resume_headers" -o /tmp/cpath-resume.pdf https://cpath.clintware.com/resume.pdf
          grep -Eqi '^content-type: *application/pdf' "$resume_headers"
          if grep -Eqi '^x-frame-options:' "$resume_headers"; then
            echo "Embedded resume unexpectedly carries X-Frame-Options" >&2
            exit 1
          fi
          file /tmp/cpath-resume.pdf | grep -Fqi 'PDF document'
          echo 'cpath.clintware.com passed HTTPS, content, embedded resume, header and health checks.'

      - name: Verify first-party application links and assets
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/cpath-first-party-urls.txt
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse, urldefrag

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ('href', 'src'):
                      value = attrs.get(key)
                      if not value or not value.startswith(('http://','https://')):
                          continue
                      clean = urldefrag(value)[0]
                      host = (urlparse(clean).hostname or '').lower()
                      if host == 'clintware.com' or host.endswith('.clintware.com'):
                          self.urls.append(clean)

          p = P()
          p.feed(Path('cpath-worker/public/index.html').read_text(encoding='utf-8'))
          for url in sorted(set(p.urls)):
              print(url)
          PY

          failures=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            code=$(curl -L -sS --connect-timeout 8 --max-time 30 -o /dev/null -w '%{http_code}' "$url" || true)
            case "$code" in
              2??|3??) echo "OK $code $url" ;;
              *) echo "FAIL $code $url" >&2; failures=$((failures+1)) ;;
            esac
          done < /tmp/cpath-first-party-urls.txt

          test "$failures" = "0"
          echo 'All first-party application links and assets returned successful HTTP status.'
