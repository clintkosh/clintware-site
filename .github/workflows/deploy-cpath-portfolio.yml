name: Deploy CPath Delivery OS

on:
  push:
    branches: [main]
    paths:
      - "cpath-worker/**"
      - ".github/workflows/deploy-cpath-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-cpath-delivery-os
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate delivery OS
        run: |
          set -euo pipefail
          node --check cpath-worker/src/worker.js
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=[]; self.hrefs=[]; self.h1=0; self.buttons=0
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if attrs.get('id'): self.ids.append(attrs['id'])
                  if attrs.get('href'): self.hrefs.append(attrs['href'])
                  if tag=='h1': self.h1 += 1
                  if tag=='button': self.buttons += 1

          html=Path('cpath-worker/public/index.html').read_text(encoding='utf-8')
          p=P(); p.feed(html)
          required=[
            'Claude Corps Delivery OS',
            'Manage the mentors. Protect the fellows. Improve the system.',
            'Mentor health at a glance',
            'Fellow delivery risk',
            'Operating cadence',
            'Curriculum change requests',
            'CodePath role: Senior Manager of AI Practice, Claude Corps',
            'Building effective agents',
            'G-DCY144YM9P',
            "localStorage",
            'job-boards.greenhouse.io/codepath/jobs/5204061007'
          ]
          missing=[x for x in required if x not in html]
          assert not missing, f'Missing required content: {missing}'
          duplicates=[k for k,c in Counter(p.ids).items() if c>1]
          assert not duplicates, f'Duplicate IDs: {duplicates}'
          assert p.h1 == 1, f'Expected one H1, found {p.h1}'
          assert p.buttons >= 10, f'Expected interactive controls, found {p.buttons}'
          anchors=[h[1:] for h in p.hrefs if h.startswith('#')]
          broken=[a for a in anchors if a and a not in p.ids]
          assert not broken, f'Broken anchors: {broken}'
          unsafe=[h for h in p.hrefs if re.match(r'^(javascript|data):',h,re.I)]
          assert not unsafe, f'Unsafe href schemes: {unsafe}'
          assert 'real fellow, mentor, or CodePath operational data' in html
          print('Delivery OS content, interaction markers, analytics and accessibility checks passed')
          PY
          npx --yes wrangler@4 deploy --dry-run --config cpath-worker/wrangler.jsonc

      - name: Deploy delivery OS Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd cpath-worker

      - name: Verify custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          host=cpath.clintware.com
          domains=$(curl --fail-with-body -sS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=${host}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True and len(r)==1,d; x=r[0]; assert x.get("hostname")=="cpath.clintware.com" and x.get("service")=="clintware-cpath-portfolio",x; print("Worker domain ready:",x.get("hostname"))' <<< "$domains"

      - name: Verify HTTPS, state markers and health
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 60); do
            headers=$(mktemp)
            body=$(mktemp)
            code=$(curl -sS -D "$headers" --connect-timeout 5 --max-time 20 -o "$body" -w '%{http_code}' "https://cpath.clintware.com/?release=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ]               && grep -Fq 'Claude Corps Delivery OS' "$body"               && grep -Fq 'Mentor health at a glance' "$body"               && grep -Fq 'Curriculum change requests' "$body"               && grep -Fq 'G-DCY144YM9P' "$body"               && grep -Eqi '^x-robots-tag:.*noindex' "$headers"; then
              ready=1
              rm -f "$headers" "$body"
              break
            fi
            rm -f "$headers" "$body"
            sleep 5
          done
          test "$ready" = "1"
          health=$(curl --fail-with-body -sS https://cpath.clintware.com/health)
          grep -Fq '"ok":true' <<< "$health"
          grep -Fq '"jobId":"5204061007"' <<< "$health"
          grep -Fq '"surface":"mentor-delivery-accountability-system"' <<< "$health"
          echo 'cpath.clintware.com passed role-specific delivery OS verification.'

      - name: Validate CRM analytics coverage
        run: |
          set -euo pipefail
          if [ -f tests/validate_crm_analytics.py ]; then
            python3 tests/validate_crm_analytics.py
          else
            echo 'Repository analytics validator not present in checkout; page-level GA marker already validated.'
          fi
