name: Retire Consulting Domain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire-consulting-domain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_HOST: consulting.clintware.com
      ZONE_NAME: clintware.com
    steps:
      - name: Require Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Remove Worker custom-domain binding if present
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=${TARGET_HOST}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          ids=$(printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; print("\n".join(str(x["id"]) for x in d.get("result",[]) if x.get("hostname")=="consulting.clintware.com"))')
          if [ -z "$ids" ]; then
            echo "No Worker custom-domain binding exists for ${TARGET_HOST}."
          else
            while IFS= read -r id; do
              [ -n "$id" ] || continue
              echo "Deleting Worker custom-domain binding ${id} for ${TARGET_HOST}."
              deleted=$(curl --fail-with-body -sS -X DELETE \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains/${id}" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
              printf '%s' "$deleted" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d'
            done <<< "$ids"
          fi

      - name: Remove direct Cloudflare DNS records if API scope permits
        run: |
          set -euo pipefail
          zone_tmp=$(mktemp)
          zone_code=$(curl -sS -o "$zone_tmp" -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}&account.id=${CLOUDFLARE_ACCOUNT_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || true)
          if [[ ! "$zone_code" =~ ^2 ]]; then
            echo "Zone API unavailable with this token (HTTP ${zone_code}); continuing to public DNS verification."
            cat "$zone_tmp"
            exit 0
          fi
          zone_id=$(python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; matches=[x for x in d.get("result",[]) if x.get("name")=="clintware.com"]; print(matches[0]["id"] if matches else "")' < "$zone_tmp")
          if [ -z "$zone_id" ]; then
            echo "No Cloudflare zone found for ${ZONE_NAME}; continuing to public DNS verification."
            exit 0
          fi

          records_tmp=$(mktemp)
          records_code=$(curl -sS -o "$records_tmp" -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=${TARGET_HOST}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || true)
          if [[ ! "$records_code" =~ ^2 ]]; then
            echo "DNS Records API unavailable with this token (HTTP ${records_code}); exact DNS deletion cannot be completed with the current credential."
            cat "$records_tmp"
            exit 0
          fi

          ids=$(python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; print("\n".join(str(x["id"]) for x in d.get("result",[]) if x.get("name")=="consulting.clintware.com"))' < "$records_tmp")
          if [ -z "$ids" ]; then
            echo "No direct DNS records exist for ${TARGET_HOST}."
          else
            while IFS= read -r id; do
              [ -n "$id" ] || continue
              echo "Deleting DNS record ${id} for ${TARGET_HOST}."
              deleted=$(curl --fail-with-body -sS -X DELETE \
                "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${id}" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
              printf '%s' "$deleted" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d'
            done <<< "$ids"
          fi

      - name: Verify Worker custom-domain binding is gone
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=${TARGET_HOST}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; matches=[x for x in d.get("result",[]) if x.get("hostname")=="consulting.clintware.com"]; assert not matches,matches; print("Worker custom-domain binding absent.")'

      - name: Report public DNS state
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null
          for resolver in 1.1.1.1 8.8.8.8; do
            echo "Resolver ${resolver}:"
            for qtype in A AAAA CNAME; do
              echo "-- ${qtype} --"
              dig @"${resolver}" "${TARGET_HOST}" "${qtype}" +noall +answer || true
            done
          done
