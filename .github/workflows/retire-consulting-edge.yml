name: Retire Consulting Edge

on:
  push:
    branches: [main]
    paths:
      - "workers/consulting-retired.js"
      - ".github/workflows/retire-consulting-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: clintware-consulting-retired
      TARGET_HOST: consulting.clintware.com
      ZONE_NAME: clintware.com
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Clintware zone
        id: zone
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}&account.id=${CLOUDFLARE_ACCOUNT_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          zone_id=$(printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; r=d.get("result",[]); assert r,"zone not found"; print(r[0]["id"])')
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"

      - name: Upload 410 retirement Worker
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/javascript" \
            --data-binary @workers/consulting-retired.js)
          printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; print("Retirement Worker uploaded.")'

      - name: Route only consulting.clintware.com to retirement Worker
        run: |
          set -euo pipefail
          zone_id="${{ steps.zone.outputs.zone_id }}"

          # Prefer a Custom Domain. If an existing DNS record blocks it, use a
          # Worker Route on the already-proxied hostname instead.
          domain_body=$(mktemp)
          domain_code=$(curl -sS -o "$domain_body" -w '%{http_code}' -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"hostname\":\"${TARGET_HOST}\",\"service\":\"${WORKER_NAME}\",\"zone_id\":\"${zone_id}\",\"zone_name\":\"${ZONE_NAME}\"}" || true)

          if [[ "$domain_code" =~ ^2 ]]; then
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d' < "$domain_body"
            echo "Attached ${TARGET_HOST} as a Worker Custom Domain."
            exit 0
          fi

          echo "Custom Domain attach returned HTTP ${domain_code}; trying an exact Worker Route."
          cat "$domain_body"

          routes_body=$(mktemp)
          routes_code=$(curl -sS -o "$routes_body" -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/workers/routes" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || true)
          if [[ ! "$routes_code" =~ ^2 ]]; then
            echo "Worker Routes API unavailable (HTTP ${routes_code})."
            cat "$routes_body"
            exit 1
          fi

          route_id=$(python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; p="consulting.clintware.com/*"; print(next((x.get("id","") for x in d.get("result",[]) if x.get("pattern")==p),""))' < "$routes_body")
          route_payload="{\"pattern\":\"${TARGET_HOST}/*\",\"script\":\"${WORKER_NAME}\"}"

          if [ -n "$route_id" ]; then
            response=$(curl --fail-with-body -sS -X PUT \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/workers/routes/${route_id}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$route_payload")
            echo "Updated existing exact Worker Route ${route_id}."
          else
            response=$(curl --fail-with-body -sS -X POST \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/workers/routes" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$route_payload")
            echo "Created exact Worker Route for ${TARGET_HOST}."
          fi
          printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; r=d.get("result",{}); assert r.get("pattern")=="consulting.clintware.com/*",r; assert r.get("script")=="clintware-consulting-retired",r'

      - name: Verify retirement response
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/body -D /tmp/headers -w '%{http_code}' "https://${TARGET_HOST}/" || true)
            if [ "$code" = "410" ]; then
              grep -i '^x-robots-tag:.*noindex' /tmp/headers
              grep -q 'legacy Clintware surface has been retired' /tmp/body
              echo "Verified ${TARGET_HOST} returns 410 Gone with noindex."
              exit 0
            fi
            echo "Attempt ${attempt}: received HTTP ${code}; retrying after propagation."
            sleep 5
          done
          echo "Edge retirement did not verify as HTTP 410."
          cat /tmp/headers || true
          exit 1
