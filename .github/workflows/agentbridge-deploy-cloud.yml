name: Deploy Quillgeist Cloud (AgentBridge runtime)

on:
  push:
    branches: [main]
    paths:
      - "agentbridge-cloud/**"
      - ".github/workflows/agentbridge-deploy-cloud.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clintware-agentbridge-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check agentbridge-cloud/src/index.js
          node --check agentbridge-cloud/src/entry.js
          node --check agentbridge-cloud/src/telemetry.js
          node --check agentbridge-cloud/src/help.js
          node --check agentbridge-cloud/public/app.js
          node --check agentbridge-cloud/public/fluid.js
          node --check agentbridge-cloud/public/sw.js
      - name: Wrangler config validates
        run: |
          grep -Fq '"main": "src/entry.js"' agentbridge-cloud/wrangler.jsonc
          XDG_CONFIG_HOME=/tmp/quillgeist-xdg npx --yes --cache /tmp/quillgeist-npm-cache wrangler@4 deploy --dry-run --config agentbridge-cloud/wrangler.jsonc
      - name: Runtime template markers
        run: |
          grep -Fq 'Your intent. Your machines. Verified execution.' agentbridge-cloud/public/index.html
          grep -Fq 'All systems relaxed.' agentbridge-cloud/public/index.html
          grep -Fq 'Help Center' agentbridge-cloud/public/index.html
          grep -Fq 'TelemetryHub' agentbridge-cloud/src/entry.js
          grep -Fq 'rebrandPublicHtml' agentbridge-cloud/src/entry.js

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to replace a different Worker domain owner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for hostname in agentbridge.clintware.com quillgeist.clintware.com; do
            response=$(curl --fail-with-body -sS \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=${hostname}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            HOSTNAME="$hostname" python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=d.get("result",[]); h=os.environ["HOSTNAME"]; assert d.get("success") is True,d; assert not r or all(x.get("service")=="clintware-agentbridge" and x.get("hostname")==h for x in r),r' <<< "$response"
          done
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: agentbridge-cloud
          command: deploy
      - name: Attach or verify Quillgeist and legacy domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for hostname in quillgeist.clintware.com agentbridge.clintware.com; do
            current=$(curl --fail-with-body -sS \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=${hostname}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            correct=$(HOSTNAME="$hostname" python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=d.get("result",[]); h=os.environ["HOSTNAME"]; print("yes" if d.get("success") is True and len(r)==1 and r[0].get("hostname")==h and r[0].get("service")=="clintware-agentbridge" else "no")' <<< "$current")
            if [ "$correct" != "yes" ]; then
              count=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(len(d.get("result",[])))' <<< "$current")
              test "$count" = 0
              curl --fail-with-body -sS -X PUT \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "{\"hostname\":\"${hostname}\",\"service\":\"clintware-agentbridge\"}" >/tmp/quillgeist-domain.json
              python3 -c 'import json; d=json.load(open("/tmp/quillgeist-domain.json")); assert d.get("success") is True,d'
            fi
          done
      - name: Verify live Quillgeist alpha
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 35); do
            health=$(curl -sS --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/api/health || true)
            page=$(curl -sS --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/ || true)
            css=$(curl -sS --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/styles.css || true)
            if grep -Fq '"service":"AgentBridge Cloud"' <<< "$health" && grep -Fq 'QUILLGEIST' <<< "$page" && grep -Fq 'Your intent. Your machines. Verified execution.' <<< "$page" && grep -Fq 'app-shell' <<< "$css"; then ready=1; break; fi
            sleep 4
          done
          test "$ready" = 1

  publish-status:
    if: always()
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture sanitized deployment state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set +e
          mkdir -p ops
          qg_domains=$(curl -sS --connect-timeout 5 --max-time 15 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=quillgeist.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" 2>/dev/null)
          qg_service=$(python3 -c 'import json,sys
try:
 d=json.load(sys.stdin); r=d.get("result",[]); print(r[0].get("service","") if r else "")
except Exception: print("")' <<< "$qg_domains")
          domain_ok=false
          if [ "$qg_service" = "clintware-agentbridge" ]; then domain_ok=true; fi
          page_code=$(curl -L -sS -o /tmp/qg-page -w '%{http_code}' --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/ 2>/dev/null || true)
          health_code=$(curl -L -sS -o /tmp/qg-health -w '%{http_code}' --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/api/health 2>/dev/null || true)
          test -n "$page_code" || page_code=000
          test -n "$health_code" || health_code=000
          page_marker=false
          health_marker=false
          grep -Fq 'QUILLGEIST' /tmp/qg-page 2>/dev/null && page_marker=true
          grep -Fq '"ok":true' /tmp/qg-health 2>/dev/null && health_marker=true
          python3 - <<PY
          import json, os
          from datetime import datetime, timezone
          status={
            "checked_at": datetime.now(timezone.utc).isoformat(),
            "source_commit": "${GITHUB_SHA}",
            "validate": os.environ.get("VALIDATE_RESULT", "unknown"),
            "deploy": os.environ.get("DEPLOY_RESULT", "unknown"),
            "quillgeist_domain_service": "${qg_service}",
            "quillgeist_domain_owned_by_runtime": "${domain_ok}" == "true",
            "page_http": "${page_code}",
            "health_http": "${health_code}",
            "page_marker_ok": "${page_marker}" == "true",
            "health_marker_ok": "${health_marker}" == "true"
          }
          open("ops/quillgeist-deploy-status.json","w").write(json.dumps(status,indent=2)+"\n")
          PY
      - name: Publish sanitized status checkpoint
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/quillgeist-deploy-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Quillgeist deployment status"
          git push
