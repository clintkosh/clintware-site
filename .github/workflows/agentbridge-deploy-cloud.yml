name: Deploy Quillgeist Cloud

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "agentbridge-cloud/**"
      - ".github/workflows/agentbridge-deploy-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-quillgeist-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Cloud dependencies
        run: npm install --prefix agentbridge-cloud
      - name: JavaScript syntax
        run: |
          node --check agentbridge-cloud/src/index.js
          node --check agentbridge-cloud/src/entry.js
          node --check agentbridge-cloud/src/public-api.js
          node --check agentbridge-cloud/src/telemetry.js
          node --check agentbridge-cloud/src/help.js
          node --check agentbridge-cloud/public/app.js
          node --check agentbridge-cloud/public/fluid.js
          node --check agentbridge-cloud/public/public-stats.js
          node --check agentbridge-cloud/public/sw.js
      - name: Wrangler config validates
        run: |
          set -euo pipefail
          grep -Fq '"name": "clintware-agentbridge"' agentbridge-cloud/wrangler.jsonc
          grep -Fq '"pattern":"quillgeist.clintware.com","custom_domain":true' agentbridge-cloud/wrangler.jsonc
          grep -Fq '"/mcp*"' agentbridge-cloud/wrangler.jsonc
          cd agentbridge-cloud
          XDG_CONFIG_HOME=/tmp/quillgeist-xdg npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: API and Plugin Directory invariants
        run: |
          set -euo pipefail
          grep -Fq 'quillgeist_compact_context' agentbridge-cloud/src/public-api.js
          grep -Fq 'quillgeist_product_impact' agentbridge-cloud/src/public-api.js
          grep -Fq '/api/v1/compact' agentbridge-cloud/src/public-api.js
          grep -Fq '/api/v1/openapi.json' agentbridge-cloud/src/public-api.js
          grep -Eq 'route:[[:space:]]*"/mcp"' agentbridge-cloud/src/public-api.js
          grep -Eq 'allowedHostnames:[[:space:]]*\["quillgeist\.clintware\.com"\]' agentbridge-cloud/src/public-api.js
          grep -Eq 'readOnlyHint:[[:space:]]*false.*destructiveHint:[[:space:]]*false.*idempotentHint:[[:space:]]*false.*openWorldHint:[[:space:]]*false' agentbridge-cloud/src/public-api.js
          grep -Eq 'readOnlyHint:[[:space:]]*true.*destructiveHint:[[:space:]]*false.*idempotentHint:[[:space:]]*true.*openWorldHint:[[:space:]]*false' agentbridge-cloud/src/public-api.js
          grep -Fq 'record_aggregate_metrics' agentbridge-cloud/src/public-api.js
          grep -Fq 'restricted_data_not_accepted' agentbridge-cloud/src/public-api.js
          grep -Eq 'content_stored_by_quillgeist:[[:space:]]*false' agentbridge-cloud/src/public-api.js
          grep -Fq 'OPENAI_APPS_CHALLENGE' agentbridge-cloud/src/entry.js
          grep -Fq 'PRODUCT_RETENTION_MS=730*86400000' agentbridge-cloud/src/telemetry.js
          test -f agentbridge-cloud/public/developers.html
          test -f agentbridge-cloud/public/privacy.html
          test -f agentbridge-cloud/public/terms.html
          test -f agentbridge-cloud/public/support.html
          test -f agentbridge-cloud/chatgpt-plugin/.codex-plugin/plugin.json
          test -f agentbridge-cloud/chatgpt-plugin/skills/quillgeist/SKILL.md
          test -f agentbridge-cloud/chatgpt-plugin/SUBMISSION.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('agentbridge-cloud/chatgpt-plugin/.codex-plugin/plugin.json').read_text(encoding='utf-8'))
          assert manifest['name']=='quillgeist'
          assert manifest['interface']['displayName']=='Quillgeist'
          assert manifest['interface']['privacyPolicyURL'].startswith('https://quillgeist.clintware.com/')
          skill=Path('agentbridge-cloud/chatgpt-plugin/skills/quillgeist/SKILL.md').read_text(encoding='utf-8')
          assert 'record_aggregate_metrics=false' in skill
          assert '730 days' in skill
          submission=Path('agentbridge-cloud/chatgpt-plugin/SUBMISSION.md').read_text(encoding='utf-8')
          assert submission.count('### Positive ') >= 5
          assert submission.count('### Negative ') >= 3
          PY
      - name: Download-first onboarding invariant
        run: |
          set -euo pipefail
          test -f agentbridge-cloud/ONBOARDING_INVARIANTS.md
          grep -Fq 'Download Quillgeist for Windows' agentbridge-cloud/public/index.html
          grep -Fq 'Download for macOS Apple Silicon' agentbridge-cloud/public/index.html
          grep -Fq 'Download for Linux x64' agentbridge-cloud/public/index.html
          grep -Fq 'Quillgeist-Windows-x64.exe' agentbridge-cloud/public/index.html
          grep -Fq 'Quillgeist-macOS-arm64' agentbridge-cloud/public/index.html
          grep -Fq 'Quillgeist-Linux-x64' agentbridge-cloud/public/index.html
          grep -Fq 'I installed Quillgeist · Continue to Cloud' agentbridge-cloud/public/index.html
          grep -Fq 'Existing user · use control key' agentbridge-cloud/public/index.html
          python3 - <<'PY'
          from pathlib import Path
          text=Path('agentbridge-cloud/public/index.html').read_text(encoding='utf-8')
          download=text.index('Download Quillgeist for Windows')
          continue_cloud=text.index('I installed Quillgeist · Continue to Cloud')
          existing=text.index('Existing user · use control key')
          if not download < continue_cloud < existing:
              raise SystemExit('Quillgeist onboarding regressed: download must precede Cloud account and returning-user control-key paths')
          old='<button id="createAccount" class="btn primary wide">Open Quillgeist Cloud</button>\n        <button id="restoreAccount" class="btn ghost wide">Use existing control key</button>'
          if old in text:
              raise SystemExit('Quillgeist onboarding regressed to key-first landing')
          PY
      - name: Runtime markers
        run: |
          grep -Fq 'Your intent. Your machines. Verified execution.' agentbridge-cloud/public/index.html
          grep -Fq 'All systems relaxed.' agentbridge-cloud/public/index.html
          grep -Fq 'Help Center' agentbridge-cloud/public/index.html
          grep -Fq 'service:"Quillgeist Cloud"' agentbridge-cloud/src/entry.js
          grep -Fq 'Control key could not be restored.' agentbridge-cloud/public/app.js
          grep -Fq 'invalid_repeat_interval' agentbridge-cloud/src/index.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Cloud dependencies
        run: npm install --prefix agentbridge-cloud
      - name: Deploy Quillgeist Worker runtime
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd agentbridge-cloud
      - name: Explicitly attach Quillgeist custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --compressed -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data '{"hostname":"quillgeist.clintware.com","service":"clintware-agentbridge","zone_name":"clintware.com"}')
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; r=d.get("result") or {}; assert r.get("hostname")=="quillgeist.clintware.com",r; assert r.get("service")=="clintware-agentbridge",r' <<< "$response"
      - name: Verify Quillgeist domain ownership
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 30); do
            current=$(curl --compressed -sS --connect-timeout 5 --max-time 15 \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=quillgeist.clintware.com" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Accept: application/json" || true)
            if python3 -c 'import json,sys; d=json.load(sys.stdin); r=[x for x in (d.get("result") or []) if x.get("hostname")=="quillgeist.clintware.com"]; raise SystemExit(0 if d.get("success") is True and len(r)==1 and r[0].get("service")=="clintware-agentbridge" else 1)' <<< "$current" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 3
          done
          test "$ready" = 1
      - name: Verify live Quillgeist API and catalog surface
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 30); do
            health=$(curl -sS --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/api/health || true)
            api=$(curl -sS --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/api/v1 || true)
            openapi=$(curl -sS --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/api/v1/openapi.json || true)
            compact=$(curl -sS --connect-timeout 5 --max-time 15 -X POST https://quillgeist.clintware.com/api/v1/compact -H 'content-type: application/json' --data '{"text":"alpha\nalpha\nalpha\nerror: preserve this\nomega","threshold_chars":500,"record_aggregate_metrics":false}' || true)
            restricted=$(curl -sS --connect-timeout 5 --max-time 15 -X POST https://quillgeist.clintware.com/api/v1/compact -H 'content-type: application/json' --data '{"text":"password=not-a-real-secret"}' || true)
            page=$(curl -sS --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/ || true)
            developers=$(curl -sS --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/developers.html || true)
            privacy=$(curl -sS --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/privacy.html || true)
            support=$(curl -sS --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/support.html || true)
            css=$(curl -sS --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/styles.css || true)
            app=$(curl -sS --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/app.js || true)
            if grep -Fq '"service":"Quillgeist Cloud"' <<< "$health" \
              && grep -Fq '"name":"Quillgeist Public API"' <<< "$api" \
              && grep -Fq '"openapi":"3.1.0"' <<< "$openapi" \
              && grep -Fq '"content_stored_by_quillgeist":false' <<< "$compact" \
              && grep -Fq '"aggregate_metrics_recorded":false' <<< "$compact" \
              && grep -Fq '"restricted_data_not_accepted"' <<< "$restricted" \
              && grep -Fq 'QUILLGEIST' <<< "$page" \
              && grep -Fq 'Your intent. Your machines. Verified execution.' <<< "$page" \
              && grep -Fq 'Download Quillgeist for Windows' <<< "$page" \
              && grep -Fq 'Existing user · use control key' <<< "$page" \
              && grep -Fq 'ChatGPT' <<< "$developers" \
              && grep -Fq 'record_aggregate_metrics' <<< "$developers" \
              && grep -Fq '730 days' <<< "$privacy" \
              && grep -Fq 'Quillgeist Support' <<< "$support" \
              && grep -Fq 'app-shell' <<< "$css" \
              && grep -Fq 'Quillgeist Cloud ready.' <<< "$app"; then
              ready=1
              break
            fi
            sleep 3
          done
          test "$ready" = 1
