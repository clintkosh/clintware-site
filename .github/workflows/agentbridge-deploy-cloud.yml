name: Deploy Quillgeist Cloud

on:
  push:
    branches: [main]
    paths:
      - "agentbridge-cloud/**"
      - "agentbridge-node/agentbridge_node/local_gateway.py"
      - "public/tools/quillgeist/**"
      - "tests/test_quillgeist_saas.py"
      - ".github/workflows/agentbridge-deploy-cloud.yml"
  pull_request:
    paths:
      - "agentbridge-cloud/**"
      - ".github/workflows/agentbridge-deploy-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-quillgeist-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Cloud dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm install --prefix agentbridge-cloud --no-audit --no-fund; then
              exit 0
            fi
            echo "npm install attempt $attempt failed; clearing cache metadata and retrying" >&2
            npm cache clean --force || true
            sleep $((attempt * 3))
          done
          exit 1
      - name: JavaScript syntax
        run: |
          node --check agentbridge-cloud/src/index.js
          node --check agentbridge-cloud/src/entry.js
          node --check agentbridge-cloud/src/public-api.js
          node --check agentbridge-cloud/src/telemetry.js
          node --check agentbridge-cloud/src/help.js
          node --check agentbridge-cloud/public/app.js
          node --check agentbridge-cloud/public/saas.js
          node --check agentbridge-cloud/public/fluid.js
          node --check agentbridge-cloud/public/public-stats.js
          node --check agentbridge-cloud/public/progress.js
          node --check agentbridge-cloud/public/sw.js
          python3 -m py_compile agentbridge-node/agentbridge_node/local_gateway.py
          python3 -m unittest tests.test_quillgeist_saas -v
      - name: Wrangler config validates
        run: |
          set -euo pipefail
          grep -Fq '"name": "clintware-agentbridge"' agentbridge-cloud/wrangler.jsonc
          grep -Fq 'quillgeist.clintware.com' agentbridge-cloud/wrangler.jsonc
          grep -Fq 'qg.clintware.com' agentbridge-cloud/wrangler.jsonc
          grep -Fq '"/mcp*"' agentbridge-cloud/wrangler.jsonc
          cd agentbridge-cloud
          XDG_CONFIG_HOME=/tmp/quillgeist-xdg npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Self-host source and hosted-retirement invariants
        run: |
          set -euo pipefail
          grep -Fq 'quillgeist_compact_context' agentbridge-cloud/src/public-api.js
          grep -Fq 'quillgeist_product_impact' agentbridge-cloud/src/public-api.js
          grep -Fq '/api/v1/compact' agentbridge-cloud/src/public-api.js
          grep -Eq 'allowedHostnames:[[:space:]]*\[host\]' agentbridge-cloud/src/public-api.js
          grep -Fq 'onClintwareDistribution&&retiredPublicRuntime' agentbridge-cloud/src/entry.js
          grep -Fq 'public_runtime:false' agentbridge-cloud/src/entry.js
          grep -Fq 'self-host.html' agentbridge-cloud/src/entry.js
          test -f agentbridge-cloud/public/self-host.html
          test -f agentbridge-cloud/public/developers.html
          test -f agentbridge-cloud/public/privacy.html
          test -f agentbridge-cloud/public/terms.html
          test -f agentbridge-cloud/public/support.html
          if test -d agentbridge-cloud/chatgpt-plugin; then
            echo "Hosted public plugin package must not be distributed from Clintware." >&2
            exit 1
          fi
      - name: Local-only distribution onboarding invariant
        run: |
          set -euo pipefail
          test -f agentbridge-cloud/ONBOARDING_INVARIANTS.md
          grep -Fq 'Download Quillgeist for Windows' agentbridge-cloud/public/index.html
          grep -Fq 'Download for macOS Apple Silicon' agentbridge-cloud/public/index.html
          grep -Fq 'Download for Linux x64' agentbridge-cloud/public/index.html
          grep -Fq 'local-only default' agentbridge-cloud/public/index.html
          grep -Fq 'No default Quillgeist Cloud URL.' agentbridge-cloud/public/index.html
          grep -Fq 'does not contain a Clintware server credential' agentbridge-cloud/public/index.html
          grep -Fq 'quillgeist-v0.4.0-selfhost-alpha' agentbridge-cloud/public/index.html
          test -f agentbridge-cloud/public/progress.html
          test -f agentbridge-cloud/public/progress.js
          test -f agentbridge-cloud/public/app.html
          test -f agentbridge-cloud/public/saas.js
          grep -Fq 'Open Quillgeist Workspace' agentbridge-cloud/public/index.html
          grep -Fq 'parallel sub-search' agentbridge-cloud/public/app.html
          grep -Fq 'Primary / synthesis model' agentbridge-cloud/public/app.html
          grep -Fq 'Promise.all' agentbridge-cloud/public/saas.js
          grep -Fq '/v1/models' agentbridge-cloud/public/saas.js
          grep -Fq '/v1/chat/completions' agentbridge-cloud/public/saas.js
          grep -Fq 'Live progress journal' agentbridge-cloud/public/index.html
          grep -Fq 'Product shape: portal + local runtime + MCP/API' agentbridge-cloud/public/progress.html
          grep -Fq 'access-control-allow-origin' agentbridge-cloud/src/entry.js
      - name: Runtime markers
        run: |
          set -euo pipefail
          grep -Fq 'Quillgeist Distribution Site' agentbridge-cloud/src/entry.js
          grep -Fq 'Quillgeist Cloud' agentbridge-cloud/src/entry.js
          grep -Fq 'SELF-HOSTED CLOUD' agentbridge-cloud/public/self-host.html
          grep -Fq 'invalid_repeat_interval' agentbridge-cloud/src/index.js


  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Cloud dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm install --prefix agentbridge-cloud --no-audit --no-fund; then
              exit 0
            fi
            echo "npm install attempt $attempt failed; clearing cache metadata and retrying" >&2
            npm cache clean --force || true
            sleep $((attempt * 3))
          done
          exit 1
      - name: Deploy Quillgeist Worker runtime
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd agentbridge-cloud
      - name: Explicitly attach Quillgeist custom domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for hostname in quillgeist.clintware.com qg.clintware.com; do
            response=$(curl --fail-with-body --compressed -sS -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data "{\"hostname\":\"${hostname}\",\"service\":\"clintware-agentbridge\",\"zone_name\":\"clintware.com\"}")
            python3 -c 'import json,sys; host=sys.argv[1]; d=json.load(sys.stdin); assert d.get("success") is True,d; r=d.get("result") or {}; assert r.get("hostname")==host,r; assert r.get("service")=="clintware-agentbridge",r' "$hostname" <<< "$response"
          done
      - name: Verify Quillgeist domain ownership
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for hostname in quillgeist.clintware.com qg.clintware.com; do
            ready=0
            for i in $(seq 1 30); do
              current=$(curl --compressed -sS --connect-timeout 5 --max-time 15 \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=${hostname}" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Accept: application/json" || true)
              if python3 -c 'import json,sys; host=sys.argv[1]; d=json.load(sys.stdin); r=[x for x in (d.get("result") or []) if x.get("hostname")==host]; raise SystemExit(0 if d.get("success") is True and len(r)==1 and r[0].get("service")=="clintware-agentbridge" else 1)' "$hostname" <<< "$current" 2>/dev/null; then
                ready=1
                break
              fi
              sleep 3
            done
            test "$ready" = 1
          done
      - name: Verify self-hosted Quillgeist distribution boundary
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 60); do
            health=$(curl -fsS --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/api/health || true)
            page=$(curl -fsS --connect-timeout 5 --max-time 15 -H 'cache-control: no-cache' "https://quillgeist.clintware.com/?deploy=${GITHUB_SHA}" || true)
            progress=$(curl -fsS --connect-timeout 5 --max-time 15 -H 'cache-control: no-cache' "https://quillgeist.clintware.com/progress.html?deploy=${GITHUB_SHA}" || true)
            app=$(curl -fsS --connect-timeout 5 --max-time 15 -H 'cache-control: no-cache' "https://quillgeist.clintware.com/app?deploy=${GITHUB_SHA}" || true)
            qg_headers=$(curl -sS -I --connect-timeout 5 --max-time 15 "https://qg.clintware.com/app?deploy=${GITHUB_SHA}" | tr -d '\r' || true)
            stats_code=$(curl -sS -o /tmp/qg-stats.json -w '%{http_code}' --connect-timeout 5 --max-time 15 -H 'cache-control: no-cache' "https://quillgeist.clintware.com/api/public/product-stats?days=30&deploy=${GITHUB_SHA}" || true)
            stats=$(cat /tmp/qg-stats.json 2>/dev/null || true)
            stats_cors=$(curl -sS -X OPTIONS -D - -o /dev/null --connect-timeout 5 --max-time 15 'https://quillgeist.clintware.com/api/public/product-stats?days=30' | tr -d '\r' || true)
            bootstrap_code=$(curl -sS -o /tmp/qg-bootstrap.json -w '%{http_code}' -X POST https://quillgeist.clintware.com/api/account/bootstrap || true)
            pair_code=$(curl -sS -o /tmp/qg-pair.json -w '%{http_code}' -X POST https://quillgeist.clintware.com/api/pair/request -H 'content-type: application/json' --data '{"pair_code":"ABCDEFGH","device_id":"smoke","device_token":"not-secret"}' || true)
            compact_code=$(curl -sS -o /tmp/qg-compact.json -w '%{http_code}' -X POST https://quillgeist.clintware.com/api/v1/compact -H 'content-type: application/json' --data '{"text":"smoke"}' || true)
            mcp_code=$(curl -sS -o /tmp/qg-mcp.json -w '%{http_code}' -X POST https://quillgeist.clintware.com/mcp -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' || true)
            if grep -Fq '"service":"Quillgeist Distribution Site"' <<< "$health" \
              && grep -Fq '"public_runtime":false' <<< "$health" \
              && grep -Fq 'local-only default' <<< "$page" \
              && grep -Fq 'does not contain a Clintware server credential' <<< "$page" \
              && grep -Fq 'Show the work. Track the efficiency.' <<< "$progress" \
              && grep -Fq 'Route the work. Not just the prompt.' <<< "$app" \
              && grep -Fq 'Primary / synthesis model' <<< "$app" \
              && grep -Eq '^location: https://quillgeist\.clintware\.com/app' <<< "$qg_headers" \
              && { { test "$stats_code" = "200" && grep -Fq '"coverage":"participating Quillgeist installs and API/MCP calls with telemetry enabled"' <<< "$stats"; } || { test "$stats_code" = "503" && grep -Fq '"error":"aggregate_stats_unavailable"' <<< "$stats"; }; } \
              && grep -Fiq 'access-control-allow-origin: *' <<< "$stats_cors" \
              && test "$bootstrap_code" = "410" \
              && test "$pair_code" = "410" \
              && test "$compact_code" = "410" \
              && test "$mcp_code" = "410" \
              && grep -Fq '"self_host_required":true' /tmp/qg-bootstrap.json \
              && grep -Fq '"self_host_required":true' /tmp/qg-pair.json; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" != 1 ]; then
            echo "Quillgeist live smoke diagnostics after bounded propagation wait:" >&2
            echo "health=$health" >&2
            echo "stats_code=$stats_code bootstrap_code=$bootstrap_code pair_code=$pair_code compact_code=$compact_code mcp_code=$mcp_code" >&2
            echo "predicate_health_service=$(grep -Fq '"service":"Quillgeist Distribution Site"' <<< "$health" && echo PASS || echo FAIL)" >&2
            echo "predicate_health_public_runtime=$(grep -Fq '"public_runtime":false' <<< "$health" && echo PASS || echo FAIL)" >&2
            echo "predicate_page_local_only=$(grep -Fq 'local-only default' <<< "$page" && echo PASS || echo FAIL)" >&2
            echo "predicate_page_no_server_credential=$(grep -Fq 'does not contain a Clintware server credential' <<< "$page" && echo PASS || echo FAIL)" >&2
            echo "predicate_progress_journal=$(grep -Fq 'Show the work. Track the efficiency.' <<< "$progress" && echo PASS || echo FAIL)" >&2
            echo "predicate_stats=$( { { test "$stats_code" = "200" && grep -Fq '"coverage":"participating Quillgeist installs and API/MCP calls with telemetry enabled"' <<< "$stats"; } || { test "$stats_code" = "503" && grep -Fq '"error":"aggregate_stats_unavailable"' <<< "$stats"; }; } && echo PASS || echo FAIL)" >&2
            echo "predicate_stats_cors=$(grep -Fiq 'access-control-allow-origin: *' <<< "$stats_cors" && echo PASS || echo FAIL)" >&2
            echo "predicate_bootstrap_retired=$( { test "$bootstrap_code" = "410" && grep -Fq '"self_host_required":true' /tmp/qg-bootstrap.json; } && echo PASS || echo FAIL)" >&2
            echo "predicate_pair_retired=$( { test "$pair_code" = "410" && grep -Fq '"self_host_required":true' /tmp/qg-pair.json; } && echo PASS || echo FAIL)" >&2
            echo "predicate_compact_retired=$(test "$compact_code" = "410" && echo PASS || echo FAIL)" >&2
            echo "predicate_mcp_retired=$(test "$mcp_code" = "410" && echo PASS || echo FAIL)" >&2
            printf '%s\n' "$stats_cors" | grep -i '^access-control-' >&2 || true
          fi
          test "$ready" = 1
