name: Deploy Quillgeist Cloud (AgentBridge runtime)

on:
  push:
    branches: [main]
    paths:
      - "agentbridge-cloud/**"
      - ".github/workflows/agentbridge-deploy-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-agentbridge-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check agentbridge-cloud/src/index.js
          node --check agentbridge-cloud/src/entry.js
          node --check agentbridge-cloud/src/telemetry.js
          node --check agentbridge-cloud/src/help.js
          node --check agentbridge-cloud/public/app.js
          node --check agentbridge-cloud/public/fluid.js
          node --check agentbridge-cloud/public/sw.js
      - name: Wrangler config validates
        run: |
          grep -Fq '"main": "src/entry.js"' agentbridge-cloud/wrangler.jsonc
          grep -Fq '"pattern":"quillgeist.clintware.com/*","zone_name":"clintware.com"' agentbridge-cloud/wrangler.jsonc
          XDG_CONFIG_HOME=/tmp/quillgeist-xdg npx --yes --cache /tmp/quillgeist-npm-cache wrangler@4 deploy --dry-run --config agentbridge-cloud/wrangler.jsonc
      - name: Runtime markers
        run: |
          grep -Fq 'Your intent. Your machines. Verified execution.' agentbridge-cloud/public/index.html
          grep -Fq 'All systems relaxed.' agentbridge-cloud/public/index.html
          grep -Fq 'Help Center' agentbridge-cloud/public/index.html
          grep -Fq 'service:"Quillgeist Cloud"' agentbridge-cloud/src/entry.js
          grep -Fq 'Control key could not be restored.' agentbridge-cloud/public/app.js
          grep -Fq 'invalid_repeat_interval' agentbridge-cloud/src/index.js

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker and exact Quillgeist zone route
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: agentbridge-cloud
          command: deploy
      - name: Verify live Quillgeist alpha
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 30); do
            health=$(curl -sS --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/api/health || true)
            page=$(curl -sS --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/ || true)
            css=$(curl -sS --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/styles.css || true)
            app=$(curl -sS --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/app.js || true)
            if grep -Fq '"service":"Quillgeist Cloud"' <<< "$health" \
              && grep -Fq 'QUILLGEIST' <<< "$page" \
              && grep -Fq 'Your intent. Your machines. Verified execution.' <<< "$page" \
              && grep -Fq 'app-shell' <<< "$css" \
              && grep -Fq 'Quillgeist Cloud ready.' <<< "$app"; then
              ready=1
              break
            fi
            sleep 4
          done
          test "$ready" = 1
