name: Validate Quillgeist Web

on:
  push:
    branches: [main]
    paths:
      - "quillgeist-lite/tools/browser_agent.py"
      - "quillgeist-lite/tasks/browser-work.ps1"
      - "quillgeist-lite/tasks.json"
      - "control-plane/chatgpt-plugin/**"
      - "tests/test_quillgeist_web_safety.py"
      - ".github/workflows/validate-quillgeist-web.yml"
  pull_request:
    paths:
      - "quillgeist-lite/tools/browser_agent.py"
      - "quillgeist-lite/tasks/browser-work.ps1"
      - "quillgeist-lite/tasks.json"
      - "control-plane/chatgpt-plugin/**"
      - "tests/test_quillgeist_web_safety.py"
      - ".github/workflows/validate-quillgeist-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile browser agent
        run: python -m py_compile quillgeist-lite/tools/browser_agent.py
      - name: Run Quillgeist Web regression tests
        run: python -m unittest tests.test_quillgeist_web_safety -v
