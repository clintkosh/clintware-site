name: Retire legacy consulting surface

on:
  push:
    branches: [main]
    paths:
      - "consulting/**"
      - ".github/workflows/deploy-consulting-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "clintware-consulting-retirement-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy-retired-surface:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload retired consulting surface
        uses: actions/upload-pages-artifact@v4
        with:
          path: consulting
      - name: Deploy retired surface
        id: deployment
        uses: actions/deploy-pages@v4
