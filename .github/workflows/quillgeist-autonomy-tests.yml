name: Quillgeist Local Autonomy Tests

on:
  pull_request:
    paths:
      - "agentbridge-node/**"
      - ".github/workflows/quillgeist-autonomy-tests.yml"
  push:
    branches: [main]
    paths:
      - "agentbridge-node/**"
      - ".github/workflows/quillgeist-autonomy-tests.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Quillgeist
        run: python -m pip install ./agentbridge-node "pytest>=8,<9"
      - name: Test local intent compiler and native schedule specs
        run: python -m pytest agentbridge-node/tests/test_autonomy.py agentbridge-node/tests/test_native_schedule.py -q
      - name: Verify packaged CLI routing imports
        run: python -c "import agentbridge_node.autonomy_cli, agentbridge_node.local_console, agentbridge_node.native_schedule"
