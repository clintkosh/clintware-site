name: Deploy Boom Dual-Track CRM
on:
  push:
    branches: [main]
    paths:
      - "projects/bm-crm/**"
      - "projects/dplr-crm/**"
      - "projects/dpl-crm/**"
      - "ASTRO_CRM_CSM_SUPPORT_DUAL_TRACK_SKILL.md"
      - "tests/bm_browser_smoke.mjs"
      - ".github/workflows/deploy-bm-crm.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clintware-bm-crm
  cancel-in-progress: true
jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Validate manifest and materialize
        run: |
          set -euo pipefail
          python quillgeist-lite/tools/crm_astro.py --Action validate --Manifest projects/bm-crm/manifest.json --Json
          node projects/bm-crm/scripts/materialize.mjs
          cd .build/bm-crm
          npm install --no-audit --no-fund
          npm run check
          ! grep -Fq '"durable_objects"' wrangler.jsonc
          grep -Fq '"deleted_classes"' wrangler.jsonc
          grep -Fq '/cw-astro-local-store.js' public/index.html
          grep -Fq 'databaseRowsPerDemoSession:0' src/index.js
          grep -Fq 'Pinnacle Residential Group' public/cw-astro-local-bootstrap.js
          grep -Fq 'Boom CSM + Support Dual-Track OS' public/index.html
          test "$(grep -o 'group:"CSM"' public/bm-track.js | wc -l | tr -d ' ')" = "6"
          test "$(grep -o 'group:"Support"' public/bm-track.js | wc -l | tr -d ' ')" = "6"
      - name: Wrangler dry run
        run: cd .build/bm-crm && npx wrangler deploy --dry-run
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd .build/bm-crm
      - name: Attach bm.clintware.com
        run: |
          response=$(curl --fail-with-body -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data '{"hostname":"bm.clintware.com","service":"clintware-bm-crm","zone_name":"clintware.com"}')
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d' <<< "$response"
      - name: Verify live stateless contract
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            h=$(curl -fsS https://bm.clintware.com/health || true)
            p=$(curl -fsS https://bm.clintware.com/ || true)
            if grep -Fq '"storage":"browser-local"' <<< "$h" && grep -Fq '"databaseRowsPerDemoSession":0' <<< "$h" && grep -Fq 'Boom CSM + Support Dual-Track OS' <<< "$p"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Real browser smoke
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/bm_browser_smoke.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bm-browser-smoke
          path: |
            bm-desktop-smoke.png
            bm-mobile-smoke.png
          if-no-files-found: ignore
