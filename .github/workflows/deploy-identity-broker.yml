name: Deploy Clintware Identity Broker

on:
  push:
    branches: [main]
    paths:
      - "identity-broker/**"
      - "skills/oauth-identity-broker/**"
      - ".github/workflows/deploy-identity-broker.yml"
  pull_request:
    paths:
      - "identity-broker/**"
      - "skills/oauth-identity-broker/**"
      - ".github/workflows/deploy-identity-broker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-identity-broker
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install identity broker dependencies
        run: npm install --prefix identity-broker --ignore-scripts --no-audit --no-fund

      - name: Syntax check
        run: npm run check --prefix identity-broker

      - name: Render validation config
        run: node identity-broker/scripts/render-wrangler.mjs 00000000000000000000000000000000

      - name: Wrangler dry run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --prefix identity-broker wrangler deploy --dry-run --config identity-broker/wrangler.generated.jsonc

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      CONTROL_PLANE_MCP_TOKEN: ${{ secrets.CONTROL_PLANE_MCP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -n "${GOOGLE_OAUTH_CLIENT_ID:-}" ] && [ -n "${GOOGLE_OAUTH_CLIENT_SECRET:-}" ]; then
            echo "Google OAuth credentials are present; sign-in can activate after deploy."
          else
            echo "Google OAuth credentials are not present yet. Deploying the broker in setup mode so auth.clintware.com can report exact readiness."
          fi

      - name: Install identity broker dependencies
        run: npm install --prefix identity-broker --ignore-scripts --no-audit --no-fund

      - name: Ensure OAuth KV namespace
        id: kv
        shell: bash
        run: |
          set -euo pipefail
          title="clintware-identity-oauth"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          list=$(curl --fail-with-body -sS "$api?per_page=100&order=title&direction=asc" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          id=$(python3 -c 'import json,sys; d=json.load(sys.stdin); title=sys.argv[1]; print(next((x.get("id","") for x in d.get("result",[]) if x.get("title")==title),""))' "$title" <<< "$list")
          if [ -z "$id" ]; then
            created=$(curl --fail-with-body -sS -X POST "$api" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "{\"title\":\"${title}\"}")
            id=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("result",{}).get("id",""))' <<< "$created")
          fi
          if ! [[ "$id" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "Could not resolve/create OAuth KV namespace. Ensure the Cloudflare token has Workers KV Storage Write." >&2
            exit 1
          fi
          echo "namespace_id=$id" >> "$GITHUB_OUTPUT"
          echo "OAuth KV namespace ready: $title"

      - name: Render production config
        run: node identity-broker/scripts/render-wrangler.mjs "${{ steps.kv.outputs.namespace_id }}"

      - name: Deploy identity broker
        run: npx --prefix identity-broker wrangler deploy --config identity-broker/wrangler.generated.jsonc

      - name: Sync identity broker secrets
        shell: bash
        run: |
          set -euo pipefail
          cd identity-broker
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.generated.jsonc >/dev/null
              echo "$name configured"
            else
              echo "$name not configured; leaving related feature inactive"
            fi
          }
          put_secret GOOGLE_OAUTH_CLIENT_ID "$GOOGLE_OAUTH_CLIENT_ID"
          put_secret GOOGLE_OAUTH_CLIENT_SECRET "$GOOGLE_OAUTH_CLIENT_SECRET"
          put_secret CONTROL_PLANE_MCP_TOKEN "$CONTROL_PLANE_MCP_TOKEN"

      - name: Verify identity broker
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 24); do
            body=$(curl -fsS --connect-timeout 5 --max-time 20 https://auth.clintware.com/health || true)
            if echo "$body" | grep -Fq '"service":"Clintware Identity Broker"'; then
              echo "$body"
              ready=1
              break
            fi
            echo "Waiting for Clintware Identity Broker ($i/24)"
            sleep 5
          done
          test "$ready" = "1"
          body=$(curl -fsS --connect-timeout 5 --max-time 20 https://auth.clintware.com/health)
          if echo "$body" | grep -Fq '"configured":true'; then
            echo "Clintware Google OAuth is ACTIVE."
          else
            echo "Clintware Identity Broker is LIVE in setup mode. Remaining blocker: GOOGLE_OAUTH_CLIENT_ID and GOOGLE_OAUTH_CLIENT_SECRET."
          fi

      - name: Verify central first-party Clintware client
        shell: bash
        run: |
          set -euo pipefail
          mail=$(curl -fsS --retry 6 --retry-delay 2 --retry-all-errors https://auth.clintware.com/client-config/mail)
          n7=$(curl -fsS --retry 6 --retry-delay 2 --retry-all-errors https://auth.clintware.com/client-config/neuron7-case)
          admin=$(curl -fsS --retry 6 --retry-delay 2 --retry-all-errors https://auth.clintware.com/client-config/control-plane-admin)
          MAIL_JSON="$mail" N7_JSON="$n7" ADMIN_JSON="$admin" python3 - <<'PY'
          import json, os
          mail=json.loads(os.environ["MAIL_JSON"])
          n7=json.loads(os.environ["N7_JSON"])
          admin=json.loads(os.environ["ADMIN_JSON"])
          assert mail["client_id"] == n7["client_id"] == admin["client_id"], (mail,n7,admin)
          assert mail["client_name"] == "Clintware Web", mail
          assert n7["client_name"] == "Clintware Web", n7
          assert mail["redirect_uri"] == "https://mail.clintware.com/callback", mail
          assert n7["redirect_uri"] == "https://n7.clintware.com/auth/callback", n7
          assert admin["redirect_uri"] == "https://mcp.clintware.com/admin/callback", admin
          assert mail["pkce"] == "S256" and n7["pkce"] == "S256" and admin["pkce"] == "S256"
          assert mail["client_model"] == "central-first-party-cimd"
          assert n7["client_model"] == "central-first-party-cimd"
          assert admin["client_model"] == "central-first-party-cimd"
          assert mail["client_id"] == "https://auth.clintware.com/client/clintware-web"
          assert n7["client_id"] == "https://auth.clintware.com/client/clintware-web"
          print("Central Clintware OAuth CIMD client verified for mail + neuron7-case:", mail["client_id"])
          PY
          metadata=$(curl -fsS --retry 6 --retry-delay 2 --retry-all-errors https://auth.clintware.com/client/clintware-web)
          METADATA_JSON="$metadata" python3 - <<'PY'
          import json, os
          m=json.loads(os.environ["METADATA_JSON"])
          assert m["client_id"] == "https://auth.clintware.com/client/clintware-web", m
          assert m["client_name"] == "Clintware Web", m
          assert m["token_endpoint_auth_method"] == "none", m
          assert "https://mail.clintware.com/callback" in m["redirect_uris"], m
          assert "https://n7.clintware.com/auth/callback" in m["redirect_uris"], m
          assert "https://mcp.clintware.com/admin/callback" in m["redirect_uris"], m
          print("CIMD metadata document verified.")
          PY

      - name: Verify branded stateless authorization handoff
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/cw-cookies /tmp/cw-consent.html /tmp/cw-post-headers
          auth='https://auth.clintware.com/authorize?response_type=code&client_id=https%3A%2F%2Fauth.clintware.com%2Fclient%2Fclintware-web&redirect_uri=https%3A%2F%2Fn7.clintware.com%2Fauth%2Fcallback&scope=identity%20email%20profile&state=ci-smoke&code_challenge=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA&code_challenge_method=S256&resource=https%3A%2F%2Fauth.clintware.com%2Fuserinfo'
          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors -D /tmp/cw-consent-headers -c /tmp/cw-cookies "$auth" -o /tmp/cw-consent.html
          grep -Eqi "^content-security-policy:.*form-action 'self' https://accounts\.google\.com" /tmp/cw-consent-headers
          grep -Fq 'class="eclipse"' /tmp/cw-consent.html
          grep -Fq 'Clintware Identity' /tmp/cw-consent.html
          grep -Fq 'Continue with Google' /tmp/cw-consent.html
          readarray -t values < <(python3 - <<'PY'
          import html,re
          s=open('/tmp/cw-consent.html',encoding='utf-8').read()
          for name in ('transaction','csrf'):
              m=re.search(r'name="'+name+r'" value="([^"]+)"',s)
              assert m, name
              print(html.unescape(m.group(1)))
          PY
          )
          transaction="${values[0]}"
          csrf="${values[1]}"
          curl -sS -o /dev/null -D /tmp/cw-post-headers -b /tmp/cw-cookies \
            --data-urlencode "transaction=$transaction" \
            --data-urlencode "csrf=$csrf" \
            --data-urlencode 'decision=approve' \
            https://auth.clintware.com/authorize
          status=$(awk 'NR==1{print $2}' /tmp/cw-post-headers)
          test "$status" = "302"
          location=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' /tmp/cw-post-headers)
          echo "$location" | grep -Eq '^https://accounts\.google\.com/'
          echo "$location" | grep -Fq 'state='
          echo 'Branded stateless authorization handoff verified through Google redirect.'
