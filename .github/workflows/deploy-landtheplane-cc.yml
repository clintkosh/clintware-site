name: Deploy LandThePlane Command Center

on:
  push:
    branches: [main]
    paths:
      - "projects/landtheplane-cc/**"
      - "projects/dpl-crm/**"
      - ".github/workflows/deploy-landtheplane-cc.yml"
  pull_request:
    paths:
      - "projects/landtheplane-cc/**"
      - "projects/dpl-crm/**"
      - "identity-broker/**"
      - ".github/workflows/deploy-landtheplane-cc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-landtheplane-cc
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Materialize private career command center
        run: |
          set -euo pipefail
          node projects/landtheplane-cc/scripts/materialize.mjs
          cd .build/landtheplane-cc
          npm install --no-audit --no-fund
          npm run check

      - name: Verify architecture and access contracts
        shell: bash
        run: |
          set -euo pipefail
          root=.build/landtheplane-cc
          grep -Fq 'const APP_ID="landtheplane-cc"' "$root/src/index.js"
          grep -Fq 'const REQUIRED_CONTEXT="landtheplane-cc:read"' "$root/src/index.js"
          grep -Fq 'const COMPANY_DOMAIN="clintware.com"' "$root/src/index.js"
          grep -Fq 'const WORKSPACE_ID="landtheplane-cc-private"' "$root/src/index.js"
          grep -Fq 'u.provider!=="google"' "$root/src/index.js"
          grep -Fq 'ctx.includes("landtheplane-cc:write")' "$root/src/index.js"
          grep -Fq 'env.CRM.idFromName("landtheplane-cc-main")' "$root/src/index.js"
          grep -Fq 'p==="/career-board"' "$root/src/index.js"
          grep -Fq '"job_profile"' "$root/src/index.js"
          grep -Fq '"active_role"' "$root/src/index.js"
          grep -Fq 'google_evidence' "$root/src/index.js"
          grep -Fq 'calendar_evidence' "$root/src/index.js"
          grep -Fq 'export {DPLCRM};' "$root/src/cc-entry.js"
          grep -Fq 'latestFieldReport' "$root/src/cc-entry.js"
          grep -Fq 'GOOGLE_DELEGATED_BRIDGE_SECRET' "$root/src/cc-entry.js"
          grep -Fq 'https://www.googleapis.com/auth/gmail.readonly' "$root/src/cc-entry.js"
          grep -Fq 'https://www.googleapis.com/auth/calendar.readonly' "$root/src/cc-entry.js"
          grep -Fq 'evidenceEmail==="clint.kosh@gmail.com"' "$root/src/cc-entry.js"
          grep -Fq 'evidenceEmail.endsWith("@clintware.com")' "$root/src/cc-entry.js"
          grep -Fq 'LandThePlane Command Center' "$root/public/index.html"
          grep -Fq 'Career Operating System' "$root/public/cc.js"
          grep -Fq 'Active Job Workspace' "$root/public/cc.js"
          grep -Fq 'Search engine telemetry' "$root/public/cc.js"
          grep -Fq 'allowedEmails: Object.freeze(["clint.kosh@gmail.com"])' identity-broker/src/first-party.js
          grep -Fq 'allowedEmailDomains: Object.freeze(["clintware.com"])' identity-broker/src/first-party.js
          grep -Fq 'identityProviders: Object.freeze(["google"])' identity-broker/src/first-party.js
          grep -Fq '"https://www.googleapis.com/auth/gmail.readonly"' identity-broker/src/delegated-google.js
          grep -Fq '"https://www.googleapis.com/auth/calendar.readonly"' identity-broker/src/delegated-google.js
          test ! -e "$root/prepare-production.mjs"

      - name: Wrangler dry run
        run: |
          set -euo pipefail
          cd .build/landtheplane-cc
          npx wrangler deploy --dry-run

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build deployable worker
        run: |
          set -euo pipefail
          node projects/landtheplane-cc/scripts/materialize.mjs
          cd .build/landtheplane-cc
          npm install --no-audit --no-fund
          npm run check

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd .build/landtheplane-cc

      - name: Bind delegated Google boundary
        shell: bash
        run: |
          set -euo pipefail
          bridge_secret=$(printf 'clintware-google-delegated:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          printf '%s' "$bridge_secret" | npx --prefix .build/landtheplane-cc wrangler secret put GOOGLE_DELEGATED_BRIDGE_SECRET --config .build/landtheplane-cc/wrangler.jsonc >/dev/null
          echo "Delegated Google bridge secret synchronized without exposing its value."

      - name: Attach cc.clintware.com
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X PUT             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H "Content-Type: application/json"             --data '{"hostname":"cc.clintware.com","service":"clintware-landtheplane-cc","zone_name":"clintware.com"}')
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d' <<< "$response"

      - name: Verify identity dependency
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 60); do
            cfg=$(curl -fsS --connect-timeout 5 --max-time 15 https://auth.clintware.com/client-config/landtheplane-cc || true)
            if python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["redirect_uri"]=="https://cc.clintware.com/auth/callback"; assert d["allowed_email_domains"]==["clintware.com"]; assert d["allowed_identity_providers"]==["google"]; assert "landtheplane-cc:read" in d["application_context"]; assert "landtheplane-cc:write" in d["application_context"]' <<< "$cfg" 2>/dev/null; then
              ready=1
              break
            fi
            echo "Waiting for LandThePlane CC identity registration ($i/60)"
            sleep 5
          done
          test "$ready" = "1"

      - name: Verify live private command center
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 48); do
            h=$(curl -fsS --connect-timeout 5 --max-time 15 https://cc.clintware.com/health || true)
            if echo "$h" | grep -Fq '"service":"clintware-landtheplane-cc"'               && echo "$h" | grep -Fq '"oauthApp":"landtheplane-cc"'               && echo "$h" | grep -Fq '"guest":false'; then
              ready=1
              break
            fi
            echo "Waiting for cc.clintware.com ($i/48)"
            sleep 5
          done
          test "$ready" = "1"

          root_headers=$(mktemp)
          root_code=$(curl -sS -o /dev/null -D "$root_headers" -w '%{http_code}' https://cc.clintware.com/)
          test "$root_code" = "302"
          grep -Eqi '^location: /auth/login' "$root_headers"
          grep -Eqi '^strict-transport-security:' "$root_headers"
          grep -Eqi '^x-frame-options: DENY' "$root_headers"
          grep -Eqi '^x-robots-tag: noindex' "$root_headers"

          board_code=$(curl -sS -o /tmp/ltpcc-board.json -w '%{http_code}' https://cc.clintware.com/api/career-board)
          test "$board_code" = "401"
          grep -Fq '"authentication_required"' /tmp/ltpcc-board.json

          google_code=$(curl -sS -o /tmp/ltpcc-google.json -w '%{http_code}' https://cc.clintware.com/api/google/status)
          test "$google_code" = "401"

          login_headers=$(mktemp)
          login_code=$(curl -sS -o /dev/null -D "$login_headers" -w '%{http_code}' https://cc.clintware.com/auth/login)
          test "$login_code" = "302"
          grep -Eqi '^location: https://auth\.clintware\.com/' "$login_headers"

          disclosure=$(curl -fsS 'https://auth.clintware.com/delegated/google/start?return_to=https%3A%2F%2Fcc.clintware.com%2F%3Fgoogle%3Dconnected')
          echo "$disclosure" | grep -Fq 'Connect Google to Clintware'
          echo "$disclosure" | grep -Fq 'Continue to Google'

          delegated_headers=$(mktemp)
          curl -sS -o /dev/null -D "$delegated_headers" 'https://auth.clintware.com/delegated/google/start?confirm=1&return_to=https%3A%2F%2Fcc.clintware.com%2F%3Fgoogle%3Dconnected'
          delegated_location=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$delegated_headers")
          echo "$delegated_location" | grep -Eq '^https://accounts\.google\.com/'
          echo "$delegated_location" | grep -Eq 'gmail(\.readonly|%2Fgmail)'
          echo "$delegated_location" | grep -Eq 'calendar(\.readonly|%2Fcalendar)'

          domains=$(curl --fail-with-body -sS             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=cc.clintware.com"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True and len(r)==1,d; x=r[0]; assert x.get("hostname")=="cc.clintware.com" and x.get("service")=="clintware-landtheplane-cc",x' <<< "$domains"
          echo "LandThePlane Command Center live privacy and domain checks passed."
