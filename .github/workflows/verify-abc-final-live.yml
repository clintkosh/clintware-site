name: Verify ABC final live

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-abc-final-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Stable production browser verification
        run: |
          set -euo pipefail
          mkdir -p /tmp/abc-final && cd /tmp/abc-final
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core >/dev/null 2>&1
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          export ABC_PASS="$(python3 -c 'import os,re; s=open(os.path.join(os.environ["GITHUB_WORKSPACE"],"abc/src/index.js")).read(); m=re.search(r"const PASS=\x27([^\x27]+)\x27",s); assert m; print(m.group(1))')"
          cat > verify.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs/promises';

          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
          let context,page;
          let finalReady=false;
          for(let attempt=1;attempt<=24;attempt++){
            if(context) await context.close();
            context=await browser.newContext();
            page=await context.newPage();
            await page.goto(`https://abc.clintware.com/?final=${Date.now()}-${attempt}`,{waitUntil:'domcontentloaded',timeout:30000});
            const source=await page.content();
            if(source.includes('ABNORMAL // CUSTOMER SUCCESS') && source.includes('Print / Save PDF') && source.includes('trackPageView') && source.includes('Open customer risks')){
              finalReady=true;
              console.log(`Final ABC build reached in Chrome on attempt ${attempt}`);
              break;
            }
            console.log(`Waiting for final ABC edge propagation (${attempt}/24)`);
            await new Promise(r=>setTimeout(r,5000));
          }
          if(!finalReady) throw new Error('Chrome never reached final ABC build');

          // The hidden app intentionally performs a one-time model migration/reload even
          // while the access gate is locked. Wait for that reload to finish before testing
          // wrong-password feedback so the reload cannot erase the error message.
          await page.waitForFunction(()=>{
            try{const d=JSON.parse(localStorage.getItem('zs_ops_dtex_model_v2')||'null');return d?.abcAbnormalModelVersion===4&&d.accounts?.length===20&&d.accounts[0]?.name==='Lone Mesa Energy'}catch(e){return false}
          },{timeout:30000});
          await page.waitForFunction(()=>document.querySelector('#access-form')&&typeof document.querySelector('#access-form').onsubmit==='function',{timeout:15000});
          await page.waitForTimeout(500);

          const pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(e.stack||e.message));
          if(await page.locator('#gate').count()!==1) throw new Error('login gate missing');
          await page.fill('#pw','wrong-password');
          await page.click('#access-form button[type="submit"]');
          await page.waitForFunction(()=>((document.querySelector('#gate-error')?.textContent||'').trim().length>0),{timeout:5000});
          const wrong=(await page.textContent('#gate-error')||'').trim();
          if(!wrong.toLowerCase().includes('incorrect')) throw new Error(`wrong-password feedback failed: ${JSON.stringify(wrong)}`);
          if(await page.evaluate(()=>document.body.classList.contains('unlocked'))) throw new Error('wrong password unlocked app');

          await page.fill('#pw',process.env.ABC_PASS);
          await page.click('#access-form button[type="submit"]');
          await page.waitForFunction(()=>document.body.classList.contains('unlocked'),{timeout:15000});
          await page.waitForFunction(()=>document.body.classList.contains('unlocked')&&document.querySelector('.topbar'),{timeout:15000});

          // Branding and overview cards.
          const brand=(await page.locator('.brandcopy').innerText()).trim();
          if(!brand.includes('ABNORMAL // CUSTOMER SUCCESS')) throw new Error('final Abnormal-style brand missing');
          if((await page.locator('body').innerText()).includes('Post-Sales Business Operations')) throw new Error('visible legacy ZS brand remains');
          await page.locator('.topnav [data-route="command"]').click();
          await page.waitForSelector('.kpi-card');
          if(await page.locator('.kpi-card').count()!==6) throw new Error('expected six clickable overview KPI cards');
          const cardRoutes=await page.locator('.kpi-card').evaluateAll(xs=>xs.map(x=>x.dataset.route));
          const expectedCardRoutes=['accounts','kpis','renewal','accounts','accounts','playbooks'];
          if(JSON.stringify(cardRoutes)!==JSON.stringify(expectedCardRoutes)) throw new Error(`unexpected KPI routes ${JSON.stringify(cardRoutes)}`);
          for(let i=0;i<6;i++){
            await page.locator('.topnav [data-route="command"]').click();
            const target=(await page.locator('.kpi-card').nth(i).getAttribute('data-route'));
            await page.locator('.kpi-card').nth(i).click();
            await page.waitForFunction(r=>document.querySelector(`.topnav [data-route="${r}"]`)?.classList.contains('active'),target);
          }

          // Exercise every main route for analytics coverage.
          const mainRoutes=['command','accounts','renewal','playbooks','cadence','capacity','finance','intake','kpis','settings'];
          for(const route of mainRoutes){
            await page.locator(`.topnav [data-route="${route}"]`).click();
            await page.waitForFunction(r=>document.querySelector(`.topnav [data-route="${r}"]`)?.classList.contains('active'),route);
          }

          // Open an account and exercise every account tab.
          await page.locator('.topnav [data-route="accounts"]').click();
          const model=await page.evaluate(()=>JSON.parse(localStorage.getItem('zs_ops_dtex_model_v2')));
          const accountId=model.accounts[0].id;
          await page.locator(`[data-open="${accountId}"]`).first().click();
          await page.waitForSelector('[data-edit-account]');
          const tabs=['summary','stakeholders','success','technical','meetings','notes','commercial'];
          for(const tab of tabs){
            await page.locator(`[data-tab="${tab}"]`).click();
            await page.waitForFunction(t=>document.querySelector(`[data-tab="${t}"]`)?.classList.contains('active'),tab);
          }

          // Notes: blank validation, visible success, prepend to top, persistence.
          await page.locator('[data-tab="notes"]').click();
          const before=await page.evaluate(id=>JSON.parse(localStorage.getItem('zs_ops_dtex_model_v2')).accounts.find(a=>String(a.id)===String(id)).notes.length,accountId);
          await page.locator('[data-add-note]').click();
          await page.locator('#save-note').click();
          if(!(await page.locator('#note-error').innerText()).includes('Enter a note')) throw new Error('blank note validation missing');
          const unique=`FINAL LIVE NOTE ${Date.now()}`;
          await page.fill('#n-text',unique);
          await page.locator('#save-note').click();
          await page.waitForSelector('.abc-toast');
          if(!(await page.locator('.abc-toast').innerText()).includes('Note saved')) throw new Error('note saved feedback missing');
          if(!await page.locator('[data-tab="notes"]').evaluate(e=>e.classList.contains('active'))) throw new Error('Notes tab did not remain active after save');
          const stored=await page.evaluate(id=>JSON.parse(localStorage.getItem('zs_ops_dtex_model_v2')).accounts.find(a=>String(a.id)===String(id)),accountId);
          if(stored.notes.length!==before+1||stored.notes[0].text!==unique) throw new Error('note did not prepend/persist');
          const firstRecord=(await page.locator('.record').first().innerText());
          if(!firstRecord.includes(unique)) throw new Error('new note not visible at top of Notes list');

          // Meeting brief and real print/PDF layout.
          const popupPromise=page.waitForEvent('popup');
          await page.locator('[data-brief]').first().click();
          if(await page.locator('#print-brief').count()!==1) throw new Error('Print / Save PDF control missing');
          await page.locator('#print-brief').click();
          const popup=await popupPromise;
          await popup.waitForLoadState('domcontentloaded').catch(()=>{});
          await popup.waitForTimeout(250);
          const popupText=await popup.locator('body').innerText();
          if(!popupText.includes('Manual notes / decisions')) throw new Error('manual notes section missing from print brief');
          if(!popupText.includes(unique)) throw new Error('custom account note missing from print brief');
          if(!popupText.includes('EBR storyline')) throw new Error('EBR storyline missing from print brief');
          const screenLayout=await popup.evaluate(()=>{
            const body=document.body.getBoundingClientRect();
            const dates=[...document.querySelectorAll('.date-value')].map(el=>{const r=el.getBoundingClientRect(),cs=getComputedStyle(el);return{text:el.textContent,whiteSpace:cs.whiteSpace,left:r.left,right:r.right,bodyLeft:body.left,bodyRight:body.right}});
            return{dates,docOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1};
          });
          if(screenLayout.dates.length<3) throw new Error('expected multiple formatted dates in print brief');
          if(screenLayout.docOverflow) throw new Error('print brief has horizontal overflow');
          for(const d of screenLayout.dates){
            if(d.whiteSpace!=='nowrap') throw new Error(`date is allowed to wrap: ${d.text}`);
            if(d.left<d.bodyLeft-1||d.right>d.bodyRight+1) throw new Error(`date exceeds printable body: ${d.text}`);
          }
          await popup.emulateMedia({media:'print'});
          const printDates=await popup.evaluate(()=>[...document.querySelectorAll('.date-value')].map(el=>({text:el.textContent,whiteSpace:getComputedStyle(el).whiteSpace,width:el.getBoundingClientRect().width})));
          if(printDates.some(d=>d.whiteSpace!=='nowrap'||d.width<=0)) throw new Error('date print CSS failed');
          const pdf=await popup.pdf({format:'Letter',printBackground:true,preferCSSPageSize:true});
          if(pdf.length<5000||pdf.subarray(0,5).toString()!=='%PDF-') throw new Error('generated print PDF invalid');
          await fs.writeFile('/tmp/abc-final-meeting-brief.pdf',pdf);
          console.log(`Generated verified PDF: ${pdf.length} bytes; ${screenLayout.dates.length} date fields all inside printable body`);
          await popup.close();
          await page.locator('[data-close]').first().click();

          // Audit GA before reload because dataLayer is page-scoped and a reload clears its history.
          const analytics=await page.evaluate(()=>{
            const rows=(window.dataLayer||[]).map(x=>{try{return Array.from(x)}catch(e){return x}});
            const config=rows.some(x=>Array.isArray(x)&&x[0]==='config'&&x[1]==='G-DCY144YM9P');
            const paths=rows.filter(x=>Array.isArray(x)&&x[0]==='event'&&x[1]==='page_view').map(x=>x[2]?.page_path).filter(Boolean);
            const pdfEvent=rows.some(x=>Array.isArray(x)&&x[0]==='event'&&x[1]==='meeting_brief_pdf_open');
            return{config,paths,pdfEvent};
          });
          if(!analytics.config) throw new Error('Google Analytics config missing');
          const needed=[...mainRoutes.map(r=>`/abc/${r}`),...tabs.map(t=>`/abc/account/${t}`)];
          for(const p of needed) if(!analytics.paths.includes(p)) throw new Error(`Google Analytics page_view missing ${p}; got ${JSON.stringify(analytics.paths)}`);
          if(analytics.paths.some(p=>/Lone|Mesa|Energy|FINAL LIVE NOTE/i.test(p))) throw new Error('analytics page path contains account/note content');
          if(!analytics.pdfEvent) throw new Error('meeting brief PDF analytics event missing');

          // Confirm persisted note after a reload; also confirm GA initializes again on the fresh page.
          await page.reload({waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.body.classList.contains('unlocked')&&document.querySelector('.topbar'),{timeout:15000});
          const afterReload=await page.evaluate(({id,text})=>JSON.parse(localStorage.getItem('zs_ops_dtex_model_v2')).accounts.find(a=>String(a.id)===String(id)).notes[0].text===text,{id:accountId,text:unique});
          if(!afterReload) throw new Error('new note missing after reload');
          const gaAfterReload=await page.evaluate(()=>{
            const rows=(window.dataLayer||[]).map(x=>{try{return Array.from(x)}catch(e){return x}});
            return rows.some(x=>Array.isArray(x)&&x[0]==='config'&&x[1]==='G-DCY144YM9P');
          });
          if(!gaAfterReload) throw new Error('Google Analytics did not initialize after reload');

          if(pageErrors.length) throw new Error('browser page errors: '+pageErrors.join(' | '));
          console.log('PASS: final live ABC branding + clickable overview + note save UX + PDF date safety + Google Analytics on all SPA pages/tabs');
          console.log('GA_PATHS',JSON.stringify([...new Set(analytics.paths)].sort()));
          await context.close();
          await browser.close();
          NODE
          CHROME="$chrome" node verify.mjs
