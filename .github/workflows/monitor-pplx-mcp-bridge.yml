name: Monitor Perplexity MCP Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "pplx-mcp-bridge/**"
      - ".github/workflows/monitor-pplx-mcp-bridge.yml"

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: monitor-pplx-mcp-bridge
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MCP_TOKEN: ${{ secrets.CONTROL_PLANE_MCP_TOKEN }}
      BRIDGE_HEALTH: https://pplx-mcp.clintware.com/health
      BRIDGE_MCP: https://pplx-mcp.clintware.com/mcp
    steps:
      - name: Probe bridge
        id: probe
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          failures=0

          hc=$(curl -sS --max-time 20 -o /tmp/h -w '%{http_code}' "$BRIDGE_HEALTH" || true)
          echo "bridge_health_http=$hc"
          cat /tmp/h || true
          echo
          if [[ "$hc" != "200" ]] || ! grep -Fq '"ok":true' /tmp/h; then failures=$((failures+1)); fi

          uc=$(curl -sS --max-time 20 -o /tmp/u -w '%{http_code}' -X POST "$BRIDGE_MCP" \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"bridge-monitor","version":"1.0"}}}' || true)
          echo "bridge_unauth_http=$uc"
          if [[ "$uc" != "401" ]]; then failures=$((failures+1)); fi

          if [[ -z "${MCP_TOKEN:-}" ]]; then
            echo "::error::CONTROL_PLANE_MCP_TOKEN missing"
            failures=$((failures+1))
          else
            ac=$(curl -sS --max-time 30 -o /tmp/a -w '%{http_code}' -X POST "$BRIDGE_MCP" \
              -H "X-Clintware-MCP-Token: ${MCP_TOKEN}" \
              -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":2,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"bridge-monitor","version":"1.0"}}}' || true)
            echo "bridge_auth_http=$ac"
            head -c 1200 /tmp/a || true
            echo
            if [[ ! "$ac" =~ ^2 ]] || ! grep -Eq 'protocolVersion|jsonrpc|event:' /tmp/a; then failures=$((failures+1)); fi
          fi

          if [[ "$failures" -eq 0 ]]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "healthy=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Auto-recover bridge
        id: recovery
        if: steps.probe.outputs.healthy != 'true'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          gh workflow run deploy-pplx-mcp-bridge.yml --repo "$GITHUB_REPOSITORY" --ref main
          sleep 8
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-pplx-mcp-bridge.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "Recovery deployment: $run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          sleep 5
          hc=$(curl -sS --max-time 20 -o /tmp/rh -w '%{http_code}' "$BRIDGE_HEALTH" || true)
          ac=$(curl -sS --max-time 30 -o /tmp/ra -w '%{http_code}' -X POST "$BRIDGE_MCP" \
            -H "X-Clintware-MCP-Token: ${MCP_TOKEN}" \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":3,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"bridge-recovery","version":"1.0"}}}' || true)
          if [[ "$hc" == "200" && "$ac" =~ ^2 ]] && grep -Eq 'protocolVersion|jsonrpc|event:' /tmp/ra; then
            echo "recovered=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "recovered=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Open incident if still broken
        if: steps.probe.outputs.healthy != 'true' && steps.recovery.outputs.recovered != 'true'
        shell: bash
        run: |
          set -euo pipefail
          title='Perplexity MCP bridge: automatic recovery failed'
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          body="The Perplexity MCP bridge failed its health/auth contract and automatic redeploy did not restore service.\n\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n\nNo credential values are included."
          if [[ -z "$existing" ]]; then gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; else gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"; fi
          exit 1

      - name: Close recovered incident
        if: steps.probe.outputs.healthy == 'true' || steps.recovery.outputs.recovered == 'true'
        shell: bash
        run: |
          set -euo pipefail
          title='Perplexity MCP bridge: automatic recovery failed'
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[].number' | while read -r issue; do
            [[ -z "$issue" ]] && continue
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Automated monitor confirms the Perplexity MCP bridge is healthy again. Closing incident."
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed
          done
