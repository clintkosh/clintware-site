name: Inventory Secret Names

on:
  push:
    paths:
      - ".github/workflows/inventory-secret-names.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      SECRETS_JSON: ${{ toJSON(secrets) }}
    steps:
      - name: Print secret names only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          data=json.loads(os.environ.get('SECRETS_JSON','{}') or '{}')
          print('SECRET_NAME_COUNT='+str(len(data)))
          for k in sorted(data):
              print('SECRET_NAME='+k)
          PY
