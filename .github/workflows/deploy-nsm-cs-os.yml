name: Deploy NSM ServiceNow Customer Outcomes OS

on:
  push:
    branches: [main]
    paths:
      - "projects/nsm-cs-os/**"
      - "projects/dpl-crm/**"
      - "projects/dplr-crm/scripts/browser-local-runtime.mjs"
      - "projects/dplr-crm/public/cw-astro-local-store.js"
      - "tests/nsm_browser_smoke.mjs"
      - ".github/workflows/deploy-nsm-cs-os.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-nsm-cs-os
  cancel-in-progress: true

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Materialize and validate browser-local artifact
        run: |
          set -euo pipefail
          node projects/nsm-cs-os/scripts/materialize.mjs
          cd .build/nsm-cs-os
          npm install --no-audit --no-fund
          npm run check
          ! grep -Fq '"durable_objects"' wrangler.jsonc
          grep -Fq '"deleted_classes"' wrangler.jsonc
          grep -Fq '/cw-astro-local-store.js' public/index.html
          grep -Fq 'databaseRowsPerDemoSession:0' src/index.js
          grep -Fq 'durableObjectsRequired:false' src/index.js
          grep -Fq 'Aegis Federal Programs' public/cw-astro-local-bootstrap.js
          grep -Fq 'INC0012847' public/cw-astro-local-bootstrap.js
          grep -Fq 'Harborview Health System' public/cw-astro-local-bootstrap.js
          grep -Fq 'NSM // SERVICE OUTCOMES' public/nsm.js
          grep -Fq 'ServiceNow compatibility' public/nsm.js
          grep -Fq 'Architect / delivery handoff' public/nsm.js
          grep -Fq 'Account Workspace' public/nsm.js
          grep -Fq 'Download PDF' public/nsm.js
          ! grep -Rqi '<img' public
          npx wrangler deploy --dry-run

      - name: Deploy stateless Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd .build/nsm-cs-os

      - name: Attach nsm.clintware.com
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data '{"hostname":"nsm.clintware.com","service":"clintware-nsm-cs-os","zone_name":"clintware.com"}')
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d' <<< "$response"

      - name: Verify live stateless and security contract
        run: |
          set -euo pipefail
          base=https://nsm.clintware.com
          ready=0
          for i in $(seq 1 48); do
            h=$(curl -fsS --connect-timeout 5 --max-time 15 "$base/health" || true)
            p=$(curl -fsS --connect-timeout 5 --max-time 15 "$base/" || true)
            j=$(curl -fsS --connect-timeout 5 --max-time 15 "$base/nsm.js" || true)
            if grep -Fq '"service":"clintware-nsm-cs-os"' <<< "$h"               && grep -Fq '"storage":"browser-local"' <<< "$h"               && grep -Fq '"databaseRowsPerDemoSession":0' <<< "$h"               && grep -Fq '"durableObjectsRequired":false' <<< "$h"               && grep -Fq 'NSM ServiceNow Customer Outcomes OS' <<< "$p"               && grep -Fq 'Post-implementation command view' <<< "$j"; then
              ready=1; break
            fi
            sleep 5
          done
          test "$ready" = "1"
          headers=$(curl -fsS -D - -o /dev/null "$base/")
          grep -Fqi 'strict-transport-security:' <<< "$headers"
          grep -Fqi 'x-frame-options: DENY' <<< "$headers"
          grep -Fqi 'x-robots-tag: noindex' <<< "$headers"
          grep -Fqi 'content-security-policy:' <<< "$headers"
          domains=$(curl --fail-with-body -sS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=nsm.clintware.com" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True and len(r)==1,d; assert r[0].get("service")=="clintware-nsm-cs-os",r[0]' <<< "$domains"

      - name: Real browser CRUD and reload persistence smoke
        timeout-minutes: 6
        run: |
          set -euo pipefail
          google-chrome --version
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          PLAYWRIGHT_CHANNEL=chrome timeout 240s node tests/nsm_browser_smoke.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsm-browser-evidence
          path: |
            nsm-desktop.png
            nsm-mobile.png
            nsm-failure.png
          if-no-files-found: ignore
