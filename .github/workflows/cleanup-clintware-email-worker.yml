name: Cleanup Obsolete Clintware Email Worker

on:
  push:
    paths:
      - ".github/workflows/cleanup-clintware-email-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SCRIPT_NAME: clintware-email-forwarder
    steps:
      - name: Remove obsolete no-target Email Worker
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          url="${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}"
          code=$(curl --compressed -sS -o /tmp/get.json -w '%{http_code}' "$url" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Accept: application/json")
          if [[ "$code" == "404" ]]; then
            echo "OBSOLETE_WORKER_ALREADY_ABSENT=true"
            exit 0
          fi
          if [[ "$code" != "200" ]]; then
            echo "Unexpected lookup HTTP $code"
            cat /tmp/get.json || true
            exit 1
          fi
          dcode=$(curl --compressed -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE "$url" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Accept: application/json")
          if [[ "$dcode" -lt 200 || "$dcode" -ge 300 ]]; then
            echo "Delete HTTP $dcode"
            cat /tmp/delete.json || true
            exit 1
          fi
          echo "OBSOLETE_WORKER_REMOVED=true"
