name: Deploy NMA AI Security Customer Operating System

on:
  push:
    branches: [main]
    paths:
      - "projects/nma-crm/**"
      - "projects/dplr-crm/**"
      - "projects/dpl-crm/**"
      - ".github/workflows/deploy-nma-crm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-nma-crm
  cancel-in-progress: true

jobs:
  validate-deploy-verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Layer 1 - materialize and role logic validation
        run: |
          set -euo pipefail
          node projects/nma-crm/scripts/materialize.mjs
          cd .build/nma-crm
          npm install --no-audit --no-fund
          npm run check
          grep -Fq '"name": "clintware-nma-crm"' wrangler.jsonc
          grep -Fq 'const APP_ID="nma-crm"' src/index.js
          grep -Fq 'const WORKSPACE_ID="nma-northstar"' src/index.js
          grep -Fq 'Northstar Bank (Synthetic)' public/nma-local-api.js
          grep -Fq 'Priority MCP governance coverage' public/nma-local-api.js
          grep -Fq 'Noma AI Security Customer Operating System' public/index.html
          grep -Fq 'noindex,nofollow,noarchive' public/index.html
          grep -Fq '/nma-local-api.js' public/index.html
          grep -Fq 'data:image/svg+xml' public/index.html
          grep -Fq 'Customer Insight & Product Signal' public/nma-track.js
          grep -Fq 'Download CISO brief PDF' public/nma-track.js
          grep -Fq 'Print / Save PDF' public/nma-track.js
          grep -Fq 'MCP governance' public/nma-track.js
          grep -Fq 'blocked before DRIZNET delivery' public/nma-build-status.js
          grep -Fq '"pattern": "nma.clintware.com"' wrangler.jsonc
          ! grep -Fq 'durable_objects' wrangler.jsonc
          grep -Fq '"deleted_classes"' wrangler.jsonc
          grep -Fq '"v2-browser-local"' wrangler.jsonc
          ! grep -RqiE 'Doppel|doppel\.com' src public

      - name: Layer 1 - Wrangler dry run
        run: |
          set -euo pipefail
          cd .build/nma-crm
          npx wrangler deploy --dry-run

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd .build/nma-crm

      - name: Layer 2 - live static/runtime contract
        run: |
          set -euo pipefail
          base=https://nma.clintware.com
          ready=0
          for i in $(seq 1 48); do
            h=$(curl -fsS --connect-timeout 5 --max-time 15 "$base/health" || true)
            p=$(curl -fsS --connect-timeout 5 --max-time 15 "$base/" || true)
            l=$(curl -fsS --connect-timeout 5 --max-time 15 "$base/nma-local-api.js" || true)
            if grep -Fq '"service":"clintware-nma-crm"' <<< "$h" \
              && grep -Fq '"databaseRowsPerDemoSession":0' <<< "$h" \
              && grep -Fq 'Noma AI Security Customer Operating System' <<< "$p" \
              && grep -Fq 'Northstar Bank (Synthetic)' <<< "$l"; then
              ready=1
              break
            fi
            echo "Waiting for nma.clintware.com (${i}/48)"
            sleep 5
          done
          test "$ready" = "1"
          track_js=$(curl -fsS "$base/nma-track.js")
          grep -Fq 'Customer Insight & Product Signal' <<< "$track_js"
          build_status_js=$(curl -fsS "$base/nma-build-status.js")
          grep -Fq 'local execution is recorded as 0' <<< "$build_status_js"
          code=$(curl -sS -o /tmp/nma-api-direct.json -w '%{http_code}' "$base/api/state" | tr -cd '0-9')
          test "$code" = "409"
          grep -Fq 'browser_local_api' /tmp/nma-api-direct.json

      - name: Install browser verifier
        run: |
          set -euo pipefail
          google-chrome --version
          mkdir -p /tmp/nma-browser
          cd /tmp/nma-browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0

      - name: Layer 3 - Chromium state, CRUD, presentation, PDF, persistence, and responsive checks
        run: |
          set -euo pipefail
          cat >/tmp/nma-browser/verify.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,channel:'chrome'});
          const ctx=await browser.newContext({acceptDownloads:true,viewport:{width:1440,height:960}});
          const page=await ctx.newPage();
          const errors=[];
          const badResponses=[];
          page.on('pageerror',e=>errors.push('page:'+String(e)));
          page.on('response',r=>{if(r.status()>=400) badResponses.push(`${r.status()} ${r.url()}`)});
          page.on('console',m=>{if(m.type()==='error'&&!/^Failed to load resource/i.test(m.text())) errors.push('console:'+m.text())});
          const response=await page.goto('https://nma.clintware.com/',{waitUntil:'networkidle'});
          if(!response?.ok()) throw new Error('landing HTTP '+response?.status());
          await page.locator('[data-nma-track="portfolio"]').click();
          await page.locator('.nma-banner').waitFor({state:'visible'});
          const title=await page.title();
          if(!title.includes('Noma AI Security')) throw new Error('wrong title');
          const initial=await page.evaluate(()=>fetch('/api/state').then(r=>r.json()));
          if(initial.access?.storage!=='browser-local') throw new Error('browser-local storage contract missing');
          if(initial.customer?.name!=='Northstar Bank (Synthetic)') throw new Error('wrong golden account');
          if(initial.customers.length<7) throw new Error('sample portfolio incomplete: '+initial.customers.length);
          const names=new Set(initial.customers.map(x=>x.name));
          for(const n of ['Northstar Bank (Synthetic)','Harbor Financial Group','Aster Health Systems','Vector Commerce','Forge Industrial','Summit SaaS','Northwind Technology Services']) if(!names.has(n)) throw new Error('missing sample '+n);
          const expectedPhases=new Set(['discover','govern','test','protect','prove','expand']);
          const phases=new Set(initial.customers.map(x=>x.phase).filter(Boolean));
          for(const p of expectedPhases) if(!phases.has(p)) throw new Error('missing lifecycle phase '+p);
          const actionStatuses=new Set();
          const depth=[];
          for(const c of initial.customers.filter(x=>x.defaultSample&&!x.isGoldenExample)){
            const st=await page.evaluate(id=>fetch('/api/state?customer='+encodeURIComponent(id)).then(r=>r.json()),c.id);
            const count=t=>st.records.filter(r=>r.type===t).length;
            const riskIssue=count('risk')+count('issue');
            st.records.filter(r=>r.type==='action').forEach(r=>actionStatuses.add(String(r.data?.status||'')));
            const row={name:c.name,stage:c.stage,phase:c.phase,stakeholders:count('stakeholder'),kpis:count('kpi'),actions:count('action'),riskIssue,meetings:count('meeting')};
            depth.push(row);
            if(row.stakeholders<3||row.kpis<3||row.actions<2||row.riskIssue<1||row.meetings<1) throw new Error('seed depth failed '+JSON.stringify(row));
          }
          if(actionStatuses.size<4) throw new Error('seed action status variety too low: '+[...actionStatuses].join(','));
          await page.evaluate(id=>fetch('/api/state?customer='+encodeURIComponent(id)).then(r=>r.json()),initial.customer.id);
          const types=new Set(initial.records.map(x=>x.type));
          for(const t of ['handoff','integration','kpi','adoption','risk','stakeholder','action','issue','meeting','call_prep','assistant_profile','raci']) if(!types.has(t)) throw new Error('missing record type '+t);
          if(initial.records.filter(x=>x.type==='kpi').length<5) throw new Error('KPI evidence set incomplete');
          if(!initial.records.some(x=>x.type==='kpi'&&x.data?.name==='Priority MCP governance coverage')) throw new Error('MCP KPI missing');
          const marker='NMA Browser Persistence '+Date.now();
          const created=await page.evaluate(async ({customerId,marker})=>{const r=await fetch('/api/records',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({customerId,type:'action',provenance:'internal_record',data:{title:marker,owner:'Customer Solutions',status:'Planned',audience:'Internal'}})});return {status:r.status,body:await r.json()}},{customerId:initial.customer.id,marker});
          if(created.status!==201||!created.body?.id) throw new Error('create failed');
          const recordId=created.body.id;
          await page.reload({waitUntil:'networkidle'});
          await page.locator('.nma-banner').waitFor({state:'visible'});
          const persisted=await page.evaluate(marker=>fetch('/api/state').then(r=>r.json()).then(s=>s.records.find(x=>x.data?.title===marker)||null),marker);
          if(!persisted||persisted.id!==recordId) throw new Error('localStorage persistence failed after reload');
          const patched=await page.evaluate(async id=>{const r=await fetch('/api/records/'+encodeURIComponent(id),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({data:{status:'Complete'}})});return {status:r.status,body:await r.json()}},recordId);
          if(patched.status!==200||patched.body?.data?.status!=='Complete') throw new Error('patch failed');
          const deleted=await page.evaluate(async id=>{const r=await fetch('/api/records/'+encodeURIComponent(id),{method:'DELETE'});return {status:r.status,body:await r.json()}},recordId);
          if(deleted.status!==200) throw new Error('delete failed');
          const gone=await page.evaluate(id=>fetch('/api/state').then(r=>r.json()).then(s=>s.records.some(x=>x.id===id)),recordId);
          if(gone) throw new Error('delete persistence failed');
          const localBytes=await page.evaluate(()=>new Blob([localStorage.getItem('nma.crm.local.v2')||'']).size);
          if(localBytes<2000) throw new Error('browser workspace unexpectedly small');
          await page.locator('#nma-present-btn').click();
          await page.locator('.nma-present').waitFor({state:'visible'});
          await page.waitForFunction(()=>document.querySelectorAll('.nma-slide').length>=8);
          const slides=await page.locator('.nma-slide').count();
          const presentationText=await page.locator('.nma-present').innerText();
          if(!presentationText.includes('Dispatched ≠ delivered ≠ executed ≠ verified.')) throw new Error('execution truth missing from presentation');
          await page.locator('#nma-close').click();
          const downloadPromise=page.waitForEvent('download');
          await page.locator('#nma-brief').click();
          const download=await downloadPromise;
          const path=await download.path();
          const bytes=fs.statSync(path).size;
          if(bytes<500) throw new Error('CISO brief PDF too small: '+bytes);
          if(!download.suggestedFilename().endsWith('.pdf')) throw new Error('CISO brief is not PDF');
          const mobile=await ctx.newPage();
          await mobile.setViewportSize({width:390,height:844});
          const mobileResponse=await mobile.goto('https://nma.clintware.com/',{waitUntil:'networkidle'});
          if(!mobileResponse?.ok()) throw new Error('mobile landing HTTP '+mobileResponse?.status());
          await mobile.evaluate(()=>sessionStorage.setItem('nmaTrackLaunched','1'));
          await mobile.reload({waitUntil:'networkidle'});
          const overflow=await mobile.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
          if(overflow) throw new Error('mobile horizontal overflow');
          if(errors.length||badResponses.length) throw new Error('browser faults: '+[...errors,...badResponses].join(' | '));
          console.log(JSON.stringify({ok:true,title,accounts:initial.customers.length,lifecyclePhases:[...phases],sampleDepth:depth,actionStatusVariety:[...actionStatuses],goldenRecords:initial.records.length,presentationSlides:slides,pdfBytes:bytes,browserLocalBytes:localBytes,databaseRowsPerDemoSession:0,mobileOverflow:false,errors:[],badResponses:[]},null,2));
          await browser.close();
          JS
          cd /tmp/nma-browser
          node verify.mjs

      - name: Verification summary
        run: |
          echo 'NMA_VERIFIED=source+role-logic+multi-stage-seed-depth+quota-independent-runtime+do-retirement+dry-run+deploy+live-http+browser-crud+browser-persistence+hosted-chrome+presentation+pdf+mobile'
