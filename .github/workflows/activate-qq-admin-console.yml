name: Activate qq Admin Console

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activate-qq-admin-console.yml"
      - "quillgeist-lite/runner.ps1"
      - "quillgeist-lite/launcher.ps1"
      - "quillgeist-lite/bootstrap.ps1"
      - "quillgeist-lite/install.ps1"
      - "quillgeist-lite/launch-visible.ps1"
      - "quillgeist-lite/tasks.json"
      - "quillgeist-lite/tasks/**"
      - "quillgeist-lite/tools/**"
      - "quillgeist-lite/service/**"
      - "quillgeist-lite/bootstrapper/**"
      - "quillgeist-lite/assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qq-runtime-rollout
  cancel-in-progress: true

# capability-based readiness: supervised admin console v6

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for reviewed qq Control Plane build
        run: |
          set -euo pipefail
          expected=$(python3 -c 'import re; t=open("control-plane/src/index.js",encoding="utf-8").read(); m=re.search(r"const QUILLGEIST_RUNTIME_VERSION = \"([^\"]+)\"",t); print(m.group(1) if m else (_ for _ in ()).throw(RuntimeError("runtime version marker missing")))')
          ready=0
          for i in $(seq 1 60); do
            health=$(curl -fsS --connect-timeout 5 --max-time 20 https://mcp.clintware.com/health || true)
            runtime=$(curl -fsS --connect-timeout 5 --max-time 20 https://mcp.clintware.com/api/v1/quillgeist-lite/runtime-version || true)
            if HEALTH="$health" RUNTIME="$runtime" EXPECTED="$expected" python3 -c 'import json,os,sys; h=json.loads(os.environ.get("HEALTH","{}")); r=json.loads(os.environ.get("RUNTIME","{}")); ok=(h.get("ok") is True and h.get("service")=="Clintware Control Plane" and "quillgeist-lite" in (h.get("products") or []) and r.get("runtime_version")==os.environ.get("EXPECTED")); sys.exit(0 if ok else 1)'
            then
              echo "CONTROL_PLANE_READY runtime=$expected"
              ready=1
              break
            fi
            echo "Waiting for reviewed qq runtime $expected ($i/60)"
            sleep 5
          done
          test "$ready" = "1"

      - name: Dispatch local qq admin-console upgrade
        if: github.event_name == 'workflow_dispatch'
        env:
          CONTROL_PLANE_MCP_TOKEN: ${{ secrets.CONTROL_PLANE_MCP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CONTROL_PLANE_MCP_TOKEN" ]; then
            echo "CONTROL_PLANE_MCP_TOKEN is not configured" >&2
            exit 1
          fi

          response=$(curl --fail-with-body -sS -X POST https://mcp.clintware.com/api/v1/quillgeist-lite/jobs -H "Authorization: Bearer $CONTROL_PLANE_MCP_TOKEN" -H "Content-Type: application/json" --data '{"task_id":"bootstrap-admin-console","args":{},"objective":"Ensure qq is a service-supervised interactive administrator console."}')

          echo "$response"
          echo "$response" | grep -Fq '"ok":true'
          job_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["job_id"])' <<< "$response")
          echo "JOB_ID=$job_id"

          final=""
          for i in $(seq 1 60); do
            state=$(curl --fail-with-body -sS "https://mcp.clintware.com/api/v1/quillgeist-lite/jobs/$job_id" -H "Authorization: Bearer $CONTROL_PLANE_MCP_TOKEN")
            echo "$state"
            status=$(python3 -c 'import json,sys; print((json.load(sys.stdin).get("job") or {}).get("status",""))' <<< "$state")
            if [ "$status" = "passed" ] || [ "$status" = "failed" ]; then
              final="$status"
              break
            fi
            sleep 5
          done

          if [ -z "$final" ]; then final="queued_or_running"; fi
          echo "QQ_LOCAL_JOB_STATUS=$final"
          echo "qq admin-service bootstrap dispatched for explicit manual activation."

      - name: Report qq local service diagnostics
        if: always()
        env:
          CONTROL_PLANE_MCP_TOKEN: ${{ secrets.CONTROL_PLANE_MCP_TOKEN }}
        run: |
          set +e
          curl -sS "https://mcp.clintware.com/api/v1/quillgeist-lite/diagnostics?limit=20" -H "Authorization: Bearer $CONTROL_PLANE_MCP_TOKEN"
          echo

      - name: Roll out reviewed qq runtime
        continue-on-error: true
        env:
          CONTROL_PLANE_MCP_TOKEN: ${{ secrets.CONTROL_PLANE_MCP_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X POST https://mcp.clintware.com/api/v1/quillgeist-lite/rollout \
            -H "Authorization: Bearer $CONTROL_PLANE_MCP_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"task_id":"self-update","args":{},"objective":"Refresh each registered qq device from the reviewed runtime; preserve active work and resume queued work after reconnect.","resume_after":true}')
          echo "$response"
          RESPONSE="$response" python3 -c 'import json,os,sys; d=json.loads(os.environ["RESPONSE"]); jobs=d.get("jobs") or []; [print("QQ_ROLLOUT",x.get("target_device"),x.get("job_id"),"queued" if x.get("ok") else x.get("error")) for x in jobs]; sys.exit(0 if d.get("ok") and any(x.get("ok") for x in jobs) else 1)'

      - name: Install and enable qq responder agent
        if: github.event_name == 'workflow_dispatch'
        env:
          CONTROL_PLANE_MCP_TOKEN: ${{ secrets.CONTROL_PLANE_MCP_TOKEN }}
        run: |
          set -euo pipefail

          dispatch_and_wait() {
            action="$1"
            response=""
            for i in $(seq 1 60); do
              response=$(curl -sS -X POST https://mcp.clintware.com/api/v1/quillgeist-lite/jobs \
                -H "Authorization: Bearer $CONTROL_PLANE_MCP_TOKEN" \
                -H "Content-Type: application/json" \
                --data "{\"task_id\":\"responder-agent\",\"args\":{\"Action\":\"$action\"},\"objective\":\"Install and enable the local policy-aware responder agent requested by the owner.\"}" || true)
              if echo "$response" | grep -Fq '"ok":true'; then break; fi
              echo "Waiting for responder-agent capability ($i/60)"
              sleep 5
            done
            echo "$response" | grep -Fq '"ok":true'
            job_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["job_id"])' <<< "$response")
            for i in $(seq 1 90); do
              state=$(curl --fail-with-body -sS "https://mcp.clintware.com/api/v1/quillgeist-lite/jobs/$job_id" -H "Authorization: Bearer $CONTROL_PLANE_MCP_TOKEN")
              status=$(python3 -c 'import json,sys; print((json.load(sys.stdin).get("job") or {}).get("status",""))' <<< "$state")
              if [ "$status" = "passed" ]; then echo "$state"; return 0; fi
              if [ "$status" = "failed" ]; then echo "$state"; return 1; fi
              sleep 4
            done
            echo "Timed out waiting for responder-agent $action" >&2
            return 1
          }

          dispatch_and_wait install
          dispatch_and_wait on
          echo "qq responder scheduled task installed and enabled."

      - name: Install and enable LandThePlane career signal agent
        if: github.event_name == 'workflow_dispatch'
        env:
          CONTROL_PLANE_MCP_TOKEN: ${{ secrets.CONTROL_PLANE_MCP_TOKEN }}
        run: |
          set -euo pipefail

          dispatch_and_wait() {
            action="$1"
            at="${2:-}"
            if [ -n "$at" ]; then
              args="{\"Action\":\"$action\",\"At\":\"$at\"}"
            else
              args="{\"Action\":\"$action\"}"
            fi
            response=""
            for i in $(seq 1 60); do
              response=$(curl -sS -X POST https://mcp.clintware.com/api/v1/quillgeist-lite/jobs \
                -H "Authorization: Bearer $CONTROL_PLANE_MCP_TOKEN" \
                -H "Content-Type: application/json" \
                --data "{\"task_id\":\"career-signal-agent\",\"args\":$args,\"objective\":\"Install and enable the LandThePlane daily hiring and YC career signal plan requested by the owner.\"}" || true)
              if echo "$response" | grep -Fq '"ok":true'; then break; fi
              echo "Waiting for career-signal-agent capability ($i/60)"
              sleep 5
            done
            echo "$response" | grep -Fq '"ok":true'
            job_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["job_id"])' <<< "$response")
            for i in $(seq 1 90); do
              state=$(curl --fail-with-body -sS "https://mcp.clintware.com/api/v1/quillgeist-lite/jobs/$job_id" -H "Authorization: Bearer $CONTROL_PLANE_MCP_TOKEN")
              status=$(python3 -c 'import json,sys; print((json.load(sys.stdin).get("job") or {}).get("status",""))' <<< "$state")
              if [ "$status" = "passed" ]; then echo "$state"; return 0; fi
              if [ "$status" = "failed" ]; then echo "$state"; return 1; fi
              sleep 4
            done
            echo "Timed out waiting for career-signal-agent $action" >&2
            return 1
          }

          dispatch_and_wait install 08:00
          dispatch_and_wait on
          dispatch_and_wait status
          echo "LandThePlane career signal agent installed, enabled, and scheduled for 08:00 local time."

      - name: Ensure qq local browser runtime
        if: github.event_name == 'workflow_dispatch'
        env:
          CONTROL_PLANE_MCP_TOKEN: ${{ secrets.CONTROL_PLANE_MCP_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X POST https://mcp.clintware.com/api/v1/quillgeist-lite/jobs             -H "Authorization: Bearer $CONTROL_PLANE_MCP_TOKEN"             -H "Content-Type: application/json"             --data '{"task_id":"browser-setup","args":{},"objective":"Ensure the isolated local Playwright browser runtime is installed and ready for qq browser work."}')
          echo "$response"
          job_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["job_id"])' <<< "$response")

          for i in $(seq 1 120); do
            state=$(curl --fail-with-body -sS "https://mcp.clintware.com/api/v1/quillgeist-lite/jobs/$job_id" -H "Authorization: Bearer $CONTROL_PLANE_MCP_TOKEN")
            status=$(python3 -c 'import json,sys; print((json.load(sys.stdin).get("job") or {}).get("status",""))' <<< "$state")
            if [ "$status" = "passed" ]; then
              echo "$state"
              echo "qq browser runtime is ready."
              break
            fi
            if [ "$status" = "failed" ]; then
              echo "$state"
              echo "qq browser runtime setup failed" >&2
              exit 1
            fi
            if [ "$i" = "120" ]; then
              echo "$state"
              echo "Timed out waiting for qq browser runtime setup" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Verify qq local browser operator
        if: github.event_name == 'workflow_dispatch'
        env:
          CONTROL_PLANE_MCP_TOKEN: ${{ secrets.CONTROL_PLANE_MCP_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X POST https://mcp.clintware.com/api/v1/quillgeist-lite/jobs             -H "Authorization: Bearer $CONTROL_PLANE_MCP_TOKEN"             -H "Content-Type: application/json"             --data '{"task_id":"browser-work","args":{"Action":"inspect","Url":"https://clintware.com/","Headless":"true","WaitMs":"300"},"objective":"Verify qq can launch its local browser, load a real page, and inspect interactive page controls."}')
          echo "$response"
          job_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["job_id"])' <<< "$response")

          for i in $(seq 1 60); do
            state=$(curl --fail-with-body -sS "https://mcp.clintware.com/api/v1/quillgeist-lite/jobs/$job_id" -H "Authorization: Bearer $CONTROL_PLANE_MCP_TOKEN")
            status=$(python3 -c 'import json,sys; print((json.load(sys.stdin).get("job") or {}).get("status",""))' <<< "$state")
            if [ "$status" = "passed" ]; then
              echo "$state"
              echo "qq local browser operator verified."
              exit 0
            fi
            if [ "$status" = "failed" ]; then
              echo "$state"
              echo "qq local browser operator verification failed" >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for qq browser verification" >&2
          exit 1
