name: Repair Quillgeist Static Pairing Guidance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/quillgeist-static-copy-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace stale generic pairing command
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('agentbridge-cloud/public/index.html'): [
                  (
                      'Run <code>quillgeist pair</code> locally, then enter the short code shown by the Node.',
                      'Run the downloaded Quillgeist executable with <code>pair</code>, then enter the short code shown by the Node.'
                  )
              ],
              Path('agentbridge-cloud/public/app.js'): [
                  (
                      'No Node paired yet. Run <code>quillgeist pair</code> on a machine, then enter its code here.',
                      'No Node paired yet. Run the downloaded Quillgeist executable with <code>pair</code>, then enter its code here.'
                  )
              ]
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one stale pairing string, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Validate static assets
        run: |
          node --check agentbridge-cloud/public/app.js
          grep -Fq 'Run the downloaded Quillgeist executable with <code>pair</code>, then enter the short code shown by the Node.' agentbridge-cloud/public/index.html
          grep -Fq 'Run the downloaded Quillgeist executable with <code>pair</code>, then enter its code here.' agentbridge-cloud/public/app.js
          if grep -Fq 'quillgeist pair' agentbridge-cloud/public/index.html agentbridge-cloud/public/app.js; then
            echo 'Stale generic pairing command remains.' >&2
            exit 1
          fi
      - name: Commit repaired static assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agentbridge-cloud/public/index.html agentbridge-cloud/public/app.js
          git commit -m "Fix Quillgeist static pairing guidance"
          git push
