name: Diagnose ZSC browser runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-zsc-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect patched bundled inline script identifiers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          root=Path('zscaler/src')
          parts=[]
          for p in sorted(root.glob('app-part*.js')):
              m=re.search(r'"([A-Za-z0-9+/=]+)"',p.read_text()); assert m,p
              parts.append(m.group(1))
          html=gzip.decompress(base64.b64decode(''.join(parts))).decode()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          print('inline script count',len(scripts))
          for i,s in enumerate(scripts):
              print('SCRIPT',i,'length',len(s),'top-call occurrences',len(re.findall(r'\btop\s*\(',s)),'renderTopBar occurrences',len(re.findall(r'\brenderTopBar\s*\(',s)))
          PY
      - name: Inspect browser error stacks and app DOM after current deployment
        run: |
          set -euo pipefail
          mkdir -p /tmp/zdiag && cd /tmp/zdiag
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core >/dev/null 2>&1
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          cat > diag.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
          for (const host of ['zsc.clintware.com','zc.clintware.com']) {
            const page = await browser.newPage();
            const errors=[]; const consoleErrors=[];
            page.on('pageerror', e => errors.push({message:String(e),stack:e.stack||''}));
            page.on('console', m => {if(m.type()==='error')consoleErrors.push(m.text())});
            await page.goto(`https://${host}/`, {waitUntil:'domcontentloaded',timeout:30000});
            console.log(`HOST ${host}`);
            console.log('PAGE_ERRORS',JSON.stringify(errors));
            console.log('CONSOLE_ERRORS',JSON.stringify(consoleErrors));
            console.log('APP_HTML_LENGTH',((await page.locator('#app').innerHTML())||'').length);
            console.log('APP_TEXT_SAMPLE',JSON.stringify(((await page.locator('#app').textContent())||'').slice(0,500)));
            const scripts=await page.evaluate(()=>[...document.scripts].map((s,i)=>({i,src:s.src||'',id:s.id||'',len:(s.textContent||'').length,topCalls:(s.textContent||'').match(/\btop\s*\(/g)?.length||0,renderTopBar:(s.textContent||'').match(/\brenderTopBar\s*\(/g)?.length||0})));
            console.log('SCRIPTS',JSON.stringify(scripts));
            await page.close();
          }
          await browser.close();
          NODE
          CHROME="$chrome" node diag.mjs
