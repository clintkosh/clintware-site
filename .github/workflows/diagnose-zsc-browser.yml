name: Diagnose ZSC browser runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-zsc-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect bundled inline scripts for top identifier
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          root=Path('zscaler/src')
          parts=[]
          for p in sorted(root.glob('app-part*.js')):
              m=re.search(r'"([A-Za-z0-9+/=]+)"',p.read_text()); assert m,p
              parts.append(m.group(1))
          html=gzip.decompress(base64.b64decode(''.join(parts))).decode()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          print('inline script count',len(scripts))
          for i,s in enumerate(scripts):
              occ=list(re.finditer(r'\btop\b',s))
              print('SCRIPT',i,'length',len(s),'top occurrences',len(occ))
              for m in occ[:20]:
                  print('TOP',i,'AT',m.start(),repr(s[max(0,m.start()-220):m.start()+420]))
          PY
      - name: Inspect browser error stacks and script metadata
        run: |
          set -euo pipefail
          mkdir -p /tmp/zdiag && cd /tmp/zdiag
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core >/dev/null 2>&1
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          cat > diag.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
          for (const host of ['zsc.clintware.com','zc.clintware.com']) {
            const page = await browser.newPage();
            const errors=[];
            page.on('pageerror', e => errors.push({message:String(e),stack:e.stack||''}));
            await page.goto(`https://${host}/`, {waitUntil:'domcontentloaded',timeout:30000});
            console.log(`HOST ${host}`);
            console.log('PAGE_ERRORS',JSON.stringify(errors));
            const scripts=await page.evaluate(()=>[...document.scripts].map((s,i)=>({i,src:s.src||'',id:s.id||'',len:(s.textContent||'').length,top:(s.textContent||'').match(/\btop\b/g)?.length||0,sample:(s.textContent||'').slice(0,180)})));
            console.log('SCRIPTS',JSON.stringify(scripts));
            await page.close();
          }
          await browser.close();
          NODE
          CHROME="$chrome" node diag.mjs
