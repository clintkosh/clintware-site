name: Diagnose ZSC browser runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-zsc-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect bundled source around browser-global declarations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          root=Path('zscaler/src')
          parts=[]
          for p in sorted(root.glob('app-part*.js')):
              m=re.search(r'"([A-Za-z0-9+/=]+)"',p.read_text())
              assert m,p
              parts.append(m.group(1))
          html=gzip.decompress(base64.b64decode(''.join(parts))).decode()
          for pat in [r'\bconst\s+top\b',r'\blet\s+top\b',r'\bvar\s+top\b']:
              for m in re.finditer(pat,html):
                  print('MATCH',pat,'AT',m.start())
                  print(html[max(0,m.start()-500):m.start()+1200])
                  print('---')
          print('total literal top declarations',len(re.findall(r'\b(?:const|let|var)\s+top\b',html)))
          PY
      - name: Inspect browser errors and app DOM after DTEX unlock
        run: |
          set -euo pipefail
          mkdir -p /tmp/zdiag && cd /tmp/zdiag
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core >/dev/null 2>&1
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          cat > diag.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
          for (const host of ['zsc.clintware.com','zc.clintware.com']) {
            const page = await browser.newPage();
            const errors=[]; const consoleErrors=[];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', m => { if (m.type()==='error') consoleErrors.push(m.text()); });
            await page.goto(`https://${host}/`, {waitUntil:'domcontentloaded',timeout:30000});
            console.log(`HOST ${host}`);
            console.log('page errors', JSON.stringify(errors));
            console.log('console errors', JSON.stringify(consoleErrors));
            console.log('app text length', ((await page.locator('#app').textContent())||'').length);
            await page.close();
          }
          await browser.close();
          NODE
          CHROME="$chrome" node diag.mjs
