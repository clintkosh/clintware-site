name: Patch ZSC browser-global collision

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-zsc-app-global.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename ZSC top() function inside compressed app bundle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, gzip, math

          root=Path('zscaler/src')
          parts=[]
          for i in range(1,6):
              p=root/f'app-part{i}.js'
              text=p.read_text()
              m=re.search(r'"([A-Za-z0-9+/=]+)"', text)
              assert m, p
              parts.append(m.group(1))

          html=gzip.decompress(base64.b64decode(''.join(parts))).decode()
          before=list(re.finditer(r'\btop\s*\(', html))
          print('top(...) occurrences before patch:', len(before))
          for m in before:
              print(repr(html[max(0,m.start()-100):m.start()+180]))

          assert 'function top(){' in html, 'expected global function top() not found'
          patched, count=re.subn(r'\btop\s*\(', 'renderTopBar(', html)
          print('renamed top(...) occurrences:', count)
          assert count >= 2, f'expected function definition plus at least one call, got {count}'
          assert 'function top(){' not in patched
          assert 'function renderTopBar(){' in patched
          assert not re.search(r'\btop\s*\(', patched)
          assert 'Command Center' in patched and 'Seed Demo Accounts' in patched

          encoded=base64.b64encode(gzip.compress(patched.encode(), compresslevel=9, mtime=0)).decode()
          size=math.ceil(len(encoded)/5)
          chunks=[encoded[i*size:(i+1)*size] for i in range(5)]
          assert ''.join(chunks)==encoded and all(chunks)
          for i,chunk in enumerate(chunks,1):
              (root/f'app-part{i}.js').write_text(f'export const PART_{i} = "{chunk}";\n')
          print('new compressed base64 length:', len(encoded), 'chunk lengths:', [len(x) for x in chunks])
          PY

          python3 zscaler/tests/smoke.mjs 2>/dev/null || node zscaler/tests/smoke.mjs
          python3 zscaler/tests/regression.py
      - name: Commit patched bundle
        run: |
          set -euo pipefail
          if git diff --quiet -- zscaler/src/app-part1.js zscaler/src/app-part2.js zscaler/src/app-part3.js zscaler/src/app-part4.js zscaler/src/app-part5.js; then
            echo "No bundle changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zscaler/src/app-part1.js zscaler/src/app-part2.js zscaler/src/app-part3.js zscaler/src/app-part4.js zscaler/src/app-part5.js
          git commit -m "Fix ZSC browser top global collision"
          git push origin HEAD:main
