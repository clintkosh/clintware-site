name: Bootstrap or Break-glass Shared CRM Factory
on:
  push:
    branches: [main]
    paths:
      - "projects/crm-cover-factory/shared-runtime/**"
      - "projects/crm-cover-factory/tenants/**"
      - "projects/crm-cover-factory/ingest-job-scan.py"
      - ".github/workflows/deploy-shared-crm-factory.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clintware-shared-crm-factory
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[crm-factory-deploy]')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python3 projects/crm-cover-factory/shared-runtime/build.py
      - run: node --check .build/crm-factory/public/app.js
      - working-directory: .build/crm-factory
        run: npx --yes wrangler@4 deploy --dry-run
      - working-directory: .build/crm-factory
        run: npx --yes wrangler@4 deploy
      - run: |
          for i in $(seq 1 24); do
            h=$(curl -fsS --max-time 15 https://crm.clintware.com/health.json || true)
            if echo "$h" | grep -Fq '"service":"clintware-crm-factory"'; then echo "$h"; exit 0; fi
            sleep 5
          done
          exit 1
