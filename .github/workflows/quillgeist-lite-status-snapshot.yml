name: Quillgeist Lite Status Snapshot

on:
  push:
    branches: [main]
    paths:
      - "quillgeist-lite/status-request.json"
      - ".github/workflows/quillgeist-lite-status-snapshot.yml"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONTROL_PLANE: https://mcp.clintware.com
      CONTROL_PLANE_MCP_TOKEN: ${{ secrets.CONTROL_PLANE_MCP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Query live qq status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          # This workflow is event-driven, but it can start while a new Control Plane
          # deployment is still converging. Use a bounded readiness retry instead of
          # converting health collection into a recurring poller.
          qq_fetch() {
            local accept="$1"
            local url="$2"
            local out="$3"
            curl --fail --silent --show-error \
              --retry 20 --retry-delay 5 --retry-max-time 110 --retry-all-errors \
              -H "Authorization: Bearer $CONTROL_PLANE_MCP_TOKEN" \
              -H "Accept: $accept" \
              "$url" -o "$out"
          }
          qq_fetch "application/json" "$CONTROL_PLANE/health" /tmp/health.json
          qq_fetch "application/json" "$CONTROL_PLANE/api/v1/quillgeist-lite/status" /tmp/status.json
          # Diagnostics are historical enrichment. A storage-quota incident must not
          # make current liveness unreportable once /status has returned its live-only
          # fallback.
          if ! curl --fail --silent --show-error \
            -H "Authorization: Bearer $CONTROL_PLANE_MCP_TOKEN" \
            -H "Accept: application/json" \
            "$CONTROL_PLANE/api/v1/quillgeist-lite/diagnostics?limit=100" -o /tmp/diag.json; then
            printf '%s\n' '{"ok":false,"degraded":true,"diagnostics":[],"reason":"durable_diagnostics_unavailable"}' > /tmp/diag.json
          fi
          qq_fetch "application/json" "$CONTROL_PLANE/api/v1/quillgeist-lite/runtime/tasks.json" /tmp/tasks.json
          qq_fetch "text/plain" "$CONTROL_PLANE/api/v1/quillgeist-lite/runtime/tasks/repair-codex-org-identity.ps1" /tmp/codex-task.ps1
          qq_fetch "text/plain" "$CONTROL_PLANE/api/v1/quillgeist-lite/runtime/service/QuillgeistLiteHealthService.cs" /tmp/qq-health.cs
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.error, urllib.request
          from datetime import datetime, timezone
          with open("/tmp/health.json",encoding="utf-8") as f: health=json.load(f)
          with open("/tmp/status.json",encoding="utf-8") as f: status=json.load(f)
          with open("/tmp/diag.json",encoding="utf-8") as f: diag=json.load(f)
          with open("/tmp/tasks.json",encoding="utf-8") as f: tasks=json.load(f)
          with open("/tmp/codex-task.ps1","rb") as f: codex_bytes=f.read()
          codex_text=codex_bytes.decode("utf-8","replace")
          with open("/tmp/qq-health.cs","rb") as f: health_bytes=f.read()
          health_text=health_bytes.decode("utf-8","replace")
          job_details={}
          token=os.environ.get("CONTROL_PLANE_MCP_TOKEN","")
          base=os.environ.get("CONTROL_PLANE","").rstrip("/")
          for row in (status.get("jobs") or [])[:40]:
            if row.get("task_id") not in {"finish-local-ai","repair-codex-org-identity","self-update","repair-local-service","share-ai-network","clintware-doctor"}:
              continue
            if row.get("target_device") not in {"MEMORIA","DRIZNET"}:
              continue
            jid=str(row.get("job_id") or "")
            if not jid or jid in job_details:
              continue
            try:
              req=urllib.request.Request(
                f"{base}/api/v1/quillgeist-lite/jobs/{jid}",
                headers={"Authorization":f"Bearer {token}","Accept":"application/json","User-Agent":"clintware-qq-status/1.0"}
              )
              with urllib.request.urlopen(req,timeout=15) as resp:
                detail=json.load(resp)
              job=detail.get("job") or detail
              result=job.get("result") or {}
              output=str(result.get("output") or "")
              job_details[jid]={
                "task_id":job.get("task_id"),
                "target_device":job.get("target_device"),
                "status":job.get("status"),
                "created_at":job.get("created_at"),
                "updated_at":job.get("updated_at"),
                "completed_at":job.get("completed_at"),
                "exit_code":result.get("exit_code"),
                "duration_ms":result.get("duration_ms"),
                "output_tail":output[-8000:],
                "recent_logs":(job.get("logs") or [])[-20:]
              }
            except Exception as exc:
              job_details[jid]={"error":str(exc)[:500]}

          try:
            with open("quillgeist-lite/status-request.json",encoding="utf-8") as f:
              control_request=json.load(f)
          except Exception:
            control_request={}
          requested_action=str(control_request.get("action") or "status").strip().lower()
          if requested_action not in {"status","restart_runner"}:
            requested_action="status"
          requested_target=str(control_request.get("target_device") or "").strip()
          requested_force=bool(control_request.get("force") is True)

          checkin_results={}
          for device in (status.get("service_devices") or []):
            device_id=str(device.get("device_id") or "").strip()
            if not device_id:
              continue
            action=requested_action if (requested_target and device_id.lower()==requested_target.lower()) else "status"
            force=requested_force if action=="restart_runner" else False
            request_id=action.replace("_","-")+"-"+device_id.lower()+"-"+datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S")
            payload=json.dumps({"request_id":request_id,"target_device":device_id,"action":action,"force":force}).encode("utf-8")
            try:
              req=urllib.request.Request(
                f"{base}/api/v1/quillgeist-lite/check-in",
                data=payload,
                method="POST",
                headers={"Authorization":f"Bearer {token}","Accept":"application/json","Content-Type":"application/json","User-Agent":"clintware-qq-status/1.0"}
              )
              try:
                with urllib.request.urlopen(req,timeout=15) as resp:
                  created=json.load(resp)
              except urllib.error.HTTPError as exc:
                created=json.loads(exc.read().decode("utf-8","replace") or "{}")
              checkin_results[device_id]={"request":created}
              if int(created.get("delivered") or 0)>0:
                for _ in range(30):
                  time.sleep(0.25)
                  read_req=urllib.request.Request(
                    f"{base}/api/v1/quillgeist-lite/check-in/{request_id}",
                    headers={"Authorization":f"Bearer {token}","Accept":"application/json","User-Agent":"clintware-qq-status/1.0"}
                  )
                  with urllib.request.urlopen(read_req,timeout=10) as read_resp:
                    current=json.load(read_resp)
                  checkin_results[device_id]["result"]=current
                  if ((current.get("checkin") or {}).get("status")=="replied"):
                    break
            except Exception as exc:
              checkin_results[device_id]={"error":str(exc)[:500]}

          out={
            "checked_at":datetime.now(timezone.utc).isoformat(),
            "control_plane_health":health,
            "status":status,
            "diagnostics":diag,
            "job_details":job_details,
            "live_checkins":checkin_results,
            "runtime_registry":{"version":tasks.get("version"),"task_ids":sorted((tasks.get("tasks") or {}).keys())},
            "runtime_probe":{
              "repair_codex_org_identity_sha256":hashlib.sha256(codex_bytes).hexdigest(),
              "repair_codex_org_identity_header":codex_text.splitlines()[:30],
              "contains_invalid_home_guard":"codexHomeValid" in codex_text,
              "contains_memoria_header":"MEMORIA CODEX / ORG IDENTITY REPAIR" in codex_text,
              "health_service_sha256":hashlib.sha256(health_bytes).hexdigest(),
              "health_preserves_busy_jobs":"wake_deferred_runner_busy" in health_text and "FreshBusyHeartbeatActive" in health_text,
              "health_supports_checkin":"checkin_reply" in health_text and "deferred_busy" in health_text
            }
          }
          with open("ops/quillgeist-lite-live-status.json","w",encoding="utf-8") as f:
              json.dump(out,f,indent=2); f.write("\n")
          PY
      - name: Publish snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/quillgeist-lite-live-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record live Quillgeist Lite status"
            git pull --rebase origin main
            git push
          fi
