name: Install Toast Images

on:
  push:
    branches: [main]
    paths:
      - "toast-image-payloads-v3/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode higher-quality Toast images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toast-worker/assets
          cat toast-image-payloads-v3/IMG_8659.part* | base64 --decode > toast-worker/assets/IMG_8659.jpg
          cat toast-image-payloads-v3/IMG_8621.part* | base64 --decode > toast-worker/assets/IMG_8621.jpg
          cat toast-image-payloads-v2/IMG_8384.part* | base64 --decode > toast-worker/assets/IMG_8384.jpg
          test -s toast-worker/assets/IMG_8659.jpg
          test -s toast-worker/assets/IMG_8621.jpg
          test -s toast-worker/assets/IMG_8384.jpg
          file toast-worker/assets/IMG_8659.jpg | grep -qi jpeg
          file toast-worker/assets/IMG_8621.jpg | grep -qi jpeg
          file toast-worker/assets/IMG_8384.jpg | grep -qi jpeg
          rm -rf toast-image-payloads-v3 toast-image-payloads-v2 toast-image-payloads
      - name: Commit installed images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Toast thumbnails with higher-quality photos"
          git push
