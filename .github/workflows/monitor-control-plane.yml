name: Monitor Clintware Control Plane

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "control-plane/**"
      - ".github/workflows/monitor-control-plane.yml"

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: monitor-clintware-control-plane
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      MCP_URL: https://mcp.clintware.com/mcp
      HEALTH_URL: https://mcp.clintware.com/health
      MCP_TOKEN: ${{ secrets.CONTROL_PLANE_MCP_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Probe Control Plane, MCP auth, and GitHub adapter
        id: probe
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          failures=0

          echo "=== HEALTH ==="
          health_body=$(mktemp)
          health_code=$(curl -sS --max-time 20 -o "$health_body" -w '%{http_code}' "$HEALTH_URL" || true)
          echo "health_http=$health_code"
          cat "$health_body" || true
          echo

          if [[ "$health_code" != "200" ]]; then
            echo "::error::Health endpoint returned HTTP $health_code"
            failures=$((failures+1))
          else
            health=$(cat "$health_body")
            python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") is True; assert d.get("service")=="Clintware Control Plane"; a=d.get("adapters") or {}; [(_ for _ in ()).throw(AssertionError((k,a))) for k in ("github_write","github_actions","cloudflare_dns","mcp_auth") if a.get(k) is not True]; print("HEALTH_CONTRACT_OK=true")' "$health" || failures=$((failures+1))
          fi

          echo "=== UNAUTHENTICATED MCP GATE ==="
          unauth_code=$(curl -sS --max-time 20 -o /tmp/mcp-unauth.out -w '%{http_code}' \
            -X POST "$MCP_URL" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"clintware-monitor","version":"1.0"}}}' || true)
          echo "unauth_mcp_http=$unauth_code"
          if [[ "$unauth_code" != "401" ]]; then
            echo "::error::Unauthenticated MCP request should be rejected with 401, got $unauth_code"
            failures=$((failures+1))
          fi

          echo "=== AUTHENTICATED MCP ==="
          if [[ -z "${MCP_TOKEN:-}" ]]; then
            echo "::error::CONTROL_PLANE_MCP_TOKEN repository secret is missing"
            failures=$((failures+1))
          else
            auth_body=$(mktemp)
            auth_headers=$(mktemp)
            auth_code=$(curl -sS --max-time 30 -D "$auth_headers" -o "$auth_body" -w '%{http_code}' \
              -X POST "$MCP_URL" \
              -H "Authorization: Bearer ${MCP_TOKEN}" \
              -H 'content-type: application/json' \
              -H 'accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":2,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"clintware-monitor","version":"1.0"}}}' || true)
            echo "auth_mcp_http=$auth_code"
            head -c 1200 "$auth_body" || true
            echo

            if [[ ! "$auth_code" =~ ^2 ]]; then
              echo "::error::Authenticated MCP initialize failed with HTTP $auth_code"
              failures=$((failures+1))
            elif ! grep -Eq 'protocolVersion|jsonrpc|event:' "$auth_body"; then
              echo "::error::Authenticated MCP response did not look like MCP"
              failures=$((failures+1))
            else
              echo "MCP_AUTH_OK=true"
            fi

            echo "=== GITHUB ADAPTER E2E ==="
            gh_body=$(mktemp)
            gh_code=$(curl -sS --max-time 30 -o "$gh_body" -w '%{http_code}' \
              -X POST "$MCP_URL" \
              -H "Authorization: Bearer ${MCP_TOKEN}" \
              -H 'content-type: application/json' \
              -H 'accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"clintware_repo_read_file","arguments":{"product":"proofos","path":"control-plane/README.md","ref":"main"}}}' || true)
            echo "github_adapter_http=$gh_code"
            head -c 1600 "$gh_body" || true
            echo

            if [[ ! "$gh_code" =~ ^2 ]]; then
              echo "::error::GitHub adapter MCP call failed with HTTP $gh_code"
              failures=$((failures+1))
            elif grep -Eq 'github_read_failed|Bad credentials|\"status\":401|isError\":true' "$gh_body"; then
              echo "::error::GitHub adapter is configured but not operational"
              failures=$((failures+1))
            elif ! grep -Fq 'control-plane/README.md' "$gh_body"; then
              echo "::error::GitHub adapter response did not contain the expected repository file"
              failures=$((failures+1))
            else
              echo "GITHUB_ADAPTER_E2E_OK=true"
            fi
          fi

          rm -f "$health_body" "${auth_body:-}" "${auth_headers:-}" "${gh_body:-}" /tmp/mcp-unauth.out 2>/dev/null || true

          if [[ "$failures" -eq 0 ]]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "healthy=false" >> "$GITHUB_OUTPUT"
          echo "probe_failures=$failures"
          exit 1

      - name: Automatic recovery - redeploy Control Plane
        if: steps.probe.outputs.healthy != 'true'
        id: redeploy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "Probe failed. Dispatching deploy-control-plane.yml."
          gh workflow run deploy-control-plane.yml --repo "$GITHUB_REPOSITORY" --ref main
          sleep 8
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-control-plane.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "recovery_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Recovery deployment run: $run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Recheck after automatic recovery
        id: recovery
        if: steps.probe.outputs.healthy != 'true'
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          sleep 5

          health_code=$(curl -sS --max-time 20 -o /tmp/recovery-health -w '%{http_code}' "$HEALTH_URL" || true)
          auth_code=$(curl -sS --max-time 30 -o /tmp/recovery-auth -w '%{http_code}' \
            -X POST "$MCP_URL" \
            -H "Authorization: Bearer ${MCP_TOKEN}" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":4,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"clintware-monitor-recovery","version":"1.0"}}}' || true)
          gh_code=$(curl -sS --max-time 30 -o /tmp/recovery-gh -w '%{http_code}' \
            -X POST "$MCP_URL" \
            -H "Authorization: Bearer ${MCP_TOKEN}" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"clintware_repo_read_file","arguments":{"product":"proofos","path":"control-plane/README.md","ref":"main"}}}' || true)

          echo "post_recovery_health_http=$health_code"
          echo "post_recovery_mcp_http=$auth_code"
          echo "post_recovery_github_adapter_http=$gh_code"
          cat /tmp/recovery-health || true
          echo
          head -c 1200 /tmp/recovery-auth || true
          echo
          head -c 1600 /tmp/recovery-gh || true
          echo

          if [[ "$health_code" == "200" && "$auth_code" =~ ^2 && "$gh_code" =~ ^2 ]] \
             && grep -Eq 'protocolVersion|jsonrpc|event:' /tmp/recovery-auth \
             && grep -Fq 'control-plane/README.md' /tmp/recovery-gh \
             && ! grep -Eq 'github_read_failed|Bad credentials|\"status\":401|isError\":true' /tmp/recovery-gh; then
            echo "recovered=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "recovered=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Open incident issue if recovery failed
        if: steps.probe.outputs.healthy != 'true' && steps.recovery.outputs.recovered != 'true'
        shell: bash
        run: |
          set -euo pipefail
          title='Control Plane monitor: automatic recovery failed'
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          body="Automated monitoring detected that mcp.clintware.com failed its end-to-end health/auth/GitHub-adapter contract and automatic redeploy did not restore it.\n\nMonitor run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n\nNo credential values are written to this issue."
          if [[ -z "$existing" ]]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
          exit 1

      - name: Close prior monitor incident after health is restored
        if: steps.probe.outputs.healthy == 'true' || steps.recovery.outputs.recovered == 'true'
        shell: bash
        run: |
          set -euo pipefail
          title='Control Plane monitor: automatic recovery failed'
          while read -r issue; do
            [[ -z "$issue" ]] && continue
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Automated monitor confirms the Control Plane and GitHub adapter are healthy again. Closing incident."
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed
          done < <(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[].number')

      - name: Final status
        if: always()
        run: |
          echo "Monitor run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "Checks: health contract, unauthenticated 401 gate, authenticated MCP initialize, live GitHub adapter repository read."
          echo "Auto-response: redeploy on failure, recheck end to end, create incident only if still broken, close incident after recovery."
