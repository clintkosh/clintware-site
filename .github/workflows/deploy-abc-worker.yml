name: Deploy ZS DTEX Customer Success Demo

on:
  push:
    branches: [main]
    paths:
      - "abc/**"
      - ".github/workflows/deploy-abc-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zs-dtex-customer-success-demo
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker and app bundle
        run: |
          node --check src/index.js
          node --check src/app.js
          node tests/smoke.mjs
          python3 tests/regression.py
      - name: Exercise exact DTEX client login gate
        run: node tests/auth-roundtrip.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy moved DTEX demo Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd abc

      - name: Remove existing zs.clintware.com binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=zs.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          domain_ids=$(python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; rows=d.get("result",[]); assert all(x.get("hostname")=="zs.clintware.com" for x in rows),rows; print("\n".join(str(x["id"]) for x in rows if x.get("service")!="abc-cs-business-operations"))' <<< "$response")
          if [ -n "$domain_ids" ]; then
            while IFS= read -r domain_id; do
              deleted=$(curl --fail-with-body -sS -X DELETE \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains/${domain_id}" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
              python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d' <<< "$deleted"
            done <<< "$domain_ids"
          fi

      - name: Attach zs.clintware.com to moved ABC Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"hostname":"zs.clintware.com","service":"abc-cs-business-operations"}')
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; assert d["result"]["hostname"]=="zs.clintware.com",d' <<< "$response"

      - name: Verify zs custom-domain binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=zs.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True and len(r)==1,d; x=r[0]; assert x.get("hostname")=="zs.clintware.com" and x.get("service")=="abc-cs-business-operations",x' <<< "$response"

      - name: Wait for moved DTEX gate runtime
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 30); do
            body=$(curl -sS --connect-timeout 5 --max-time 20 "https://zs.clintware.com/" || true)
            health=$(curl -sS --connect-timeout 5 --max-time 20 "https://zs.clintware.com/health" || true)
            auth=$(curl -sS --connect-timeout 5 --max-time 20 "https://zs.clintware.com/health/auth" || true)
            if grep -Fq "Know what needs attention." <<< "$body" \
              && grep -Fq "Private Customer Success Demo" <<< "$body" \
              && grep -Fq "Unlock demo" <<< "$body" \
              && grep -Fq "Command Center" <<< "$body" \
              && grep -Fq "Seed Demo Accounts" <<< "$body" \
              && grep -Fq '"ok":true' <<< "$health" \
              && grep -Fq '"ok":true' <<< "$auth" \
              && grep -Fq '"mode":"dtex-client-gate"' <<< "$auth"; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"
          post_code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "https://zs.clintware.com/login")
          test "$post_code" = "405"

      - name: Exercise password and app in real Chrome at zs
        run: |
          set -euo pipefail
          mkdir -p /tmp/zs-playwright
          cd /tmp/zs-playwright
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core >/dev/null 2>&1
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          cat > test.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME, args:['--no-sandbox','--disable-dev-shm-usage']});
          const page = await browser.newPage();
          await page.goto('https://zs.clintware.com/?e2e='+Date.now(), {waitUntil:'domcontentloaded', timeout:30000});
          await page.fill('#pw','wrong-password');
          await page.click('#access-form button[type="submit"]');
          if ((await page.textContent('#gate-error')) !== 'Incorrect password.') throw new Error('wrong-password behavior failed');
          await page.fill('#pw','2$C@L3RK0S$H2026');
          await page.click('#access-form button[type="submit"]');
          await page.waitForFunction(() => document.body.classList.contains('unlocked'));
          const appText = (await page.locator('#app').textContent()) || '';
          if (!appText.includes('Command Center') || !appText.includes('Accounts')) throw new Error('unlocked app content missing');

          // Exercise every editable account workspace against the deployed app.
          await page.click('[data-route="accounts"]');
          await page.locator('[data-open]').first().click();
          const accountId = await page.evaluate(() => JSON.parse(localStorage.getItem('zs_ops_dtex_model_v2')).accounts[0].id);

          await page.click('[data-edit-account]');
          await page.fill('#f-summary','Production E2E account summary');
          await page.click('#save-account');

          await page.click('[data-tab="stakeholders"]');
          await page.locator('[data-edit-contact]').first().click();
          await page.fill('#c-name','Production E2E Stakeholder');
          await page.click('#save-contact');

          await page.click('[data-tab="success"]');
          await page.locator('[data-edit-success]').first().click();
          await page.fill('#s-objective','Production E2E customer outcome');
          await page.fill('#s-progress','77');
          await page.click('#save-success');

          await page.click('[data-tab="technical"]');
          await page.click('[data-edit-technical]');
          await page.fill('#t-owner','Production E2E Technical Owner');
          await page.fill('#t-coverage','91');
          await page.fill('#t-modules','Core, Analytics, E2E Module');
          await page.click('#save-technical');

          await page.click('[data-tab="meetings"]');
          await page.locator('[data-edit-meeting]').first().click();
          await page.fill('#m-title','Production E2E Meeting');
          await page.fill('#m-notes','Production E2E meeting notes persisted.');
          await page.click('#save-meeting');

          await page.click('[data-tab="notes"]');
          await page.locator('[data-edit-note]').first().click();
          await page.fill('#n-text','Production E2E account note persisted.');
          await page.click('#save-note');

          await page.click('[data-tab="commercial"]');
          await page.click('[data-edit-commercial]');
          await page.fill('#co-ae','Production E2E Account Executive');
          await page.fill('#co-value','86');
          await page.fill('#co-stakeholder','87');
          await page.fill('#co-ready','88');
          await page.click('#save-commercial');

          await page.click('[data-tab="summary"]');
          await page.click('[data-add-risk]');
          await page.fill('#r-title','Production E2E Risk');
          await page.fill('#r-owner','Production E2E Risk Owner');
          await page.click('#save-risk');
          await page.locator('[data-edit-risk]').last().click();
          await page.fill('#r-status','Mitigating');
          await page.click('#save-risk');

          const stored = await page.evaluate(id => JSON.parse(localStorage.getItem('zs_ops_dtex_model_v2')).accounts.find(a => a.id === id), accountId);
          if (stored.summary !== 'Production E2E account summary') throw new Error('account edit did not persist');
          if (stored.contacts[0].name !== 'Production E2E Stakeholder') throw new Error('stakeholder edit did not persist');
          if (stored.successPlans[0].objective !== 'Production E2E customer outcome' || stored.successPlans[0].progress !== 77) throw new Error('success-plan edit did not persist');
          if (stored.serviceOwner !== 'Production E2E Technical Owner' || stored.technicalCoverage !== 91 || !stored.activeModules.includes('E2E Module')) throw new Error('technical edit did not persist');
          if (stored.meetings[0].title !== 'Production E2E Meeting') throw new Error('meeting edit did not persist');
          if (stored.notes[0].text !== 'Production E2E account note persisted.') throw new Error('note edit did not persist');
          if (stored.accountExec !== 'Production E2E Account Executive' || stored.commercialReadiness !== 88) throw new Error('commercial edit did not persist');
          if (!stored.risks.some(r => r.title === 'Production E2E Risk' && r.status === 'Mitigating')) throw new Error('risk add/edit did not persist');

          await page.reload({waitUntil:'domcontentloaded'});
          await page.waitForFunction(() => document.body.classList.contains('unlocked'));
          await page.click('[data-route="accounts"]');
          await page.locator(`[data-open="${accountId}"]`).click();
          await page.click('[data-tab="stakeholders"]');
          if (!((await page.locator('#app').textContent()) || '').includes('Production E2E Stakeholder')) throw new Error('stakeholder edit missing after reload');
          await page.click('[data-tab="technical"]');
          if (!((await page.locator('#app').textContent()) || '').includes('Production E2E Technical Owner')) throw new Error('technical edit missing after reload');
          await browser.close();
          NODE
          CHROME="$chrome" node test.mjs

      - name: Remove old abc.clintware.com binding after successful cutover
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=abc.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          domain_ids=$(python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; rows=d.get("result",[]); assert all(x.get("hostname")=="abc.clintware.com" for x in rows),rows; print("\n".join(str(x["id"]) for x in rows))' <<< "$response")
          if [ -n "$domain_ids" ]; then
            while IFS= read -r domain_id; do
              deleted=$(curl --fail-with-body -sS -X DELETE \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains/${domain_id}" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
              python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d' <<< "$deleted"
            done <<< "$domain_ids"
          fi
          removed=0
          for i in $(seq 1 20); do
            remaining=$(curl --fail-with-body -sS \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=abc.clintware.com" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            count=$(python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; print(len(d.get("result",[])))' <<< "$remaining")
            if [ "$count" = "0" ]; then
              removed=1
              break
            fi
            sleep 3
          done
          test "$removed" = "1"
