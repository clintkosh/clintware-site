name: Inspect ABC source targets 2
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-abc-source2.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          chunks=[]
          for i in range(1,6):
            m=re.search(r'"([A-Za-z0-9+/=]+)"',(Path('abc/src')/f'app-part{i}.js').read_text());chunks.append(m.group(1))
          h=gzip.decompress(base64.b64decode(''.join(chunks))).decode()
          for term in ['function kpi','function modal','function command(){','function renderTopBar(){','function addNote(a){']:
            m=h.find(term);print('\n###',term,'###\n',h[m:m+4200] if m>=0 else 'NOT FOUND')
          PY
