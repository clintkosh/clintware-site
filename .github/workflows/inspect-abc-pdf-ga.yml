name: Inspect ABC PDF and analytics
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-abc-pdf-ga.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect decoded app and worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          chunks=[]
          for i in range(1,6):
            m=re.search(r'"([A-Za-z0-9+/=]+)"',(Path('abc/src')/f'app-part{i}.js').read_text()); assert m; chunks.append(m.group(1))
          h=gzip.decompress(base64.b64decode(''.join(chunks))).decode()
          for term in ['PDF','pdf','window.print','print()','@media print','meeting brief','function brief','fmtDate','date']:
            hits=list(re.finditer(re.escape(term),h,re.I)); print('\n###',term,'COUNT',len(hits))
            for m in hits[:12]: print(h[max(0,m.start()-450):m.start()+1300],'\n---')
          print('\n### INDEX.JS ###')
          print(Path('abc/src/index.js').read_text()[:22000])
          PY
