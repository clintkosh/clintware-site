name: Verify Stable ABC Production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-abc-stable.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify stable production and exact account workspace in Chrome
        run: |
          set -euo pipefail
          mkdir -p /tmp/abcverify && cd /tmp/abcverify
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core >/dev/null 2>&1
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          export ABC_PASS="$(python3 -c 'import os,re; s=open(os.path.join(os.environ["GITHUB_WORKSPACE"],"abc/src/index.js")).read(); m=re.search(r"const PASS=\x27([^\x27]+)\x27",s); assert m; print(m.group(1))')"
          test -n "$ABC_PASS"
          cat > verify.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          let ready=false;
          for(let i=1;i<=30;i++){
            try{
              await page.goto('https://abc.clintware.com/?stable-current='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1400);
              const hasGate=await page.locator('#gate').count();
              const modelScript=page.locator('#abnormal-model-script');
              const modelScriptCount=await modelScript.count();
              const modelText=modelScriptCount ? ((await modelScript.textContent().catch(()=>''))||'') : '';
              const hasRuntimeCopy=modelText.includes('applyAbnormalRuntimeCopy');
              const hasPostRenderTiming=modelText.includes('[120,350,900,1600]');
              const hasCurrentMarker=hasRuntimeCopy && hasPostRenderTiming;
              if(hasGate && hasCurrentMarker){ready=true;console.log('CURRENT_BUILD_READY_ATTEMPT',i);break}
              console.log('WAIT_CURRENT_BUILD',i,'gate='+hasGate,'modelScript='+modelScriptCount,'runtimeCopy='+hasRuntimeCopy,'postRenderTiming='+hasPostRenderTiming,'title='+(await page.title().catch(()=>'')));
            }catch(e){
              console.log('WAIT_CURRENT_BUILD_ERROR',i,String(e));
            }
            await page.waitForTimeout(5000);
          }
          if(!ready)throw new Error('current post-render-timed ABC build never appeared in Chrome');

          await page.fill('#pw','wrong-password');
          await page.click('#access-form button[type="submit"]');
          if((await page.textContent('#gate-error'))!=='Incorrect password.')throw new Error('wrong password rejection failed');
          await page.fill('#pw',process.env.ABC_PASS);
          await page.click('#access-form button[type="submit"]');
          await page.waitForFunction(()=>document.body.classList.contains('unlocked'));
          await page.waitForFunction(()=>{try{const d=JSON.parse(localStorage.getItem('zs_ops_dtex_model_v2')||'null');return d&&d.abcAbnormalModelVersion===4&&d.accounts?.length===20&&d.accounts[0]?.name==='Lone Mesa Energy'}catch(e){return false}},{timeout:30000});
          await page.waitForFunction(()=>document.body.classList.contains('unlocked'));
          await page.waitForTimeout(1800);

          const model=await page.evaluate(()=>JSON.parse(localStorage.getItem('zs_ops_dtex_model_v2')));
          const accountId=model.accounts[0].id;
          const appText=await page.locator('#app').innerText();
          console.log('COMMAND_CENTER_TEXT',JSON.stringify(appText.slice(0,7000)));
          for(const required of [
            'Manage enterprise customer value, adoption, risk, and renewal readiness in one operating picture.',
            'Customer outcomes over activity','Intellectual Honesty','Enterprise Customer Success motion',
            'Customer Cadence','Engagement Coverage','Value & Growth','Voice of Customer',
            'VALUE REALIZATION','ADOPTION & ENABLEMENT','RENEWAL & EXPANSION','RISK & ESCALATION','VOICE OF CUSTOMER'
          ]) if(!appText.toLowerCase().includes(required.toLowerCase())) throw new Error('final Abnormal copy missing: '+required);
          for(const forbidden of ['Run the post-sales business with one operating picture.','Headcount planning signal','RESOURCE RIGOR','Budget, forecast and investment visibility','CUSTOMER SUCCESS BUSINESS OPERATIONS']) if(appText.includes(forbidden))throw new Error('old ZS copy still visible: '+forbidden);
          if(model.accounts.length!==20||model.accounts[0].name!=='Lone Mesa Energy'||model.accounts[0].region!=='Houston, TX')throw new Error('TOLA model changed');
          if(model.healthModel.adoption!==30||model.healthModel.valueRealization!==25||model.healthModel.stakeholderAlignment!==20||model.healthModel.riskAndEscalation!==15||model.healthModel.renewalAndGrowth!==10)throw new Error('health model changed');
          if(model.accounts[0].contacts.length<3)throw new Error('multi-threaded stakeholder model missing');

          const accountLinks=page.locator('[data-open]');
          if(!(await accountLinks.count()))throw new Error('no account links on Command Center');
          console.log('ACCOUNT_LINK_COLOR',await accountLinks.first().evaluate(el=>getComputedStyle(el).color));
          console.log('PRIMARY_ACTIONS',JSON.stringify(await page.locator('.abc-primary-action').allTextContents()));

          const accountsRoute=page.locator('[data-route="accounts"]');
          if(await accountsRoute.count())await accountsRoute.first().click();else await page.getByText('Accounts',{exact:true}).first().click();
          await page.waitForTimeout(700);

          const exact=page.locator(`[data-open="${accountId}"]`).first();
          console.log('ACCOUNT_ID',accountId,'EXACT_COUNT',await page.locator(`[data-open="${accountId}"]`).count());
          if(!(await exact.count()))throw new Error('exact first account open control not found');
          console.log('EXACT_OUTER_HTML',await exact.evaluate(el=>el.outerHTML));
          await exact.click();
          await page.waitForTimeout(900);

          const tabs=page.locator('[data-tab]');
          console.log('TAB_COUNT',await tabs.count());
          const tabText=await tabs.allTextContents();
          console.log('ACCOUNT_TABS',JSON.stringify(tabText));
          const controls=await page.evaluate(()=>[...document.querySelectorAll('button,a,input,select,textarea')].map(e=>({tag:e.tagName,id:e.id||'',name:e.getAttribute('name')||'',text:(e.innerText||e.textContent||'').trim().replace(/\s+/g,' ').slice(0,120),data:[...e.attributes].filter(a=>a.name.startsWith('data-')).map(a=>a.name+'='+a.value)})).filter(x=>x.id||x.text||x.name||x.data.length));
          console.log('ACCOUNT_CONTROLS',JSON.stringify(controls.slice(0,500)));
          console.log('ACCOUNT_TEXT',JSON.stringify((await page.locator('#app').innerText()).slice(-8000)));

          if(!(await tabs.count()))throw new Error('exact account click did not open account workspace');
          for(const t of ['Stakeholders','Success Plan','Technical','Meetings','Notes','Commercial']) if(!tabText.some(x=>x.includes(t)))throw new Error('missing account tab: '+t);
          if(errors.length)throw new Error('page errors: '+errors.join(' | '));
          console.log('PASS: current stable ABC build, final Abnormal copy, exact account workspace, and tabs verified');
          await browser.close();
          NODE
          CHROME="$chrome" node verify.mjs
