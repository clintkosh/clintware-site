name: Validate Quillgeist Desktop

on:
  push:
    branches: [main]
    paths:
      - "quillgeist-lite/guardian/**"
      - "quillgeist-lite/launcher/**"
      - "quillgeist-lite/tasks/install-desktop-app.ps1"
      - "quillgeist-lite/runner.ps1"
      - ".github/workflows/validate-quillgeist-desktop.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Guardian
        shell: pwsh
        run: dotnet publish quillgeist-lite/guardian/Clintware.QuillgeistLite.Guardian.csproj -c Release -r win-x64 -o artifacts/guardian --nologo

      - name: Guardian self-test
        shell: pwsh
        run: ./artifacts/guardian/Clintware.QuillgeistLite.Guardian.exe --self-test

      - name: Build WinUI single-pane launcher
        shell: pwsh
        run: dotnet publish quillgeist-lite/launcher/Clintware.QuillgeistLite.Launcher.csproj -c Release -r win-x64 -o artifacts/launcher --nologo

      - name: Require desktop outputs
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/guardian/Clintware.QuillgeistLite.Guardian.exe)) { throw "Guardian EXE missing" }
          if (-not (Test-Path artifacts/launcher/Clintware.QuillgeistLite.exe)) { throw "Launcher EXE missing" }

      - name: Parse PowerShell migration surfaces
        shell: pwsh
        run: |
          foreach ($path in @("quillgeist-lite/runner.ps1","quillgeist-lite/tasks/install-desktop-app.ps1")) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }

      - name: Guard against loop architecture regression
        shell: pwsh
        run: |
          $installer = Get-Content quillgeist-lite/tasks/install-desktop-app.ps1 -Raw
          if ($installer -notmatch "LegacyRunnerTask") { throw "Legacy runner supervisor migration missing" }
          if ($installer -notmatch "RepetitionInterval") { throw "Minute Guardian ensure missing" }
          $guardian = Get-Content quillgeist-lite/guardian/Program.cs -Raw
          if ($guardian -notmatch "RestartBudgetAvailable") { throw "Restart budget missing" }
          if ($guardian -notmatch "network_degraded_process_healthy") { throw "Connectivity/liveness separation missing" }
