name: Deploy Clintware Stats Dashboard

on:
  push:
    branches: [main]
    paths:
      - "stats/**"
      - ".github/workflows/deploy-stats-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clintware-stats-dashboard
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stats/package-lock.json
      - run: npm ci
      - run: npm run validate
      - name: Validate repository-wide CRM analytics guardrail
        working-directory: .
        run: python3 tests/validate_crm_analytics.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to replace a different Worker domain owner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=stats.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True,d; assert not r or all(x.get("service")=="clintware-stats-dashboard" for x in r),r; print("stats.clintware.com is free or already owned by the stats Worker")' <<< "$response"
      - name: Deploy private analytics Worker and attach custom domain
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd stats
      - name: Verify production gate, headers, and anonymous protection
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 30); do
            health=$(curl -sS --connect-timeout 5 --max-time 20 https://stats.clintware.com/health || true)
            if grep -Fq '"ok":true' <<< "$health"; then ready=1; break; fi
            sleep 4
          done
          test "$ready" = 1
          headers=$(mktemp)
          body=$(mktemp)
          curl --fail-with-body -sS -D "$headers" -o "$body" https://stats.clintware.com/
          grep -Eiq '^x-robots-tag:.*noindex' "$headers"
          grep -Eiq '^x-frame-options:.*DENY' "$headers"
          grep -Fq 'G-DCY144YM9P' "$body"
          status=$(curl -sS -o /dev/null -w '%{http_code}' https://stats.clintware.com/api/dashboard)
          test "$status" = 401
