name: Emergency Rebind Quillgeist Domain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/quillgeist-emergency-rebind.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force Quillgeist domain onto existing runtime Worker
        id: rebind
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          current=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=quillgeist.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          mapfile -t ids < <(python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; [print(x["id"]) for x in d.get("result",[]) if x.get("hostname")=="quillgeist.clintware.com"]' <<< "$current")
          for id in "${ids[@]}"; do
            result=$(curl --fail-with-body -sS -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains/${id}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d' <<< "$result"
          done
          response=$(curl --fail-with-body -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"hostname":"quillgeist.clintware.com","service":"clintware-agentbridge","zone_name":"clintware.com"}')
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; assert d.get("result",{}).get("service")=="clintware-agentbridge",d' <<< "$response"
      - name: Probe and publish sanitized Quillgeist status
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REBIND_OUTCOME: ${{ steps.rebind.outcome }}
        run: |
          set +e
          git pull --rebase origin main
          mkdir -p ops
          service=""
          domain_api_success=false
          domain_count=0
          domain_json=$(curl -sS --connect-timeout 5 --max-time 15 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=quillgeist.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" 2>/dev/null)
          if [ -n "$domain_json" ]; then
            service=$(python3 -c 'import json,sys
try:
 d=json.load(sys.stdin); r=d.get("result",[]); print(r[0].get("service","") if r else "")
except Exception: print("")' <<< "$domain_json")
            domain_count=$(python3 -c 'import json,sys
try:
 d=json.load(sys.stdin); print(len(d.get("result",[])))
except Exception: print(0)' <<< "$domain_json")
            python3 -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("success") is True else 1)' <<< "$domain_json" && domain_api_success=true
          fi
          page_code=$(curl -L -sS -o /tmp/qg-page -w '%{http_code}' --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/ 2>/dev/null || true)
          health_code=$(curl -L -sS -o /tmp/qg-health -w '%{http_code}' --connect-timeout 5 --max-time 15 https://quillgeist.clintware.com/api/health 2>/dev/null || true)
          test -n "$page_code" || page_code=000
          test -n "$health_code" || health_code=000
          page_marker=false
          health_marker=false
          grep -Fq 'QUILLGEIST' /tmp/qg-page 2>/dev/null && page_marker=true
          grep -Fq '"ok":true' /tmp/qg-health 2>/dev/null && health_marker=true
          python3 - <<PY
          import json, os
          from datetime import datetime, timezone
          status={
            "checked_at": datetime.now(timezone.utc).isoformat(),
            "source_commit": "${GITHUB_SHA}",
            "emergency_rebind": os.environ.get("REBIND_OUTCOME", "unknown"),
            "domain_api_success": "${domain_api_success}" == "true",
            "domain_count": int("${domain_count}" or 0),
            "domain_service": "${service}",
            "page_http": "${page_code}",
            "health_http": "${health_code}",
            "page_marker_ok": "${page_marker}" == "true",
            "health_marker_ok": "${health_marker}" == "true"
          }
          open("ops/quillgeist-deploy-status.json","w").write(json.dumps(status,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/quillgeist-deploy-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Quillgeist emergency rebind status"
          git push
