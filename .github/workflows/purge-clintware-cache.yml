name: Purge Clintware Cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/purge-clintware-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZONE_NAME: clintware.com
    steps:
      - name: Resolve Clintware zone
        id: zone
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}&account.id=${CLOUDFLARE_ACCOUNT_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          zone_id=$(printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; r=d.get("result",[]); assert r,"zone not found"; print(r[0]["id"])')
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"

      - name: Purge changed public pages
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.zone_id }}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://www.clintware.com/","https://clintware.com/","https://www.clintware.com/startup/","https://www.clintware.com/products/","https://www.clintware.com/about/"]}')
          printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True,d; print("Cloudflare cache purge accepted.")'
