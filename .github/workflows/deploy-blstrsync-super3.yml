name: Deploy Super 3 Team Synergy System

on:
  push:
    branches: [main]
    paths:
      - "projects/blstrsync-crm/**"
      - "quillgeist-lite/tools/crm_astro.py"
      - "scripts/validate-evidence-provenance.py"
      - ".github/workflows/deploy-blstrsync-super3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-blstrsync-super3
  cancel-in-progress: true

jobs:
  validate-deploy-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate ASTRO manifest
        run: |
          set -euo pipefail
          python3 quillgeist-lite/tools/crm_astro.py --Action validate --Manifest projects/blstrsync-crm/manifest.json --Json

      - name: Materialize local-first build
        run: |
          set -euo pipefail
          node projects/blstrsync-crm/scripts/materialize.mjs
          test -f .build/blstrsync-crm/BUILD-MANIFEST.json
          grep -Fq '"qq_compatible": true' .build/blstrsync-crm/BUILD-MANIFEST.json
          grep -Fq '"local_bitnet_compatible": true' .build/blstrsync-crm/BUILD-MANIFEST.json

      - name: Install and source checks
        working-directory: .build/blstrsync-crm
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          python3 ../../scripts/validate-evidence-provenance.py --ledger evidence-provenance.json --artifact public/usage-proof.js

      - name: Wrangler dry run
        working-directory: .build/blstrsync-crm
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .build/blstrsync-crm
          command: deploy

      - name: Verify live HTTP contract
        run: |
          set -euo pipefail
          base="https://blstrsync.clintware.com"
          ready=0
          for i in $(seq 1 36); do
            h=$(curl -fsS --connect-timeout 5 --max-time 15 "$base/health" || true)
            p=$(curl -fsS --connect-timeout 5 --max-time 15 "$base/" || true)
            c=$(curl -fsS --connect-timeout 5 --max-time 15 "$base/training/csm.html" || true)
            t=$(curl -fsS --connect-timeout 5 --max-time 15 "$base/training/tam.html" || true)
            r=$(curl -fsS --connect-timeout 5 --max-time 15 "$base/training/partner.html" || true)
            if grep -Fq '"service":"clintware-blstrsync-crm"' <<< "$h" \
              && grep -Fq '"storage":"browser-local"' <<< "$h" \
              && grep -Fq 'SYNERGY CONSOLE' <<< "$p" \
              && grep -Fq 'CSM ENABLEMENT' <<< "$c" \
              && grep -Fq 'TAM ENABLEMENT' <<< "$t" \
              && grep -Fq 'PARTNER ENABLEMENT' <<< "$r"; then
              ready=1; break
            fi
            sleep 5
          done
          test "$ready" = "1"

      - name: Interactive browser smoke
        run: |
          set -euo pipefail
          mkdir -p /tmp/blstrsync-browser
          cd /tmp/blstrsync-browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          cat > verify.mjs <<'JS'
          import { chromium } from "playwright";
          const base="https://blstrsync.clintware.com";
          const browser=await chromium.launch({headless:true,channel:"chrome"});
          const context=await browser.newContext({viewport:{width:1440,height:960},acceptDownloads:true});
          const page=await context.newPage();
          const errors=[];
          page.on("pageerror",e=>errors.push("page:"+String(e)));
          page.on("console",m=>{if(m.type()==="error"&&!/^Failed to load resource/i.test(m.text()))errors.push("console:"+m.text())});
          const response=await page.goto(base,{waitUntil:"networkidle",timeout:30000});
          if(!response?.ok())throw new Error("landing HTTP "+response?.status());
          await page.waitForSelector("#persona");
          const body=await page.locator("body").innerText();
          if(!body.includes("SYNERGY CONSOLE"))throw new Error("neutral product identity missing");
          if(body.includes("Bolster")||body.includes("Technical Account Manager"))throw new Error("target-company/job-ad identity leaked into primary UI");
          if(await page.locator("#account option").count()<7)throw new Error("synthetic account portfolio incomplete");

          await page.selectOption("#persona","csm");
          if(await page.locator("#track option[value='threats']").count())throw new Error("CSM lens exposes TAM-only threat track");
          await page.selectOption("#persona","tam");
          if(!(await page.locator("#track option[value='threats']").count()))throw new Error("TAM threat track missing");
          await page.selectOption("#track","handoffs");
          const pending=page.locator("[data-accept]").first();
          if(await pending.count()){await pending.click();await page.reload({waitUntil:"networkidle"});await page.selectOption("#persona","tam");await page.selectOption("#track","handoffs");if((await page.locator("body").innerText()).includes("Pending acceptance")===false){} }

          await page.selectOption("#persona","partner");
          await page.selectOption("#track","training");
          const training=page.locator("[data-training]").first();
          await training.click();
          await page.reload({waitUntil:"networkidle"});
          await page.selectOption("#persona","partner");
          await page.selectOption("#track","training");
          if(!(await page.locator("body").innerText()).includes("Complete"))throw new Error("training progress persistence failed");

          const trainingPage=await context.newPage();
          if(!(await trainingPage.goto(base+"/training/tam.html",{waitUntil:"networkidle"}))?.ok())throw new Error("TAM training page unavailable");
          if(!(await trainingPage.locator("body").innerText()).includes("Own the technical gap"))throw new Error("TAM training content missing");
          const walkthrough=await context.newPage();
          if(!(await walkthrough.goto(base+"/walkthrough.html",{waitUntil:"networkidle"}))?.ok())throw new Error("walkthrough unavailable");

          const mobile=await context.newPage();
          await mobile.setViewportSize({width:390,height:844});
          await mobile.goto(base,{waitUntil:"networkidle"});
          const overflow=await mobile.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
          if(overflow)throw new Error("mobile horizontal overflow");
          if(errors.length)throw new Error(errors.join(" | "));
          console.log(JSON.stringify({ok:true,accounts:await page.locator("#account option").count(),team_lenses:4,training_persistence:true,tam_training:true,walkthrough:true,mobileOverflow:false},null,2));
          await browser.close();
          JS
          node verify.mjs

      - name: Verification summary
        run: echo "SUPER3_VERIFIED domain=blstrsync.clintware.com manifest+materialize+provenance+source-check+dry-run+deploy+live-http+team-lenses+browser-local+training+walkthrough+mobile"
