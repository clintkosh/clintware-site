name: ProofOS live repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/proofos-live-diagnostic.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch broken browser script and deep link behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('proofos/src/page.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("Internal evidence reserved for Clint\\'s own work artifacts", "Internal evidence reserved for Clint&#39;s own work artifacts")
          s=s.replace("company\\'s published process", "company&#39;s published process")
          old="""      .finally(function(){btn.disabled=false;btn.textContent='Research'});\n  });\n\n  document.querySelectorAll('.cta button').forEach(function(el){"""
          new="""      .finally(function(){btn.disabled=false;btn.textContent='Research'});\n  });\n\n  var initialCompany=new URLSearchParams(window.location.search).get('company');\n  if(initialCompany){\n    input.value=initialCompany.slice(0,80);\n    setTimeout(function(){if(form.requestSubmit)form.requestSubmit();else btn.click();},0);\n  }\n\n  document.querySelectorAll('.cta button').forEach(function(el){"""
          if old not in s: raise SystemExit('deep-link insertion point missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify generated browser script
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { renderPage } from './proofos/src/page.js';
          import { writeFileSync } from 'node:fs';
          const html=renderPage({version:'repair'});
          const m=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!m) throw new Error('script missing');
          writeFileSync('/tmp/proofos-client.js',m[1]);
          if(!m[1].includes('URLSearchParams(window.location.search)')) throw new Error('deep link behavior missing');
          NODE
          node --check /tmp/proofos-client.js

      - name: Test ProofOS
        run: |
          npm install --prefix proofos --ignore-scripts --no-audit --no-fund
          npm run --prefix proofos check
          npm test --prefix proofos

      - name: Commit browser repair
        run: |
          git config user.name "Clintware Automation"
          git config user.email "actions@users.noreply.github.com"
          git add proofos/src/page.js
          git commit -m "Fix ProofOS browser runtime and Sweed deep links"
          git push

      - name: Deploy ProofOS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --prefix proofos wrangler deploy --config proofos/wrangler.jsonc

      - name: Verify live telemetry and page source
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            page=$(curl -fsS --max-time 20 'https://proof.clintware.com/?company=Sweed' || true)
            summary=$(curl -fsS --max-time 20 https://proof.clintware.com/api/summary || true)
            if echo "$page" | grep -Fq 'URLSearchParams(window.location.search)' && echo "$summary" | grep -Fq '"ok":true'; then
              echo "ProofOS UI and telemetry are live."
              echo "$summary" | head -c 1000
              exit 0
            fi
            sleep 5
          done
          exit 1
