name: AgentBridge Alpha CI

on:
  pull_request:
    paths:
      - "agentbridge-node/**"
      - "agentbridge-cloud/**"
      - "agentbridge-mobile/**"
      - "agentbridge-help/**"
      - "scripts/check_agentbridge_help_docs.py"
      - "public/tools/agentbridge/**"
      - ".github/workflows/agentbridge-*.yml"
  push:
    branches: [main]
    paths:
      - "agentbridge-node/**"
      - "agentbridge-cloud/**"
      - "agentbridge-mobile/**"
      - "agentbridge-help/**"
      - "scripts/check_agentbridge_help_docs.py"
      - "public/tools/agentbridge/**"
      - ".github/workflows/agentbridge-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AgentBridge Node
        run: python -m pip install ./agentbridge-node
      - name: Compile Python
        run: python -m compileall -q agentbridge-node
      - name: Unit tests
        run: PYTHONPATH=agentbridge-node python -m unittest discover -s agentbridge-node/tests -v
      - name: CLI doctor and Help Center
        env:
          AGENTBRIDGE_HOME: ${{ runner.temp }}/agentbridge-home
        run: |
          agentbridge doctor
          agentbridge help start --no-pager
          agentbridge help glossary --search Contextor --no-pager
      - name: Local execution smoke test
        env:
          AGENTBRIDGE_HOME: ${{ runner.temp }}/agentbridge-home
        run: |
          agentbridge telemetry off
          mkdir -p "${{ runner.temp }}/ab-work"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'hello.json'
          w=Path(os.environ['RUNNER_TEMP'])/'ab-work'
          p.write_text(json.dumps({
            'agentbridge':'1.0','title':'CI smoke','workspace':str(w),
            'permissions':['file.write'],
            'steps':[{'type':'write_file','path':'hello.txt','content':'AgentBridge alpha'}],
            'definition_of_done':[{'type':'file_contains','path':'hello.txt','text':'AgentBridge'}]
          }))
          PY
          agentbridge run "${{ runner.temp }}/hello.json" --approve-all
          grep -Fq "AgentBridge alpha" "${{ runner.temp }}/ab-work/hello.txt"

  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check agentbridge-cloud/src/index.js
          node --check agentbridge-cloud/src/entry.js
          node --check agentbridge-cloud/src/telemetry.js
          node --check agentbridge-cloud/src/help.js
          node --check agentbridge-cloud/public/app.js
          node --check agentbridge-cloud/public/fluid.js
          node --check agentbridge-cloud/public/sw.js
      - name: Validate Wrangler config
        run: node -e 'const d=JSON.parse(require("fs").readFileSync("agentbridge-cloud/wrangler.jsonc","utf8")); if(d.main!=="src/entry.js") throw new Error("entrypoint mismatch"); for(const n of ["TELEMETRY_HUB","PRODUCT_METRICS_HUB","HELP_HUB"]) if(!d.durable_objects.bindings.some(x=>x.name===n)) throw new Error(`missing ${n}`); console.log("wrangler config ok")'
      - name: Validate Help Center documentation invariant
        run: python3 scripts/check_agentbridge_help_docs.py
      - name: Validate compact interface
        run: |
          grep -Fq 'Your AI plans.' agentbridge-cloud/public/index.html
          grep -Fq 'Your machines execute.' agentbridge-cloud/public/index.html
          grep -Fq 'All systems relaxed.' agentbridge-cloud/public/index.html
          for view in home run automate activity help; do grep -Fq "data-view=\"$view\"" agentbridge-cloud/public/index.html; done
          grep -Fq 'net_tokens_saved_est' agentbridge-cloud/src/telemetry.js
          grep -Fq 'bugs_resolved' agentbridge-cloud/src/telemetry.js
          grep -Fq 'HelpHub' agentbridge-cloud/src/help.js
          grep -Fq 'styles.css' agentbridge-cloud/public/sw.js
          grep -Fq 'fluid.js' agentbridge-cloud/public/sw.js
          grep -Fq "prefers-reduced-motion" agentbridge-cloud/public/styles.css
      - name: Validate public alpha markers
        run: |
          grep -Fq "AgentBridge" public/tools/agentbridge/index.html
          grep -Fq "agentbridge.clintware.com" public/tools/agentbridge/index.html
      - name: Clintware production guardrail
        run: |
          python3 -m pip install --disable-pip-version-check "reportlab>=4.2,<5"
          python3 build_site.py

  mobile-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Expo metadata
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("agentbridge-mobile/app.json","utf8")); JSON.parse(require("fs").readFileSync("agentbridge-mobile/package.json","utf8")); console.log("mobile metadata ok")'
          grep -Fq "expo-document-picker" agentbridge-mobile/package.json
          grep -Fq "All systems relaxed." agentbridge-mobile/App.js
