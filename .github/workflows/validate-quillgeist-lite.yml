name: Validate Quillgeist Lite

on:
  push:
    branches: [main]
    paths:
      - "quillgeist-lite/**"
      - "scripts/code-search.mjs"
      - "scripts/code-search.ps1"
      - "CODE_SEARCH.md"
      - "identity-broker/scripts/grant-google-cloud-support-access.ps1"
      - "identity-broker/scripts/finish-google-oauth.ps1"
      - ".github/workflows/validate-quillgeist-lite.yml"
  pull_request:
    paths:
      - "quillgeist-lite/**"
      - "scripts/code-search.mjs"
      - "scripts/code-search.ps1"
      - "CODE_SEARCH.md"
      - "identity-broker/scripts/grant-google-cloud-support-access.ps1"
      - "identity-broker/scripts/finish-google-oauth.ps1"
      - ".github/workflows/validate-quillgeist-lite.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test recovery sequencing and credential outages
        shell: pwsh
        run: ./quillgeist-lite/tests/recovery.Tests.ps1

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            "quillgeist-lite/runner.ps1",
            "quillgeist-lite/worker-host.ps1",
            "quillgeist-lite/launch-visible.ps1",
            "quillgeist-lite/launcher.ps1",
            "quillgeist-lite/install.ps1",
            "quillgeist-lite/uninstall.ps1",
            "quillgeist-lite/service/install-service.ps1",
            "quillgeist-lite/tasks/clintware-doctor.ps1",
            "quillgeist-lite/tasks/ensure-c-runtime.ps1",
            "quillgeist-lite/tasks/ensure-powershell.ps1",
            "quillgeist-lite/tasks/auto-repair-runtime.ps1",
            "quillgeist-lite/tasks/start-qq-window.ps1",
            "quillgeist-lite/tasks/mcp-console.ps1",
            "quillgeist-lite/tasks/dedupe-qq-windows.ps1",
            "quillgeist-lite/tasks/ensure-browser-runtime.ps1",
            "quillgeist-lite/tasks/browser-work.ps1",
            "quillgeist-lite/tasks/open-edge-tab.ps1",
            "quillgeist-lite/tasks/responder-agent.ps1",
            "quillgeist-lite/tasks/career-signal-agent.ps1",
            "quillgeist-lite/tasks/bitnet-setup.ps1",
            "quillgeist-lite/tasks/finish-local-ai.ps1",
            "quillgeist-lite/tasks/record-google-oauth-verification.ps1",
            "quillgeist-lite/tasks/update-powerchatbridge.ps1",
            "quillgeist-lite/tasks/self-update.ps1",
            "quillgeist-lite/tasks/repair-local-service.ps1",
            "quillgeist-lite/tools/driznet-reconcile-and-resume.ps1",
            "quillgeist-lite/tasks/apply-terminal-glass.ps1",
            "quillgeist-lite/tasks/connect-jira.ps1",
            "quillgeist-lite/tasks/enable-admin-console.ps1",
            "quillgeist-lite/tasks/bootstrap-admin-console.ps1",
            "quillgeist-lite/tasks/repo-code-search.ps1",
            "scripts/code-search.ps1",
            "identity-broker/scripts/grant-google-cloud-support-access.ps1",
            "identity-broker/scripts/finish-google-oauth.ps1"
          )

          $files += @(Get-ChildItem "quillgeist-lite/tasks" -Filter "*.ps1" -File | ForEach-Object { $_.FullName })
          $files = @($files | Select-Object -Unique)
          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Missing expected file: $file"
            }

            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | Format-List *
              throw "PowerShell parse errors in $file"
            }

            Write-Host "PARSE_OK $file"
          }

      - name: Validate task registry
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $registry = Get-Content "quillgeist-lite/tasks.json" -Raw | ConvertFrom-Json

          if ([int]$registry.version -lt 26) {
            throw "Task registry version is older than the adaptive worker-pool baseline."
          }
          foreach ($requiredParallel in @("clintware-doctor","python-runtime-check","c-runtime-check","repo-code-search","storage-audit","big-prompt-plan","worker-pool-profile","local-model-work")) {
            $task = $registry.tasks.PSObject.Properties[$requiredParallel].Value
            if (-not $task -or $task.parallel_safe -ne $true) { throw "Parallel-safe task metadata missing: $requiredParallel" }
            if (-not $task.resource_class -or -not $task.concurrency_group -or -not $task.max_parallel) { throw "Adaptive worker metadata incomplete: $requiredParallel" }
          }
          if ([string]$registry.tasks.'local-model-work'.resource_class -ne "gpu") {
            throw "local-model-work must remain GPU-classed."
          }

          $extensions = @{
            powershell = ".ps1"
            python = ".py"
            c = ".c"
          }

          foreach ($property in $registry.tasks.PSObject.Properties) {
            $task = $property.Value
            $runtime = [string]$task.runtime

            if (-not $extensions.ContainsKey($runtime)) {
              throw "Task $($property.Name) uses unsupported runtime '$runtime'."
            }

            $required = $extensions[$runtime]
            if (-not ([string]$task.script).EndsWith($required,[StringComparison]::OrdinalIgnoreCase)) {
              throw "Task $($property.Name) runtime '$runtime' must reference a $required file."
            }

            if ($task.script.Contains("..")) {
              throw "Task $($property.Name) contains path traversal."
            }

            if (-not (Test-Path $task.script)) {
              throw "Task $($property.Name) references missing source $($task.script)"
            }

            Write-Host "TASK_OK $($property.Name) [$runtime] -> $($task.script)"
          }

          $pythonFiles = @(
            "quillgeist-lite/tasks/runtime-python-check.py",
            "quillgeist-lite/tools/boot_splash.py",
            "quillgeist-lite/tools/terminal_repair.py",
            "quillgeist-lite/tools/browser_agent.py",
            "quillgeist-lite/tools/oauth_verification_capture.py",
            "quillgeist-lite/tools/local_ai.py",
            "quillgeist-lite/tools/local_ai_parity_check.py",
            "quillgeist-lite/tools/responder_agent.py",
            "quillgeist-lite/tools/provider_responder.py",
            "quillgeist-lite/tools/career_signal_agent.py",
            "quillgeist-lite/tools/crm_astro.py",
            "quillgeist-lite/tools/resource_scheduler.py",
            "quillgeist-lite/tools/local_model_work.py",
            "agentbridge-node/agentbridge_node/big_prompt.py",
            "quillgeist-lite/dispatch/relay.py"
          )
          $logoB64 = (Get-Content "quillgeist-lite/assets/clintware-terminal-logo.b64" -Raw).Trim()
          if (($logoB64.Length % 4) -ne 0) {
            throw "Clintware logo base64 length is invalid."
          }
          try {
            $logoBytes = [Convert]::FromBase64String($logoB64)
          } catch {
            throw "Clintware logo asset is not valid base64."
          }
          if ($logoBytes.Length -lt 1000) {
            throw "Clintware logo PNG is unexpectedly small."
          }
          $pngSignature = [byte[]](137,80,78,71,13,10,26,10)
          for ($i=0; $i -lt $pngSignature.Length; $i++) {
            if ($logoBytes[$i] -ne $pngSignature[$i]) {
              throw "Clintware logo asset does not decode to a PNG."
            }
          }
          Write-Host "CLINTWARE_LOGO_OK bytes=$($logoBytes.Length)"

          foreach ($pyFile in $pythonFiles) {
            python -m py_compile $pyFile
            if ($LASTEXITCODE -ne 0) {
              throw "Python source failed py_compile: $pyFile"
            }
            Write-Host "PYTHON_PARSE_OK $pyFile"
          }


      - name: Validate adaptive worker planner contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH = (Resolve-Path "agentbridge-node").Path
          $parallelPrompt = @(
            "Research independent implementation options:",
            "- Inspect CPU worker scheduling and summarize findings independently.",
            "- Inspect GPU worker scheduling and summarize findings independently.",
            "- Inspect memory-pressure controls and summarize findings independently.",
            "- Inspect I/O worker scheduling and summarize findings independently.",
            "- Inspect conflict-lock policy and summarize findings independently.",
            "- Inspect cross-machine fan-out and summarize findings independently."
          ) -join "`n"
          $planRaw = @(python -m agentbridge_node.big_prompt_cli $parallelPrompt --project worker-test --max-depth 2 --force)
          if ($LASTEXITCODE -ne 0) { throw "big-prompt planner failed." }
          $plan = ($planRaw -join "`n") | ConvertFrom-Json
          if ($plan.unit_count -lt 2) { throw "Planner did not decompose a substantial prompt." }
          if ($plan.parallel_units -lt 2) { throw "Independent planner units were not made parallel-ready." }
          if (@($plan.units | Where-Object { $_.resource_class -eq "gpu" -or $_.resource_class -eq "cpu" -or $_.resource_class -eq "io" }).Count -lt 1) {
            throw "Planner omitted local resource classes."
          }
          $seqRaw = @(python -m agentbridge_node.big_prompt_cli "First inspect the state. Then modify the configuration. Finally verify the result." --project worker-test --max-depth 2 --force)
          $seq = ($seqRaw -join "`n") | ConvertFrom-Json
          if ($seq.sequential_units -lt 1) { throw "Explicitly sequenced planner work lost dependency ordering." }
          Write-Host "ADAPTIVE_WORKER_PLANNER_OK"

      - name: Smoke-test adaptive worker profile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $raw = @(python quillgeist-lite/tools/resource_scheduler.py --max-workers 12)
          if ($LASTEXITCODE -ne 0) { throw "Resource scheduler failed." }
          $profile = ($raw -join "`n") | ConvertFrom-Json
          if ($profile.ok -ne $true) { throw "Resource scheduler did not return ok." }
          if ([int]$profile.limits.max_workers -lt 1) { throw "Resource scheduler returned no worker capacity." }
          if ($null -eq $profile.gpu_devices -or $null -eq $profile.gpu_slot_indices) { throw "GPU capacity fields are missing." }
          Write-Host "ADAPTIVE_WORKER_PROFILE_OK workers=$($profile.limits.max_workers) gpu=$($profile.limits.gpu_workers)"

      - name: Validate deterministic repository code search
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check scripts/code-search.mjs
          if ($LASTEXITCODE -ne 0) { throw "Node code-search syntax check failed." }

          $raw = @(node scripts/code-search.mjs "calendar_temporarily_unavailable" --path meet-worker --json)
          if ($LASTEXITCODE -ne 0) { throw "Node code-search smoke test found no expected match." }
          $result = ($raw -join "`n") | ConvertFrom-Json
          if ($result.matches -lt 1) { throw "Node code-search did not return an expected match." }

          $psRaw = @(pwsh -NoProfile -File scripts/code-search.ps1 "calendar_temporarily_unavailable" -Path meet-worker -Json -Root $PWD)
          if ($LASTEXITCODE -ne 0) { throw "PowerShell code-search wrapper found no expected match." }
          $psResult = ($psRaw -join "`n") | ConvertFrom-Json
          if ($psResult.matches -lt 1) { throw "PowerShell code-search wrapper did not return an expected match." }

          $taskText = Get-Content "quillgeist-lite/tasks/repo-code-search.ps1" -Raw
          if ($taskText -notlike '*https://github.com/clintkosh/clintware-site.git*') {
            throw "QQ repo-code-search task is not pinned to the maintained repository."
          }
          Write-Host "CODE_SEARCH_OK"

      - name: Smoke-test local CRM ASTRO contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $raw = @(python quillgeist-lite/tools/crm_astro.py --Action validate --Manifest projects/bm-crm/manifest.json --Json)
          if ($LASTEXITCODE -ne 0) { throw "CRM ASTRO manifest validation failed." }
          $data = ($raw -join "`n") | ConvertFrom-Json
          if ($data.track_count -ne 12) { throw "CRM ASTRO expected exactly 12 tracks." }
          if ($data.groups.CSM -ne 6 -or $data.groups.Support -ne 6) { throw "CRM ASTRO expected 6 CSM + 6 Support tracks." }
          if ($data.remote_shell_exposed -ne $false) { throw "CRM ASTRO must not expose a remote shell." }
          Write-Host "CRM_ASTRO_MANIFEST_OK"

      - name: Validate CRM ASTRO control-plane allowlist
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content -LiteralPath "control-plane/src/index.js" -Raw
          if ($src -notmatch '"crm-astro-build":\{runtime:"powershell",parameters:\["Action","Project","SkipInstall"\]\}') { throw "Control Plane does not allow the reviewed CRM ASTRO task contract." }
          if ($src -match '"crm-astro-build":\{runtime:"powershell",parameters:\[[^\]]*(Manifest|RepoRoot)') { throw "CRM ASTRO remote allowlist exposes local path arguments." }
          $restore = Get-Content -LiteralPath "quillgeist-lite/tools/restore-runtime.ps1" -Raw
          if ($restore -notmatch "'tools/crm_astro\.py'") { throw "QQ runtime restore does not include the CRM ASTRO validator." }
          $task = Get-Content -LiteralPath "quillgeist-lite/tasks/crm-astro-build.ps1" -Raw
          if ($task -notmatch "Get-ControlPlaneRevision" -or $task -notmatch "dedicated-cache") { throw "CRM ASTRO builder is not cache-first/source-aware." }
          Write-Host "CONTROL_PLANE_CRM_ASTRO_OK"

      - name: Validate natural CRM routing stays local
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runner = Get-Content -LiteralPath "quillgeist-lite/runner.ps1" -Raw
          foreach ($required in @(
            'Add-QQCapabilityRecommendation "crm-astro-build"',
            'CRM LOCAL ROUTE',
            '$lower.StartsWith("crm build ")',
            '$lower.StartsWith("crm validate ")',
            '$lower.StartsWith("crm deploy ")'
          )) {
            if (-not $runner.Contains($required)) { throw "Missing local CRM routing marker: $required" }
          }
          Write-Host "CRM_ASTRO_LOCAL_ROUTE_OK"

      - name: Validate event-driven QQ runtime convergence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content -LiteralPath "control-plane/src/index.js" -Raw
          foreach ($required in @(
            'clintware-runtime-convergence',
            'runtime_revision_drift',
            'pendingQuillgeistLiteJobs(20,targetDevice)',
            'task_id:"self-update"'
          )) {
            if (-not $src.Contains($required)) { throw "Missing runtime convergence marker: $required" }
          }
          Write-Host "RUNTIME_CONVERGENCE_OK"

      - name: Test preservation during local storage recovery
        shell: pwsh
        run: python quillgeist-lite/tests/test_local_ai_recovery.py

      - name: Smoke-test bounded local AI inspection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = @(python quillgeist-lite/tools/local_ai.py --Action status)
          if ($LASTEXITCODE -ne 0) { throw "local_ai status failed with exit code $LASTEXITCODE" }
          $data = ($output -join "`n") | ConvertFrom-Json
          if ($data.network_required -ne $false) { throw "local_ai status unexpectedly requires network access." }
          if ($data.model_downloads_performed -ne $false) { throw "local_ai status unexpectedly downloaded a model." }
          if ($null -eq $data.memory) { throw "local_ai status omitted memory evidence." }
          Write-Host "LOCAL_AI_STATUS_OK"
          python quillgeist-lite/tools/local_ai_parity_check.py
          if ($LASTEXITCODE -ne 0) { throw "Lite/Full local AI parity check failed." }

          $providerTestRaw = @(python quillgeist-lite/tools/local_ai.py --Action provider-test --Prompt "Reply exactly QQ_RESPONDER_OK.")
          if ($LASTEXITCODE -ne 0) { throw "provider-test diagnostic path crashed." }
          $providerTest = ($providerTestRaw -join "`n") | ConvertFrom-Json
          if ($null -eq $providerTest.ok) { throw "provider-test diagnostic path did not return structured JSON." }
          Write-Host "PROVIDER_TEST_PATH_OK"


      - name: Smoke-test responder defaults
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $raw = @(python quillgeist-lite/tools/responder_agent.py status --json)
          if ($LASTEXITCODE -ne 0) { throw "responder status failed." }
          $data = ($raw -join "`n") | ConvertFrom-Json
          if ($data.enabled -ne $false) { throw "Responder must default disabled." }
          $source = Get-Content "quillgeist-lite/tools/responder_agent.py" -Raw
          if ($source -notlike '*"mode": "RESEARCH_ONLY"*' -or $source -notlike '*HN prohibits generated or AI-edited comments*') {
            throw "HN research-only policy guard is missing."
          }
          if ($source -notlike '*"stack_overflow"*' -or $source -notlike '*"enabled": False*') {
            throw "Stack Overflow must remain disabled by default."
          }
          Write-Host "RESPONDER_DEFAULTS_OK"

          $providerRaw = @(python quillgeist-lite/tools/provider_responder.py status)
          if ($LASTEXITCODE -ne 0) { throw "provider responder status failed." }
          $providerData = ($providerRaw -join "`n") | ConvertFrom-Json
          if ($providerData.ok -ne $true) { throw "provider responder status did not return ok." }
          if ($providerData.exact_provider_subscription_quota_available -ne $false) { throw "provider responder must not claim exact subscription quota when providers do not expose it." }
          Write-Host "SUBSCRIPTION_RESPONDER_STATUS_OK"

      - name: Smoke-test career signal defaults
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "career-signal-test"
          $raw = @(python quillgeist-lite/tools/career_signal_agent.py status --json)
          if ($LASTEXITCODE -ne 0) { throw "career signal status failed." }
          $data = ($raw -join "`n") | ConvertFrom-Json
          if ($data.enabled -ne $true) { throw "Career Signal must default enabled once explicitly installed." }
          if ($data.linkedin_mode -ne "MANUAL_PUBLISH_ONLY") { throw "LinkedIn must remain manual publish only." }
          $runRaw = @(python quillgeist-lite/tools/career_signal_agent.py run --json)
          if ($LASTEXITCODE -ne 0) { throw "career signal run failed." }
          $run = ($runRaw -join "`n") | ConvertFrom-Json
          if ($run.daily_targets.comments -ne 20) { throw "Unexpected daily comment target." }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA "Clintware\QuillgeistLite\career-signal-agent\latest.json"))) { throw "Career Signal did not persist latest.json." }
          Write-Host "CAREER_SIGNAL_DEFAULTS_OK"

      - name: Compile Windows health service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = (Resolve-Path "quillgeist-lite/service/QuillgeistLiteHealthService.cs").Path
          $output = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP "QuillgeistLiteHealthService.exe"))

          if (-not (Test-Path $source)) {
            throw "Missing health service source: $source"
          }

          $sourceText = Get-Content $source -Raw
          if ($sourceText -notlike '*ServiceVersion = "1.4.0-health-contract"*') {
            throw "Health service version marker is not 1.4.0-health-contract."
          }
          if ($sourceText -notlike '*checkin_reply*' -or $sourceText -notlike '*deferred_busy*') {
            throw "Health service is missing independent check-in behavior."
          }
          if ($sourceText -notlike '*wake_received_runner_pid_alive_but_control_plane_disconnected*') {
            throw "Health service is missing stale-runner wake recovery."
          }
          if ($sourceText -notlike '*progress_age_seconds*' -or $sourceText -notlike '*busy_progressing*') {
            throw "Health service is missing progress-aware check-in evidence."
          }

          $adminReconcile = Get-Content "quillgeist-lite/tools/driznet-reconcile-and-resume.ps1" -Raw
          if ($adminReconcile -notlike '*QQ HEALTH CONTRACT*' -or $adminReconcile -notlike '*Wait-ForActiveJobGracefully*') {
            throw "Canonical admin reconcile script is missing required health-contract behavior."
          }

          $selfUpdateText = Get-Content "quillgeist-lite/tasks/self-update.ps1" -Raw
          if ($selfUpdateText -notlike '*repair-local-service.ps1*' -or $selfUpdateText -notlike '*-SkipRunnerRestart*') {
            throw "self-update must align the health service without requesting a duplicate runner launch."
          }

          $cscCandidates = @(
            "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe",
            "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          )
          $csc = $cscCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $csc) {
            throw "Windows .NET Framework csc.exe was not found."
          }

          & $csc /nologo /target:winexe /optimize+ /out:$output /reference:System.ServiceProcess.dll /reference:System.Runtime.Serialization.dll $source
          if ($LASTEXITCODE -ne 0) {
            throw "Health service compilation failed with exit code $LASTEXITCODE."
          }

          if (-not (Test-Path $output)) {
            throw "Health service compilation did not produce an executable."
          }

          Write-Host "SERVICE_COMPILE_OK $output"
