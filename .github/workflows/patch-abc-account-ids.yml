name: Patch ABC Account ID Handling

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-abc-account-ids.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize account IDs crossing browser data attributes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,gzip,math

          root=Path('abc/src')
          parts=[]
          part_files=[]
          for i in range(1,6):
              p=root/f'app-part{i}.js'
              m=re.search(r'"([A-Za-z0-9+/=]+)"',p.read_text())
              assert m,p
              parts.append(m.group(1)); part_files.append(p)
          html=gzip.decompress(base64.b64decode(''.join(parts))).decode()

          replacements={
            "data.accounts.find(z=>z.id===x.dataset.brief)":"data.accounts.find(z=>String(z.id)===String(x.dataset.brief))",
            "data.accounts.find(a=>a.id===x.dataset.editAccount)":"data.accounts.find(a=>String(a.id)===String(x.dataset.editAccount))",
            "data.accounts.find(a=>a.id===x.dataset.addContact)":"data.accounts.find(a=>String(a.id)===String(x.dataset.addContact))",
            "data.accounts.find(a=>a.id===x.dataset.addMeeting)":"data.accounts.find(a=>String(a.id)===String(x.dataset.addMeeting))",
            "data.accounts.find(a=>a.id===x.dataset.addNote)":"data.accounts.find(a=>String(a.id)===String(x.dataset.addNote))",
            "data.accounts.find(a=>a.id===x.dataset.addSuccess)":"data.accounts.find(a=>String(a.id)===String(x.dataset.addSuccess))",
            "data.accounts.find(x=>x.id===aid)":"data.accounts.find(x=>String(x.id)===String(aid))",
            "data.accounts.find(x=>x.id===selected)":"data.accounts.find(x=>String(x.id)===String(selected))",
          }
          counts={}
          for old,new in replacements.items():
              n=html.count(old); counts[old]=n
              assert n>=1, f'expected inherited ID comparison not found: {old}'
              html=html.replace(old,new)
          print('patched comparisons:',counts)

          # Record IDs generated by uid() are strings, but normalize deletion too so
          # all data-* boundary comparisons are type-safe and future-proof.
          old="a[prop]=a[prop].filter(x=>x.id!==rid)"
          if old in html:
              html=html.replace(old,"a[prop]=a[prop].filter(x=>String(x.id)!==String(rid))")

          forbidden=[
            "data.accounts.find(z=>z.id===x.dataset.brief)",
            "data.accounts.find(a=>a.id===x.dataset.editAccount)",
            "data.accounts.find(a=>a.id===x.dataset.addContact)",
            "data.accounts.find(a=>a.id===x.dataset.addMeeting)",
            "data.accounts.find(a=>a.id===x.dataset.addNote)",
            "data.accounts.find(a=>a.id===x.dataset.addSuccess)",
            "data.accounts.find(x=>x.id===aid)",
            "data.accounts.find(x=>x.id===selected)",
          ]
          for f in forbidden: assert f not in html,f
          assert "data.accounts.find(x=>String(x.id)===String(selected))" in html
          assert "data.accounts.find(z=>String(z.id)===String(x.dataset.brief))" in html
          assert "data.accounts.find(a=>String(a.id)===String(x.dataset.addContact))" in html

          encoded=base64.b64encode(gzip.compress(html.encode(),compresslevel=9,mtime=0)).decode()
          size=math.ceil(len(encoded)/5)
          chunks=[encoded[i*size:(i+1)*size] for i in range(5)]
          assert ''.join(chunks)==encoded and all(chunks)
          for i,(p,chunk) in enumerate(zip(part_files,chunks),1):
              p.write_text(f'export const PART_{i} = "{chunk}";\n')
          print('new bundle length',len(encoded),'chunks',[len(c) for c in chunks])
          PY

          node --check abc/src/app.js
          node abc/tests/smoke.mjs
          node abc/tests/auth-roundtrip.mjs
          python3 abc/tests/regression.py
          python3 tests/validate_crm_analytics.py

          python3 - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          parts=[]
          for p in sorted(Path('abc/src').glob('app-part*.js')):
              parts.append(re.search(r'"([A-Za-z0-9+/=]+)"',p.read_text()).group(1))
          html=gzip.decompress(base64.b64decode(''.join(parts))).decode()
          for required in [
            'data.accounts.find(x=>String(x.id)===String(selected))',
            'data.accounts.find(z=>String(z.id)===String(x.dataset.brief))',
            'data.accounts.find(a=>String(a.id)===String(x.dataset.editAccount))',
            'data.accounts.find(a=>String(a.id)===String(x.dataset.addContact))',
            'data.accounts.find(a=>String(a.id)===String(x.dataset.addMeeting))',
            'data.accounts.find(a=>String(a.id)===String(x.dataset.addNote))',
            'data.accounts.find(a=>String(a.id)===String(x.dataset.addSuccess))',
            'data.accounts.find(x=>String(x.id)===String(aid))',
          ]: assert required in html,required
          print('PASS: ABC browser data-* account ID comparisons are type-safe')
          PY
      - name: Commit fixed ABC bundle
        run: |
          set -euo pipefail
          if git diff --quiet -- abc/src/app-part1.js abc/src/app-part2.js abc/src/app-part3.js abc/src/app-part4.js abc/src/app-part5.js; then
            echo "No bundle changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add abc/src/app-part1.js abc/src/app-part2.js abc/src/app-part3.js abc/src/app-part4.js abc/src/app-part5.js
          git commit -m "Fix ABC account workspace ID handling"
          git push origin HEAD:main
