name: Extract ABC Handler Small

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-abc-handler-small.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract only account click handler neighborhoods
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          parts=[]
          for p in sorted(Path('abc/src').glob('app-part*.js')):
              m=re.search(r'"([A-Za-z0-9+/=]+)"',p.read_text()); assert m
              parts.append(m.group(1))
          html=gzip.decompress(base64.b64decode(''.join(parts))).decode()
          script=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)[0]
          out=[]
          pats=[r'data-open',r'closest\(',r'addEventListener\(',r'dataset\.open',r'getAttribute\(["\']data-open',r'selected\s*=']
          for pat in pats:
              hits=list(re.finditer(pat,script,re.I))
              out.append(f'## {pat} count={len(hits)}')
              for n,m in enumerate(hits[-8:]):
                  a=max(0,m.start()-1200); b=min(len(script),m.start()+2600)
                  out.append(f'\n### hit {n} at {m.start()}\n{script[a:b]}\n')
          Path('.debug/abc-handler-small.txt').write_text('\n'.join(out))
          PY
          wc -c .debug/abc-handler-small.txt
      - name: Commit small handler extract
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .debug/abc-handler-small.txt
          git commit -m "Extract concise ABC account handler"
          git push origin HEAD:main
