name: Deploy ZS Post-Sales Operations

on:
  push:
    branches: [main]
    paths:
      - "zscaler/**"
      - ".github/workflows/deploy-zscaler-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zscaler-post-sales-operations
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zscaler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker and app bundle
        run: |
          node --check src/index.js
          node --check src/app.js
          node tests/smoke.mjs
          python3 tests/regression.py
      - name: Exercise exact DTEX client login gate
        run: node tests/auth-roundtrip.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy private post-sales operations Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd zscaler

      - name: Verify both custom-domain bindings without mutating DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for host in zsc.clintware.com zc.clintware.com; do
            response=$(curl --fail-with-body -sS \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=${host}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            HOST="$host" python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True and len(r)==1, d; x=r[0]; assert x.get("hostname")==os.environ["HOST"] and x.get("service")=="zscaler-cs-business-operations", x; print("Stable custom domain verified:", x["hostname"], "->", x["service"])' <<< "$response"
          done

      - name: Verify public DNS on Cloudflare and Google resolvers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null
          for host in zsc.clintware.com zc.clintware.com; do
            cf=""
            gg=""
            for i in $(seq 1 20); do
              cf=$(dig +short @1.1.1.1 "$host" A | head -n1)
              gg=$(dig +short @8.8.8.8 "$host" A | head -n1)
              if [ -n "$cf" ] && [ -n "$gg" ]; then
                echo "$host public DNS resolved: Cloudflare=$cf Google=$gg"
                break
              fi
              if [ "$i" = 20 ]; then
                echo "$host did not resolve on both public DNS resolvers" >&2
                exit 1
              fi
              sleep 3
            done
          done

      - name: Wait for DTEX gate runtime on both hostnames
        run: |
          set -euo pipefail
          for host in zsc.clintware.com zc.clintware.com; do
            ready=0
            for i in $(seq 1 24); do
              body=$(curl -sS --connect-timeout 5 --max-time 20 "https://${host}/" || true)
              health=$(curl -sS --connect-timeout 5 --max-time 20 "https://${host}/health" || true)
              auth=$(curl -sS --connect-timeout 5 --max-time 20 "https://${host}/health/auth" || true)
              if grep -Fq "Restricted preview" <<< "$body" \
                && grep -Fq "Private Customer Success Demo" <<< "$body" \
                && grep -Fq "Unlock demo" <<< "$body" \
                && grep -Fq "Command Center" <<< "$body" \
                && grep -Fq "Seed Demo Accounts" <<< "$body" \
                && grep -Fq "SESSION_KEY='summertime_demo_access'" <<< "$body" \
                && grep -Fq "pw.value===PASS" <<< "$body" \
                && grep -Fq '"ok":true' <<< "$health" \
                && grep -Fq '"ok":true' <<< "$auth" \
                && grep -Fq '"app":true' <<< "$auth" \
                && grep -Fq '"gate":true' <<< "$auth" \
                && grep -Fq '"mode":"dtex-client-gate"' <<< "$auth"; then
                ready=1
                echo "$host is serving the DTEX client-side gate and full app"
                break
              fi
              echo "Waiting for DTEX gate propagation on $host (attempt $i/24)"
              sleep 5
            done
            if [ "$ready" != "1" ]; then
              echo "$host never served the expected DTEX gate/runtime" >&2
              exit 1
            fi
            post_code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "https://${host}/login")
            test "$post_code" = "405"
          done

      - name: Render DTEX gate in Chrome on both hostnames
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          for host in zsc.clintware.com zc.clintware.com; do
            chrome_file="/tmp/$(echo "$host" | tr '.' '-')-chrome.html"
            "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3000 --dump-dom "https://${host}/" > "$chrome_file"
            grep -Fq "Restricted preview" "$chrome_file"
            grep -Fq "Unlock demo" "$chrome_file"
            grep -Fq 'id="pw"' "$chrome_file"
            echo "Chrome rendered DTEX gate on $host"
          done

      - name: Exercise exact DTEX password and rendered app in real Chrome on both hostnames
        run: |
          set -euo pipefail
          mkdir -p /tmp/zsc-playwright
          cd /tmp/zsc-playwright
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core >/dev/null 2>&1
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          cat > test.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME, args:['--no-sandbox','--disable-dev-shm-usage']});
          for (const host of ['zsc.clintware.com','zc.clintware.com']) {
            const page = await browser.newPage();
            let ready = false;
            for (let attempt = 1; attempt <= 15; attempt++) {
              const pageErrors = [];
              const onError = e => pageErrors.push(String(e));
              page.on('pageerror', onError);
              await page.goto(`https://${host}/?e2e=${Date.now()}`, {waitUntil:'domcontentloaded', timeout:30000});
              const gateCount = await page.locator('#gate').count();
              const appCount = await page.locator('#app').count();
              const appText = appCount ? ((await page.locator('#app').textContent()) || '') : '';
              page.off('pageerror', onError);
              if (gateCount === 1 && appCount === 1 && pageErrors.length === 0 && appText.includes('Command Center') && appText.includes('Accounts')) {
                ready = true;
                console.log(`${host}: rendered app is ready for login test on attempt ${attempt}`);
                break;
              }
              console.log(`${host}: waiting for rendered app propagation, attempt ${attempt}/15, errors=${JSON.stringify(pageErrors)}, appTextLength=${appText.length}`);
              await page.waitForTimeout(5000);
            }
            if (!ready) throw new Error(`${host}: rendered app never became browser-ready`);

            await page.fill('#pw','wrong-password');
            await page.click('#access-form button[type="submit"]');
            if ((await page.textContent('#gate-error')) !== 'Incorrect password.') throw new Error(`${host}: wrong-password behavior failed`);
            if (await page.evaluate(() => document.body.classList.contains('unlocked'))) throw new Error(`${host}: wrong password unlocked the app`);

            await page.fill('#pw','2$C@L3RK0S$H2026');
            await page.click('#access-form button[type="submit"]');
            await page.waitForFunction(() => document.body.classList.contains('unlocked'));
            const appVisible = await page.locator('#app').evaluate(el => getComputedStyle(el).display !== 'none');
            if (!appVisible) throw new Error(`${host}: app did not become visible`);
            const appText = (await page.locator('#app').textContent()) || '';
            if (!appText.includes('Command Center') || !appText.includes('Accounts')) throw new Error(`${host}: unlocked app content missing`);

            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(() => document.body.classList.contains('unlocked'));
            const stillVisible = await page.locator('#app').evaluate(el => getComputedStyle(el).display !== 'none');
            if (!stillVisible) throw new Error(`${host}: app hidden after same-tab reload`);
            const refreshText = (await page.locator('#app').textContent()) || '';
            if (!refreshText.includes('Command Center') || !refreshText.includes('Accounts')) throw new Error(`${host}: app content missing after reload`);
            console.log(`${host}: exact DTEX wrong-password + correct-password + app render + refresh flow passed in Chrome`);
            await page.close();
          }
          await browser.close();
          NODE
          CHROME="$chrome" node test.mjs
