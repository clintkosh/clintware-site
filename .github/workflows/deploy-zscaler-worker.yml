name: Deploy ZS Post-Sales Operations

on:
  push:
    branches: [main]
    paths:
      - "zscaler/**"
      - ".github/workflows/deploy-zscaler-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zscaler-post-sales-operations
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zscaler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker and app bundle
        run: |
          node --check src/worker.js
          node --check src/app.js
          node tests/smoke.mjs
          python3 tests/regression.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy private post-sales operations Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd zscaler
      - name: Attach zs.clintware.com custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"hostname":"zs.clintware.com","service":"zscaler-cs-business-operations"}')
          echo "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("success") is True, data; print("Custom domain attached:", data["result"]["hostname"])'
      - name: Verify private login gate over HTTPS
        run: |
          set -euo pipefail
          body=$(curl --fail-with-body -sS --retry 12 --retry-delay 5 --retry-all-errors https://zs.clintware.com/)
          grep -Fq "Private Business Operations Command Center" <<< "$body"
          grep -Fq "Synthetic data only" <<< "$body"
          if grep -Fq "POST-SALES OPS" <<< "$body"; then
            echo "Authenticated workspace leaked through public gate" >&2
            exit 1
          fi
          curl --fail-with-body -sS --retry 5 --retry-delay 2 https://zs.clintware.com/health | grep -Fq '"ok":true'
          echo "Live HTTPS gate and health endpoint verified"
