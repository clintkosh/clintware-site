name: Deploy ZS Post-Sales Operations

on:
  push:
    branches: [main]
    paths:
      - "zscaler/**"
      - ".github/workflows/deploy-zscaler-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zscaler-post-sales-operations
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zscaler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply Gainsight-default Zscaler health/P1 layer
        run: python3 patch_gainsight_p1.py
      - name: Validate Worker and app bundle
        run: |
          node --check src/index.js
          node --check src/app.js
          grep -q "zsc-track-page-prelude" src/index.js
          grep -q "Defaulted to Gainsight-style Customer Success health practices except where overridden by Zscaler priorities" src/index.js
          grep -q "adoption:20,value:20,relationship:15,technical:25,supportRisk:15,successPlan:5" src/index.js
          node tests/smoke.mjs
          python3 tests/regression.py
          python3 ../tests/validate_crm_analytics.py
      - name: Exercise exact DTEX client login gate
        run: node tests/auth-roundtrip.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply verified Gainsight-default Zscaler health/P1 layer
        run: python3 zscaler/patch_gainsight_p1.py

      - name: Deploy private post-sales operations Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd zscaler

      - name: Verify both custom-domain bindings without mutating DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for host in zsc.clintware.com zc.clintware.com; do
            response=$(curl --fail-with-body -sS \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=${host}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            HOST="$host" python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True and len(r)==1, d; x=r[0]; assert x.get("hostname")==os.environ["HOST"] and x.get("service")=="zscaler-cs-business-operations", x; print("Stable custom domain verified:", x["hostname"], "->", x["service"])' <<< "$response"
          done

      - name: Verify public DNS on Cloudflare and Google resolvers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null
          for host in zsc.clintware.com zc.clintware.com; do
            cf=""
            gg=""
            for i in $(seq 1 20); do
              cf=$(dig +short @1.1.1.1 "$host" A | head -n1)
              gg=$(dig +short @8.8.8.8 "$host" A | head -n1)
              if [ -n "$cf" ] && [ -n "$gg" ]; then
                echo "$host public DNS resolved: Cloudflare=$cf Google=$gg"
                break
              fi
              if [ "$i" = 20 ]; then
                echo "$host did not resolve on both public DNS resolvers" >&2
                exit 1
              fi
              sleep 3
            done
          done

      - name: Wait for Gainsight/Zscaler runtime on both hostnames
        run: |
          set -euo pipefail
          for host in zsc.clintware.com zc.clintware.com; do
            ready=0
            for i in $(seq 1 24); do
              body=$(curl -sS --connect-timeout 5 --max-time 20 "https://${host}/" || true)
              health=$(curl -sS --connect-timeout 5 --max-time 20 "https://${host}/health" || true)
              auth=$(curl -sS --connect-timeout 5 --max-time 20 "https://${host}/health/auth" || true)
              if grep -Fq "Restricted preview" <<< "$body" \
                && grep -Fq "Private Customer Success Demo" <<< "$body" \
                && grep -Fq "Unlock demo" <<< "$body" \
                && grep -Fq "Command Center" <<< "$body" \
                && grep -Fq "Seed Demo Accounts" <<< "$body" \
                && grep -Fq "abc-health-p1-script" <<< "$body" \
                && grep -Fq "Gainsight-style Customer Success health practices" <<< "$body" \
                && grep -Fq "zsc-track-page-prelude" <<< "$body" \
                && grep -Fq '"ok":true' <<< "$health" \
                && grep -Fq '"ok":true' <<< "$auth" \
                && grep -Fq '"app":true' <<< "$auth" \
                && grep -Fq '"gate":true' <<< "$auth" \
                && grep -Fq '"mode":"dtex-client-gate"' <<< "$auth"; then
                ready=1
                echo "$host is serving the corrected Zscaler client gate and health model"
                break
              fi
              echo "Waiting for corrected Zscaler runtime on $host (attempt $i/24)"
              sleep 5
            done
            if [ "$ready" != "1" ]; then
              echo "$host never served the expected corrected runtime" >&2
              exit 1
            fi
            post_code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "https://${host}/login")
            test "$post_code" = "405"
          done

      - name: Exercise live login, scoring, Settings and P1 surface in Chrome
        run: |
          set -euo pipefail
          mkdir -p /tmp/zsc-playwright
          cd /tmp/zsc-playwright
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core >/dev/null 2>&1
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          export ZSC_PASS="$(python3 -c 'import os,re; s=open(os.path.join(os.environ["GITHUB_WORKSPACE"],"zscaler/src/index.js")).read(); m=re.search(r"const PASS=\x27([^\x27]+)\x27",s); assert m; print(m.group(1))')"
          cat > test.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME, args:['--no-sandbox','--disable-dev-shm-usage']});
          for (const host of ['zsc.clintware.com','zc.clintware.com']) {
            const page = await browser.newPage(); page.setDefaultTimeout(20000); const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e)));
            let ready=false;
            for(let attempt=1;attempt<=20;attempt++){
              await page.goto(`https://${host}/?e2e=${Date.now()}-${attempt}`,{waitUntil:'domcontentloaded',timeout:30000});
              if(await page.locator('#abc-health-p1-script').count() && await page.locator('#zsc-track-page-prelude').count()){ready=true;break}
              await page.waitForTimeout(3000);
            }
            if(!ready)throw new Error(`${host}: corrected runtime never reached browser`);
            await page.waitForFunction(()=>typeof document.querySelector('#access-form')?.onsubmit==='function');
            await page.fill('#pw','wrong-password');await page.click('#access-form button[type="submit"]');if((await page.textContent('#gate-error'))!=='Incorrect password.')throw new Error(`${host}: wrong-password behavior failed`);
            await page.fill('#pw',process.env.ZSC_PASS);await page.click('#access-form button[type="submit"]');await page.waitForFunction(()=>document.body.classList.contains('unlocked'));
            await page.waitForFunction(()=>{try{const d=JSON.parse(localStorage.getItem('zs_ops_dtex_model_v2'));return d?.accounts?.length===20&&d?.settings?.healthWeights}catch(e){return false}},{timeout:30000});
            let d=await page.evaluate(()=>JSON.parse(localStorage.getItem('zs_ops_dtex_model_v2')));
            if(JSON.stringify(d.settings.healthWeights)!==JSON.stringify({adoption:20,value:20,relationship:15,technical:25,supportRisk:15,successPlan:5}))throw new Error(`${host}: company override weights wrong`);
            await page.locator('.topnav [data-route="settings"]').click();const txt=await page.locator('#app').innerText();if(!txt.includes('Defaulted to Gainsight-style Customer Success health practices except where overridden by Zscaler priorities'))throw new Error(`${host}: model provenance note missing`);if((await page.locator('.abc-health-weight').count())!==6)throw new Error(`${host}: adjustable health settings missing`);
            await page.locator('.topnav [data-route="accounts"]').click();d=await page.evaluate(()=>JSON.parse(localStorage.getItem('zs_ops_dtex_model_v2')));const id=d.accounts[0].id;await page.locator(`[data-open="${id}"]`).first().click();await page.locator('[data-edit-account]').click();if(await page.locator('#f-health').count())throw new Error(`${host}: manual Health field still present`);if(!(await page.locator('#f-adoption').count()))throw new Error(`${host}: Adoption input missing`);await page.click('[data-close]');
            for(const sel of ['[data-add-risk]','[data-add-contact]','[data-add-success]','[data-add-meeting]','[data-add-note]','[data-edit-technical]','[data-edit-commercial]']){for(const tab of ['summary','stakeholders','success','meetings','notes','technical','commercial']){await page.locator(`[data-tab="${tab}"]`).first().click();if(await page.locator(sel).count())break}if(!(await page.locator(sel).count()))throw new Error(`${host}: missing P1 control ${sel}`)}
            if(pageErrors.length)throw new Error(`${host}: browser errors ${pageErrors.join(' | ')}`);
            console.log(`${host}: exact login + calculated health settings + P1 surface passed`);await page.close();
          }
          await browser.close();
          NODE
          CHROME="$chrome" node test.mjs
