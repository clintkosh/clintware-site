name: Deploy ZS Post-Sales Operations

on:
  push:
    branches: [main]
    paths:
      - "zscaler/**"
      - ".github/workflows/deploy-zscaler-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zscaler-post-sales-operations
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zscaler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker and app bundle
        run: |
          node --check src/worker.js
          node --check src/app.js
          node tests/smoke.mjs
          python3 tests/regression.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy private post-sales operations Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd zscaler
      - name: Verify existing zs.clintware.com custom-domain binding without mutating DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=zs.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True and len(r)==1, d; x=r[0]; assert x.get("hostname")=="zs.clintware.com" and x.get("service")=="zscaler-cs-business-operations", x; print("Stable custom domain verified:", x["hostname"], "->", x["service"])'
      - name: Verify private login gate and auth runtime over HTTPS
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            body=$(curl --fail-with-body -sS https://zs.clintware.com/ || true)
            health=$(curl --fail-with-body -sS https://zs.clintware.com/health || true)
            auth=$(curl --fail-with-body -sS https://zs.clintware.com/health/auth || true)
            if grep -Fq "Open the operating platform" <<< "$body" \
              && grep -Fq "Synthetic data only" <<< "$body" \
              && grep -Fq '"ok":true' <<< "$health" \
              && grep -Fq '"ok":true' <<< "$auth" \
              && grep -Fq '"session":true' <<< "$auth" \
              && grep -Fq '"app":true' <<< "$auth"; then
              echo "Live DNS, HTTPS gate, session signer, and app runtime verified"
              exit 0
            fi
            echo "Waiting for live custom domain after Worker deploy (attempt $i/20)"
            sleep 3
          done
          echo "Live domain/runtime verification failed" >&2
          exit 1
