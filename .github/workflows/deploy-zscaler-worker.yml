name: Deploy ZS Post-Sales Operations

on:
  push:
    branches: [main]
    paths:
      - "zscaler/**"
      - ".github/workflows/deploy-zscaler-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zscaler-post-sales-operations
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zscaler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker and app bundle
        run: |
          node --check src/index.js
          node --check src/app.js
          node tests/smoke.mjs
          python3 tests/regression.py
      - name: Exercise exact working CRM login flow with disposable password
        run: node tests/auth-roundtrip.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy private post-sales operations Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --cwd zscaler

      - name: Verify stable zsc.clintware.com binding without mutating DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=zsc.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True and len(r)==1, d; x=r[0]; assert x.get("hostname")=="zsc.clintware.com" and x.get("service")=="zscaler-cs-business-operations", x; print("Stable custom domain verified:", x["hostname"], "->", x["service"])'

      - name: Ensure zc.clintware.com copy binding exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          current=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=zc.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          state=$(echo "$current" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True, d; r=d.get("result",[]); print("missing" if len(r)==0 else ("same" if len(r)==1 and r[0].get("service")=="zscaler-cs-business-operations" else "conflict"))')
          if [ "$state" = "missing" ]; then
            curl --fail-with-body -sS -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"hostname":"zc.clintware.com","service":"zscaler-cs-business-operations"}' >/tmp/zc-domain.json
            python3 - <<'PY'
import json
with open('/tmp/zc-domain.json') as f:
    d=json.load(f)
assert d.get('success') is True, d
print('Created zc.clintware.com -> zscaler-cs-business-operations')
PY
          elif [ "$state" = "same" ]; then
            echo "zc.clintware.com is already attached to zscaler-cs-business-operations; no DNS mutation performed"
          else
            echo "zc.clintware.com already exists on a different Worker; refusing to overwrite it" >&2
            exit 1
          fi

      - name: Verify zc.clintware.com binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            response=$(curl --fail-with-body -sS \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=zc.clintware.com" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            if echo "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",[]); assert d.get("success") is True; assert len(r)==1; assert r[0].get("hostname")=="zc.clintware.com" and r[0].get("service")=="zscaler-cs-business-operations"' 2>/dev/null; then
              echo "zc.clintware.com custom domain binding verified"
              break
            fi
            if [ "$i" = 20 ]; then
              echo "zc.clintware.com custom-domain binding did not stabilize" >&2
              exit 1
            fi
            sleep 3
          done

      - name: Verify legacy zs.clintware.com binding is gone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=zs.clintware.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True, d; r=d.get("result",[]); assert len(r)==0, r; print("Legacy zs.clintware.com binding removed")'

      - name: Verify public DNS on Cloudflare and Google resolvers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null
          for host in zsc.clintware.com zc.clintware.com; do
            cf=""
            gg=""
            for i in $(seq 1 20); do
              cf=$(dig +short @1.1.1.1 "$host" A | head -n1)
              gg=$(dig +short @8.8.8.8 "$host" A | head -n1)
              if [ -n "$cf" ] && [ -n "$gg" ]; then
                echo "$host public DNS resolved: Cloudflare=$cf Google=$gg"
                break
              fi
              if [ "$i" = 20 ]; then
                echo "$host did not resolve on both public DNS resolvers" >&2
                exit 1
              fi
              sleep 3
            done
          done

      - name: Verify HTTPS and direct-render login mode on both hostnames
        run: |
          set -euo pipefail
          for host in zsc.clintware.com zc.clintware.com; do
            body=$(curl --fail-with-body -sS --connect-timeout 5 --max-time 15 "https://${host}/")
            health=$(curl --fail-with-body -sS --connect-timeout 5 --max-time 15 "https://${host}/health")
            auth=$(curl --fail-with-body -sS --connect-timeout 5 --max-time 15 "https://${host}/health/auth")
            grep -Fq "Open the operating platform" <<< "$body"
            grep -Fq "Synthetic data only" <<< "$body"
            grep -Fq '"ok":true' <<< "$health"
            grep -Fq '"ok":true' <<< "$auth"
            grep -Fq '"app":true' <<< "$auth"
            grep -Fq '"mode":"crm-direct-render"' <<< "$auth"
            bad_code=$(curl -sS -o "/tmp/${host//./-}-bad-login.html" -w '%{http_code}' \
              -X POST "https://${host}/login" \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode 'password=definitely-not-the-password')
            test "$bad_code" = "401"
            grep -Fq "Access denied" "/tmp/${host//./-}-bad-login.html"
            echo "$host HTTPS, runtime, and login rejection path verified"
          done

      - name: Render both production hostnames in Chrome
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          for host in zsc.clintware.com zc.clintware.com; do
            "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3000 --dump-dom "https://${host}/" > "/tmp/${host//./-}-chrome.html"
            grep -Fq "Open the operating platform" "/tmp/${host//./-}-chrome.html"
            grep -Fq "Private review access" "/tmp/${host//./-}-chrome.html"
            echo "Chrome rendered $host successfully"
          done
