name: Configure Mary Kosh Clintware Email Routing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-marykosh-email.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DOMAIN: clintware.com
      SOURCE_ADDRESS: marykosh@clintware.com
      DESTINATION_ADDRESS: clint.kosh@gmail.com
    steps:
      - name: Configure Cloudflare Email Routing rule
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["CLOUDFLARE_API_TOKEN"]
          domain = os.environ["DOMAIN"]
          source = os.environ["SOURCE_ADDRESS"]
          destination = os.environ["DESTINATION_ADDRESS"]
          base = "https://api.cloudflare.com/client/v4"

          def request(method, path, body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(
                  base + path,
                  data=data,
                  method=method,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      payload = json.load(resp)
              except urllib.error.HTTPError as exc:
                  text = exc.read().decode("utf-8", errors="replace")
                  print(f"Cloudflare API HTTP {exc.code}: {text}")
                  sys.exit(1)
              if not payload.get("success"):
                  print("Cloudflare API error:", json.dumps(payload.get("errors", [])))
                  sys.exit(1)
              return payload.get("result")

          zones = request("GET", "/zones?" + urllib.parse.urlencode({"name": domain}))
          if not zones:
              print(f"Zone not found: {domain}")
              sys.exit(1)
          zone_id = zones[0]["id"]
          print(f"Found zone {domain}.")

          rules = request("GET", f"/zones/{zone_id}/email/routing/rules")
          existing = None
          for rule in rules:
              for matcher in rule.get("matchers", []):
                  if matcher.get("type") == "literal" and matcher.get("field") == "to" and matcher.get("value", "").lower() == source.lower():
                      existing = rule
                      break
              if existing:
                  break

          desired = {
              "name": f"Forward {source} to {destination}",
              "enabled": True,
              "matchers": [{"type": "literal", "field": "to", "value": source}],
              "actions": [{"type": "forward", "value": [destination]}],
          }

          if existing:
              current_targets = []
              for action in existing.get("actions", []):
                  if action.get("type") == "forward":
                      current_targets.extend(action.get("value") or [])
              if existing.get("enabled") and [x.lower() for x in current_targets] == [destination.lower()]:
                  print(f"Routing rule already correct: {source} -> {destination}")
              else:
                  request("PUT", f"/zones/{zone_id}/email/routing/rules/{existing['id']}", desired)
                  print(f"Updated routing rule: {source} -> {destination}")
          else:
              request("POST", f"/zones/{zone_id}/email/routing/rules", desired)
              print(f"Created routing rule: {source} -> {destination}")

          print("ROUTING_CONFIGURED=true")
          PY
