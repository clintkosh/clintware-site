name: Verify Stable DTEX Gainsight P1 v2
on:
  push:
    branches: [main]
    paths: [".github/workflows/verify-dtex-gainsight-stable-v2.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify already-deployed DTEX production page
        run: |
          set -euo pipefail
          mkdir -p /tmp/dtex-v2 && cd /tmp/dtex-v2
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core >/dev/null 2>&1
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          export DTEX_PASS="$(python3 -c 'import os,re; s=open(os.path.join(os.environ["GITHUB_WORKSPACE"],"public/summertime-crmdemo/index.html")).read(); m=re.search(r"const PASS=\x27([^\x27]+)\x27",s); assert m; print(m.group(1))')"
          cat > verify.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const url='https://clintkosh.github.io/clintware-site/summertime-crmdemo/';const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});const page=await browser.newPage();page.setDefaultTimeout(20000);const errors=[];page.on('pageerror',e=>errors.push(e.message));
          await page.goto(url+'?v2='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});await page.waitForSelector('#dtex-gainsight-p1-script',{state:'attached'});await page.waitForSelector('#dtex-p1-edit-parity',{state:'attached'});await page.fill('#pw',process.env.DTEX_PASS);await page.click('#access-form button[type="submit"]');await page.waitForFunction(()=>document.body.classList.contains('unlocked'));
          const openSec=async name=>{const d=page.locator('#drawer-body details.section').filter({has:page.locator('summary',{hasText:name})}).first();if(!(await d.evaluate(el=>el.open)))await d.locator('summary').click();return d};
          const views=await page.locator('.nav [data-view]').evaluateAll(ns=>ns.map(n=>n.dataset.view));for(const v of views){await page.click(`.nav [data-view="${v}"]`);if(!(await page.locator('#lock:visible').count()))throw new Error('Lock missing on '+v)}
          await page.click('.nav [data-view="healthsettings"]');const basis=await page.locator('#dtex-health-settings-body').innerText();if(!basis.includes('Defaulted to Gainsight-style Customer Success health practices except where overridden by DTEX priorities'))throw new Error('basis note missing');const weights=await page.locator('.dtex-health-weight').evaluateAll(ns=>Object.fromEntries(ns.map(n=>[n.dataset.healthKey,Number(n.value)])));if(JSON.stringify(weights)!==JSON.stringify({adoption:20,value:20,relationship:15,technical:25,supportRisk:10,successPlan:10}))throw new Error('defaults wrong '+JSON.stringify(weights));if((await page.locator('#dtex-health-total').innerText()).trim()!=='100')throw new Error('weights do not total 100');
          const logic=await page.evaluate(()=>{const a=accounts[0],w={adoption:20,value:20,relationship:15,technical:25,supportRisk:10,successPlan:10},cl=v=>Math.max(0,Math.min(100,Math.round(Number(v)||0))),ms=allMeetings(a).filter(m=>m.date).sort((x,y)=>String(y.date).localeCompare(String(x.date)));let rec=35;if(ms.length){const days=Math.max(0,Math.ceil((Date.now()-new Date(ms[0].date+'T12:00:00').getTime())/86400000));rec=days<=30?100:days<=60?85:days<=90?70:days<=120?55:40}const relationship=cl(cl(a.stakeholder)*.60+rec*.25+(allPeople(a).some(p=>/executive sponsor|ciso|security vp/i.test((p.role||'')+' '+(p.lane||'')))?100:40)*.15),sev=String(a.supportSev||'None').toLowerCase(),pen=sev.includes('sev 1')?25:sev.includes('sev 2')?15:sev.includes('sev 3')?7:sev.includes('sev 4')?3:0,supportRisk=cl(cl(a.support)-pen),successPlan=a.goals?.length?cl(a.goals.reduce((s,g)=>s+cl(g.progress),0)/a.goals.length):50,sig={adoption:cl(a.adoption),value:cl(a.value),relationship,technical:cl(a.coverage),supportRisk,successPlan},expected=cl(Object.keys(w).reduce((s,k)=>s+sig[k]*w[k],0)/100);return{stored:a.health,expected}});if(logic.stored!==logic.expected)throw new Error('formula mismatch '+JSON.stringify(logic));
          await page.locator('[data-health-key="adoption"]').fill('25');await page.locator('[data-health-key="value"]').fill('15');await page.click('#dtex-save-health');let st=JSON.parse(await page.evaluate(()=>localStorage.getItem('dtex_health_settings_v2')));if(st.weights.adoption!==25||st.weights.value!==15)throw new Error('settings save failed');await page.click('#dtex-reset-health');
          await page.click('.nav [data-view="accounts"]');const row=page.locator('tr.account-row').first(),id=await row.getAttribute('data-id');await row.click();await page.waitForSelector('#account-drawer.open');
          await openSec('Technical lifecycle');await page.fill('#dtex-t-coverage','73');await page.fill('#dtex-t-support','89');await page.fill('#dtex-t-sev','Sev 3');await page.click('[data-save-dtex-technical]');let ov=JSON.parse(await page.evaluate(()=>localStorage.getItem('dtex_account_overrides_v2')));if(ov[id].coverage!==73||ov[id].support!==89)throw new Error('technical save failed');
          await openSec('Commercial record');await page.fill('#dtex-c-adoption','82');await page.fill('#dtex-c-value','79');await page.fill('#dtex-c-stakeholder','77');await page.fill('#dtex-c-commercial','66');await page.click('[data-save-dtex-commercial]');ov=JSON.parse(await page.evaluate(()=>localStorage.getItem('dtex_account_overrides_v2')));if(ov[id].adoption!==82||ov[id].value!==79||ov[id].stakeholder!==77||ov[id].commercial!==66)throw new Error('commercial/value save failed');
          await openSec('Success plan');await page.fill('#dtex-goal-name','V2 objective');await page.fill('#dtex-goal-progress','30');await page.fill('#dtex-goal-owner','CSM + Customer');await page.fill('#dtex-goal-proof','Evidence');await page.click('[data-save-dtex-goal]');ov=JSON.parse(await page.evaluate(()=>localStorage.getItem('dtex_account_overrides_v2')));let gi=ov[id].goals.findIndex(g=>g.name==='V2 objective');if(gi<0)throw new Error('goal add failed');await page.locator(`[data-edit-dtex-goal="${id}:${gi}"]`).click();await page.fill('#dtex-goal-progress','75');await page.click('[data-save-dtex-goal]');ov=JSON.parse(await page.evaluate(()=>localStorage.getItem('dtex_account_overrides_v2')));gi=ov[id].goals.findIndex(g=>g.name==='V2 objective');if(ov[id].goals[gi].progress!==75)throw new Error('goal edit failed');await page.locator(`[data-del-dtex-goal="${id}:${gi}"]`).click();
          await openSec('Account notes');await page.fill('#account-note-text','V2 note');await page.click(`[data-add-note="${id}"]`);await page.locator(`[data-edit-note^="${id}:"]`).last().click();await page.fill('#account-note-text','V2 note edited');await page.click(`[data-update-note^="${id}:"]`);if(!(await page.locator('#drawer-body').innerText()).includes('V2 note edited'))throw new Error('note edit failed');await page.locator(`[data-del-note^="${id}:"]`).last().click();
          await openSec('Meeting log');await page.fill('#meeting-type','V2 EBR');await page.fill('#meeting-attendees','CISO, CSM');await page.fill('#meeting-notes','Initial');await page.click(`[data-add-meeting="${id}"]`);await page.locator(`[data-edit-meeting^="${id}:"]`).last().click();await page.fill('#meeting-notes','Edited');await page.click(`[data-update-meeting^="${id}:"]`);if(!(await page.locator('#drawer-body').innerText()).includes('Edited'))throw new Error('meeting edit failed');await page.locator(`[data-del-meeting^="${id}:"]`).last().click();
          await openSec('Employees & stakeholder map');await page.fill('#person-name','V2 Stakeholder');await page.fill('#person-role','Director');await page.fill('#person-lane','Champion');await page.click(`[data-add-person="${id}"]`);await page.locator(`[data-edit-person^="${id}:"]`).last().click();await page.fill('#person-role','VP Security');await page.click(`[data-update-person^="${id}:"]`);if(!(await page.locator('#drawer-body').innerText()).includes('VP Security'))throw new Error('stakeholder edit failed');await page.locator(`[data-del-person^="${id}:"]`).last().click();
          await page.click('#drawer-close');for(const v of views){await page.click(`.nav [data-view="${v}"]`);await page.waitForTimeout(20)}const paths=await page.evaluate(()=>(window.dataLayer||[]).map(x=>{try{return Array.from(x)}catch(e){return x}}).filter(x=>Array.isArray(x)&&x[0]==='event'&&x[1]==='page_view').map(x=>x[2]?.page_path).filter(Boolean)),joined=JSON.stringify(paths);for(const v of views)if(!joined.includes('/dtex/'+v))throw new Error('missing GA '+v);await page.reload({waitUntil:'domcontentloaded'});await page.waitForFunction(()=>document.body.classList.contains('unlocked'));ov=JSON.parse(await page.evaluate(()=>localStorage.getItem('dtex_account_overrides_v2')));if(ov[id].coverage!==73||ov[id].adoption!==82||ov[id].value!==79||ov[id].commercial!==66)throw new Error('persistence failed');if(errors.length)throw new Error(errors.join(' | '));console.log('PASS: DTEX scoring, Settings, full edit parity, persistence, Lock, Analytics');await browser.close();
          NODE
          CHROME="$chrome" node verify.mjs
