name: Verify ABC Final Live V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-abc-final-live-v2.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exercise final production UI PDF and analytics
        run: |
          set -euo pipefail
          mkdir -p /tmp/abc-final-v2 && cd /tmp/abc-final-v2
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core >/dev/null 2>&1
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          export ABC_PASS="$(python3 -c 'import os,re; s=open(os.path.join(os.environ["GITHUB_WORKSPACE"],"abc/src/index.js")).read(); m=re.search(r"const PASS=\x27([^\x27]+)\x27",s); assert m; print(m.group(1))')"
          cat > test.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage();
          page.setDefaultTimeout(15000);
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          const load=()=>page.evaluate(()=>JSON.parse(localStorage.getItem('zs_ops_dtex_model_v2')));

          let ready=false;
          for(let i=1;i<=24;i++){
            await page.goto(`https://abc.clintware.com/?finalv2=${Date.now()}-${i}`,{waitUntil:'domcontentloaded',timeout:30000});
            const html=await page.content();
            if(html.includes('ABNORMAL // CUSTOMER SUCCESS')&&html.includes('Print / Save PDF')&&html.includes('trackPageView')&&html.includes('Open customer risks')&&html.includes('dtex-gate-js')){ready=true;console.log('FINAL_BUILD_ATTEMPT',i);break}
            await page.waitForTimeout(5000);
          }
          if(!ready)throw new Error('final ABC build not reached');
          await page.waitForFunction(()=>typeof document.querySelector('#access-form')?.onsubmit==='function');

          await page.fill('#pw','wrong-password');await page.click('#access-form button[type="submit"]');
          await page.waitForFunction(()=>document.querySelector('#gate-error')?.textContent==='Incorrect password.');
          if(await page.evaluate(()=>document.body.classList.contains('unlocked')))throw new Error('wrong password unlocked app');
          await page.fill('#pw',process.env.ABC_PASS);await page.click('#access-form button[type="submit"]');
          await page.waitForFunction(()=>document.body.classList.contains('unlocked'));
          await page.waitForFunction(()=>{try{const d=JSON.parse(localStorage.getItem('zs_ops_dtex_model_v2'));return d?.abcAbnormalModelVersion===4&&d.accounts?.length===20&&d.accounts[0]?.name==='Lone Mesa Energy'&&d.accounts[19]?.name==='Metroplex Media Group'}catch(e){return false}},{timeout:30000});
          await page.waitForFunction(()=>document.body.classList.contains('unlocked')&&document.querySelector('.topbar'),{timeout:30000});

          const brand=await page.locator('.brandcopy').innerText();
          if(!brand.includes('ABNORMAL // CUSTOMER SUCCESS'))throw new Error('Abnormal-style brand missing');
          if((await page.locator('body').innerText()).includes('Post-Sales Business Operations'))throw new Error('legacy ZS brand remains');

          await page.locator('.topnav [data-route="command"]').click();await page.waitForSelector('.kpi-card');
          if(await page.locator('.kpi-card').count()!==6)throw new Error('expected six clickable overview cards');
          const cardRoutes=await page.locator('.kpi-card').evaluateAll(xs=>xs.map(x=>x.dataset.route));
          const expected=['accounts','kpis','renewal','accounts','accounts','playbooks'];
          if(JSON.stringify(cardRoutes)!==JSON.stringify(expected))throw new Error('overview card routes incorrect: '+JSON.stringify(cardRoutes));
          for(let i=0;i<6;i++){
            await page.locator('.topnav [data-route="command"]').click();
            const r=await page.locator('.kpi-card').nth(i).getAttribute('data-route');
            await page.locator('.kpi-card').nth(i).click();
            await page.waitForFunction(route=>document.querySelector(`.topnav [data-route="${route}"]`)?.classList.contains('active'),r);
          }

          const mainRoutes=['command','accounts','renewal','playbooks','cadence','capacity','finance','intake','kpis','settings'];
          for(const r of mainRoutes){await page.locator(`.topnav [data-route="${r}"]`).click();await page.waitForFunction(route=>document.querySelector(`.topnav [data-route="${route}"]`)?.classList.contains('active'),r)}

          await page.locator('.topnav [data-route="accounts"]').click();
          let d=await load();const aid=d.accounts[0].id;
          await page.locator(`[data-open="${aid}"]`).first().click();await page.waitForSelector('[data-edit-account]');
          const tabs=['summary','stakeholders','success','technical','meetings','notes','commercial'];
          for(const t of tabs){await page.locator(`[data-tab="${t}"]`).click();await page.waitForFunction(tab=>document.querySelector(`[data-tab="${tab}"]`)?.classList.contains('active'),t)}

          await page.locator('[data-tab="notes"]').click();
          d=await load();let a=d.accounts.find(x=>String(x.id)===String(aid));const n0=a.notes.length;
          await page.locator('[data-add-note]').click();await page.click('#save-note');
          if(!(await page.locator('#note-error').innerText()).includes('Enter a note'))throw new Error('blank note validation failed');
          const note=`FINAL V2 NOTE ${Date.now()}`;await page.fill('#n-text',note);await page.click('#save-note');
          await page.waitForSelector('.abc-toast');if(!(await page.locator('.abc-toast').innerText()).includes('Note saved'))throw new Error('note saved toast missing');
          if(!await page.locator('[data-tab="notes"]').evaluate(e=>e.classList.contains('active')))throw new Error('Notes tab not retained');
          d=await load();a=d.accounts.find(x=>String(x.id)===String(aid));if(a.notes.length!==n0+1||a.notes[0].text!==note)throw new Error('note save/prepend failed');
          if(!(await page.locator('.record').first().innerText()).includes(note))throw new Error('new note not visible first');

          const popupPromise=page.waitForEvent('popup');
          await page.locator('[data-brief]').first().click();
          if(await page.locator('#print-brief').count()!==1)throw new Error('Print / Save PDF missing');
          await page.click('#print-brief');const popup=await popupPromise;popup.setDefaultTimeout(15000);
          // document.open()/write() replaces the original about:blank execution context.
          // Poll the replacement DOM from Node rather than waitForFunction on the old context.
          let ptext='';
          for(let i=0;i<24;i++){
            try{ptext=await popup.locator('body').innerText({timeout:1000})}catch(e){ptext=''}
            if(ptext.includes('Manual notes / decisions'))break;
            await popup.waitForTimeout(250);
          }
          if(!ptext.includes('Manual notes / decisions'))throw new Error('printable brief never finished writing');
          if(!ptext.includes(note))throw new Error('custom note missing from printable brief');
          if(!ptext.includes('EBR storyline'))throw new Error('EBR storyline missing from printable brief');
          const layout=await popup.evaluate(()=>{const body=document.body.getBoundingClientRect();const dates=[...document.querySelectorAll('.date-value')].map(el=>{const r=el.getBoundingClientRect(),cs=getComputedStyle(el);return{text:el.textContent,whiteSpace:cs.whiteSpace,left:r.left,right:r.right,bodyLeft:body.left,bodyRight:body.right}});return{dates,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1}});
          if(layout.dates.length<3)throw new Error('expected at least three printable date values');
          if(layout.overflow)throw new Error('printable brief horizontal overflow');
          for(const x of layout.dates){if(x.whiteSpace!=='nowrap')throw new Error('date wraps: '+x.text);if(x.left<x.bodyLeft-1||x.right>x.bodyRight+1)throw new Error('date clipped: '+x.text)}
          await popup.emulateMedia({media:'print'});
          const printDates=await popup.evaluate(()=>[...document.querySelectorAll('.date-value')].map(el=>({text:el.textContent,whiteSpace:getComputedStyle(el).whiteSpace,width:el.getBoundingClientRect().width})));
          if(printDates.some(x=>x.whiteSpace!=='nowrap'||x.width<=0))throw new Error('print-media date safety failed');
          const pdf=await popup.pdf({format:'Letter',printBackground:true,preferCSSPageSize:true});
          if(pdf.length<5000||pdf.subarray(0,5).toString()!=='%PDF-')throw new Error('generated Letter PDF invalid');
          console.log('PDF_OK',pdf.length,'bytes',layout.dates.length,'date fields');
          await popup.close();await page.locator('[data-close]').first().click();

          const analytics=await page.evaluate(()=>{const rows=(window.dataLayer||[]).map(x=>{try{return Array.from(x)}catch(e){return x}});return{config:rows.some(x=>Array.isArray(x)&&x[0]==='config'&&x[1]==='G-DCY144YM9P'),paths:rows.filter(x=>Array.isArray(x)&&x[0]==='event'&&x[1]==='page_view').map(x=>x[2]?.page_path).filter(Boolean),pdf:rows.some(x=>Array.isArray(x)&&x[0]==='event'&&x[1]==='meeting_brief_pdf_open')}});
          if(!analytics.config)throw new Error('GA config missing');
          const required=[...mainRoutes.map(r=>`/abc/${r}`),...tabs.map(t=>`/abc/account/${t}`)];
          for(const p of required)if(!analytics.paths.includes(p))throw new Error('GA page_view missing '+p+' paths='+JSON.stringify(analytics.paths));
          if(!analytics.pdf)throw new Error('GA meeting_brief_pdf_open missing');
          if(analytics.paths.some(p=>/Lone|Mesa|Energy|FINAL V2 NOTE/i.test(p)))throw new Error('customer/note content leaked into GA page path');

          await page.reload({waitUntil:'domcontentloaded',timeout:30000});await page.waitForFunction(()=>document.body.classList.contains('unlocked')&&document.querySelector('.topbar'),{timeout:30000});
          d=await load();a=d.accounts.find(x=>String(x.id)===String(aid));if(a.notes[0].text!==note)throw new Error('note persistence after reload failed');
          const gaReload=await page.evaluate(()=>{const rows=(window.dataLayer||[]).map(x=>{try{return Array.from(x)}catch(e){return x}});return rows.some(x=>Array.isArray(x)&&x[0]==='config'&&x[1]==='G-DCY144YM9P')});if(!gaReload)throw new Error('GA not initialized after reload');
          if(errors.length)throw new Error('page errors: '+errors.join(' | '));
          console.log('PASS FINAL ABC V2');
          console.log('GA_PATHS',JSON.stringify([...new Set(analytics.paths)].sort()));
          console.log('CARD_ROUTES',JSON.stringify(cardRoutes));
          await browser.close();
          NODE
          CHROME="$chrome" node test.mjs
