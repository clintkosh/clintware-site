name: Inspect ABC UI fix targets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-abc-ui-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode ABC app and print exact targets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          root=Path('abc/src')
          chunks=[]
          for i in range(1,6):
              t=(root/f'app-part{i}.js').read_text()
              m=re.search(r'"([A-Za-z0-9+/=]+)"',t); assert m
              chunks.append(m.group(1))
          html=gzip.decompress(base64.b64decode(''.join(chunks))).decode()
          print('HTML_LENGTH',len(html))
          terms=['save-note','data-add-note','data-del-note','function addNote','function note','function command','Command Center','Managed ARR','Portfolio health','At-risk accounts','Executive sponsors','brand','logo','mark','topbar','renderTopBar','data-route="accounts"']
          for term in terms:
              print('\n===== TERM',term,'=====')
              hits=list(re.finditer(re.escape(term),html,re.I))
              print('COUNT',len(hits))
              for m in hits[:8]:
                  print(html[max(0,m.start()-700):m.start()+1600])
                  print('\n---')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          print('SCRIPT_COUNT',len(scripts))
          for i,s in enumerate(scripts):
              try:
                  Path(f'/tmp/script-{i}.js').write_text(s)
              except: pass
          PY
