name: Diagnose Clintware Cloudflare Routing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-clintware-routing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pages and Worker domain ownership
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured in GitHub Actions."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          account_id = "01ec467d1b01acc08790bb2dafb0237a"
          project_name = "clintware-site"
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          base = "https://api.cloudflare.com/client/v4"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
          }

          def get(path):
              req = urllib.request.Request(base + path, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = json.load(response)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")
                  raise SystemExit(f"Cloudflare GET {path} failed with HTTP {exc.code}: {detail}")
              if not body.get("success"):
                  raise SystemExit(f"Cloudflare GET {path} failed: {body.get('errors')}")
              return body.get("result")

          project = get(f"/accounts/{account_id}/pages/projects/{project_name}")
          page_domains = get(f"/accounts/{account_id}/pages/projects/{project_name}/domains") or []
          worker_domains = get(f"/accounts/{account_id}/workers/domains") or []

          interesting_page_domains = [
              {
                  "name": item.get("name"),
                  "status": item.get("status"),
              }
              for item in page_domains
              if item.get("name") in {"clintware.com", "www.clintware.com"}
          ]
          interesting_worker_domains = [
              {
                  "id": item.get("id"),
                  "hostname": item.get("hostname"),
                  "service": item.get("service"),
                  "zone_name": item.get("zone_name"),
              }
              for item in worker_domains
              if item.get("hostname") in {"clintware.com", "www.clintware.com"}
          ]
          canonical = project.get("canonical_deployment") or {}
          print("Cloudflare routing diagnostic")
          print(json.dumps({
              "pages_project": project.get("name"),
              "production_branch": project.get("production_branch"),
              "canonical_deployment_id": canonical.get("id"),
              "canonical_deployment_url": canonical.get("url"),
              "pages_domains": interesting_page_domains,
              "worker_domains": interesting_worker_domains,
          }, indent=2, sort_keys=True))
          PY
