<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clintware Home Office — Portable Writer</title>
<meta name="theme-color" content="#080a0e">
<style>
:root{color-scheme:dark;--bg:#080a0e;--surface:#0f1319;--surface2:#151b23;--line:#27303b;--text:#f4f7fb;--muted:#96a2b3;--cyan:#68e4f6;--green:#82e7b4}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
body{display:grid;grid-template-rows:auto auto 1fr auto;min-height:100vh;background:radial-gradient(circle at 15% -10%,rgba(104,228,246,.09),transparent 28rem),#080a0e}
header{height:54px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(8,10,14,.92);backdrop-filter:blur(18px)}
.brand{font:800 13px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.06em}.brand span{color:var(--cyan)}
.mode{font:700 11px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);padding-left:14px;border-left:1px solid var(--line)}
.header-spacer{flex:1}.state{font-size:12px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:#0d1117;position:sticky;top:0;z-index:5}
button,select,input[type=color]{height:32px;border:1px solid #303a47;border-radius:7px;background:#141a22;color:#dce5ef;padding:0 10px;font:700 12px/1 ui-sans-serif,system-ui;cursor:pointer}
button:hover,select:hover{border-color:#536275;background:#1a222c}button.active{border-color:var(--cyan);background:#16313a;color:#bdf7ff}.sep{width:1px;height:24px;background:var(--line);margin:0 2px}
main{padding:28px 20px 44px;overflow:auto}.sheet{width:min(816px,100%);min-height:1056px;margin:0 auto;background:white;color:#14181f;box-shadow:0 20px 70px rgba(0,0,0,.42);border:1px solid #343d49;border-radius:3px;padding:72px 78px;outline:none;font:16px/1.55 Aptos,"Segoe UI",sans-serif}
.sheet:focus{border-color:#68e4f6;box-shadow:0 20px 70px rgba(0,0,0,.42),0 0 0 2px rgba(104,228,246,.12)}
.sheet h1,.sheet h2,.sheet h3{color:#101318}.sheet p{margin:.7em 0}.sheet ul,.sheet ol{padding-left:1.7em}
footer{height:32px;display:flex;align-items:center;padding:0 14px;border-top:1px solid var(--line);background:#0b0e13;color:var(--muted);font-size:11px;gap:18px}.ok{color:var(--green)}
@media(max-width:700px){header{padding:0 10px}.mode{display:none}.toolbar{padding:7px}.sheet{min-height:calc(100vh - 150px);padding:42px 30px}.wide{display:none}}
@media print{header,.toolbar,footer{display:none}body,main{display:block;background:white;padding:0}.sheet{box-shadow:none;border:0;width:auto;min-height:0;padding:0;margin:0}}
</style>
</head>
<body>
<header><div class="brand">CLINT<span>WARE</span> HOME OFFICE</div><div class="mode">PORTABLE WRITER / ALPHA</div><div class="header-spacer"></div><div class="state" id="saveState">local recovery on</div></header>
<div class="toolbar" role="toolbar" aria-label="Document formatting">
  <button id="newBtn" title="New document">New</button><button id="openBtn" title="Open local file">Open</button><button id="saveHtmlBtn">Save HTML</button><button id="saveDocBtn" class="wide">Save .doc</button><button id="printBtn">PDF / Print</button>
  <span class="sep"></span>
  <select id="fontName" aria-label="Font"><option>Aptos</option><option>Segoe UI</option><option>Arial</option><option>Georgia</option><option>Consolas</option></select>
  <select id="fontSize" aria-label="Font size"><option value="2">10</option><option value="3" selected>12</option><option value="4">14</option><option value="5">18</option><option value="6">24</option><option value="7">36</option></select>
  <span class="sep"></span><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><input id="foreColor" type="color" value="#111111" title="Text color">
  <span class="sep"></span><button data-cmd="justifyLeft">Left</button><button data-cmd="justifyCenter">Center</button><button data-cmd="justifyRight">Right</button><button data-cmd="justifyFull" class="wide">Justify</button>
  <span class="sep"></span><button data-cmd="insertUnorderedList">Bullets</button><button data-cmd="insertOrderedList">Numbers</button><button data-cmd="undo">Undo</button><button data-cmd="redo">Redo</button>
</div>
<main><article id="editor" class="sheet" contenteditable="true" spellcheck="true"><h1>Untitled document</h1><p>Clintware Home Office Portable Writer keeps the editing surface local to this browser. Start typing here.</p></article></main>
<footer><span class="ok">LOCAL</span><span id="stats">0 words</span><span>Auto-recovery: browser storage</span><span style="margin-left:auto">CLINTWARE™ — GO FURTHEST.™</span></footer>
<input id="fileInput" type="file" accept=".html,.htm,.txt,.md,.doc" hidden>
<script>
(()=>{
const editor=document.getElementById('editor'),state=document.getElementById('saveState'),stats=document.getElementById('stats'),fileInput=document.getElementById('fileInput');
const KEY='clintware-home-office-portable-writer-v1';let timer;
function updateStats(){const text=(editor.innerText||'').trim();const words=text?text.split(/\s+/).length:0;stats.textContent=`${words.toLocaleString()} words · ${(editor.innerText||'').length.toLocaleString()} characters`;}
function recover(){const saved=localStorage.getItem(KEY);if(saved){try{const data=JSON.parse(saved);if(data.html)editor.innerHTML=data.html;state.textContent='recovered locally';}catch{}}updateStats();}
function persist(){localStorage.setItem(KEY,JSON.stringify({html:editor.innerHTML,savedAt:new Date().toISOString()}));state.textContent='saved locally';updateStats();setTimeout(()=>state.textContent='local recovery on',1200);}
editor.addEventListener('input',()=>{state.textContent='unsaved local changes';updateStats();clearTimeout(timer);timer=setTimeout(persist,500)});
document.querySelectorAll('[data-cmd]').forEach(b=>b.addEventListener('click',()=>{document.execCommand(b.dataset.cmd,false,null);editor.focus();persist()}));
document.getElementById('fontName').addEventListener('change',e=>{document.execCommand('fontName',false,e.target.value);editor.focus();persist()});
document.getElementById('fontSize').addEventListener('change',e=>{document.execCommand('fontSize',false,e.target.value);editor.focus();persist()});
document.getElementById('foreColor').addEventListener('input',e=>{document.execCommand('foreColor',false,e.target.value);editor.focus();persist()});
document.getElementById('newBtn').addEventListener('click',()=>{if((editor.innerText||'').trim()&&!confirm('Start a new document? Your current draft remains in browser recovery until the new document autosaves.'))return;editor.innerHTML='<h1>Untitled document</h1><p><br></p>';persist();editor.focus()});
document.getElementById('openBtn').addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',async()=>{const f=fileInput.files&&fileInput.files[0];if(!f)return;const text=await f.text();const ext=(f.name.split('.').pop()||'').toLowerCase();if(['html','htm','doc'].includes(ext))editor.innerHTML=text;else editor.innerText=text;persist();fileInput.value='';});
function download(name,type,data){const blob=new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function htmlDoc(){return `<!doctype html><html><head><meta charset="utf-8"><title>Clintware Home Office document</title><style>body{font-family:Aptos,Arial,sans-serif;max-width:8.5in;margin:.75in auto;line-height:1.5;color:#111}</style></head><body>${editor.innerHTML}</body></html>`}
document.getElementById('saveHtmlBtn').addEventListener('click',()=>download('Clintware-Home-Office-Document.html','text/html;charset=utf-8',htmlDoc()));
document.getElementById('saveDocBtn').addEventListener('click',()=>download('Clintware-Home-Office-Document.doc','application/msword',htmlDoc()));
document.getElementById('printBtn').addEventListener('click',()=>window.print());
window.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();download('Clintware-Home-Office-Document.html','text/html;charset=utf-8',htmlDoc())}});
recover();
})();
</script>
</body>
</html>
