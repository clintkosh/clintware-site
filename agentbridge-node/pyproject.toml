[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clintware-quillgeist"
version = "0.3.2a1"
description = "Quillgeist local-first adaptive AI execution node"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Business Source License 1.1; see LICENSE.md"}
authors = [{name = "Clintware"}]
dependencies = ["websockets>=14,<16"]

[project.optional-dependencies]
desktop = ["pystray>=0.19.5,<1", "Pillow>=10,<12"]

[project.scripts]
quillgeist = "agentbridge_node.cli:main"
# Temporary compatibility alias for pre-Quillgeist alpha users.
agentbridge = "agentbridge_node.cli:main"

[tool.setuptools]
packages = ["agentbridge_node"]
