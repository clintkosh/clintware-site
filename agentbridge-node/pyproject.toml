[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clintware-agentbridge"
version = "0.1.0a2"
description = "Local execution node for AgentBridge Execution Packs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Business Source License 1.1; see LICENSE.md"}
authors = [{name = "Clintware"}]
dependencies = ["websockets>=14,<16"]

[project.scripts]
agentbridge = "agentbridge_node.cli:main"

[tool.setuptools]
packages = ["agentbridge_node"]
