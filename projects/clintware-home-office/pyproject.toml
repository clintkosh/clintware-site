[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clintware-home-office"
version = "0.1.0"
description = "Local-first modern office suite from Clintware, beginning with Writer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.10,<7",
  "python-docx>=1.2,<2",
]

[project.scripts]
clintware-home-office = "clintware_home_office.app:main"

[tool.setuptools.packages.find]
where = ["src"]
