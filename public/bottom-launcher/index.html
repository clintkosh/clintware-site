<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07070a" />
  <meta name="description" content="Bottom Launcher is an artist content creator pilot: music direction, lore, vocal architecture, release planning, and short-form content from one workspace." />
  <title>Bottom Launcher — Artist Content Creator Pilot</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <div class="mark">BL</div>
        <div><strong>BOTTOM LAUNCHER</strong><span>artist creator pilot</span></div>
      </div>
      <nav id="nav">
        <button data-view="launch" class="active">Launchpad</button>
        <button data-view="dna">Artist DNA</button>
        <button data-view="albums">10-Album Arc</button>
        <button data-view="track">Track Lab</button>
        <button data-view="flows">Flow Engine</button>
        <button data-view="content">Content Forge</button>
        <button data-view="lore">Lore Map</button>
        <button data-view="rights">Rights + Source</button>
      </nav>
      <div class="rail-foot">
        <span class="dot"></span> local-first pilot
        <small>Seed workspace: FEDDY STYGM∆</small>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <p class="eyebrow">ARTIST OPERATING SYSTEM / PILOT 0.1</p>
          <h1 id="view-title">Launchpad</h1>
        </div>
        <div class="actions">
          <button id="reset-seed">Reset Seed</button>
          <button id="export-json">Export Project</button>
          <button id="save-project" class="primary">Save</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <dialog id="dialog"><div id="dialog-body"></div></dialog>
  <div id="toast" class="toast"></div>
  <script src="./app.js" defer></script>
</body>
</html>
