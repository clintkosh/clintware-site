  <style>
    :root{--bg:#080512;--panel:#11101d;--text:#faf7ff;--muted:#aaa3bb;--line:#302a43;--pink:#ff4fc8;--cyan:#50e7ff;--violet:#8d66ff;--max:1280px}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,rgba(255,79,200,.14),transparent 30%),radial-gradient(circle at 88% 6%,rgba(80,231,255,.12),transparent 29%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}.shell{width:min(var(--max),calc(100% - 36px));margin:auto;padding:28px 0 48px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.back{color:var(--cyan);text-decoration:none;font-weight:750}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:.02em}.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--pink),var(--violet) 55%,var(--cyan));box-shadow:0 0 28px rgba(255,79,200,.38)}.studio{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}.stage,.controls{border:1px solid var(--line);border-radius:24px;background:rgba(17,16,29,.88);box-shadow:0 24px 80px rgba(0,0,0,.32)}.stage{padding:18px}.stagehead{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:14px}.eyebrow{color:var(--pink);text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;font-weight:900}.stagehead h1{font-size:clamp(1.45rem,3vw,2.25rem);letter-spacing:-.045em;margin:3px 0 0}.stage-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);border-radius:12px;background:#1b172a;color:var(--text);padding:10px 14px;font-weight:800;cursor:pointer}.btn:hover,.btn:focus-visible{border-color:#655b81;outline:none}.btn.primary{border:0;background:linear-gradient(105deg,var(--pink),var(--violet));box-shadow:0 10px 26px rgba(141,102,255,.28)}.canvas-wrap{overflow:hidden;border-radius:18px;background:#05040a;aspect-ratio:16/9;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}canvas{display:block;width:100%;height:100%}.hint{color:var(--muted);margin:13px 2px 0;font-size:.82rem}.controls{padding:20px;max-height:calc(100vh - 116px);overflow:auto}.controls h2{font-size:1rem;margin:0 0 12px}.group{padding:18px 0;border-top:1px solid var(--line)}.group:first-of-type{border-top:0;padding-top:0}.field{display:grid;gap:8px;margin-top:13px}.field:first-child{margin-top:0}.labelrow{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.83rem}.value{color:var(--text);font-variant-numeric:tabular-nums}.text-input,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#0d0b16;color:var(--text);padding:11px 12px;outline:none}.text-input:focus,select:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(141,102,255,.15)}textarea.text-input{min-height:88px;resize:vertical;font-weight:800;font-size:1.03rem}.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.preset{border:1px solid var(--line);border-radius:12px;background:#0d0b16;color:var(--text);padding:10px 8px;cursor:pointer;font-weight:800}.preset[aria-pressed="true"]{border-color:var(--pink);box-shadow:inset 0 0 0 1px var(--pink),0 0 22px rgba(255,79,200,.13)}input[type="range"]{width:100%;accent-color:var(--pink)}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.swatch{display:grid;gap:6px;color:var(--muted);font-size:.75rem}.swatch input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:#0d0b16;padding:3px}.toggle{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:13px;color:var(--muted)}.switch{appearance:none;width:42px;height:24px;border-radius:999px;background:#373146;position:relative;cursor:pointer;transition:.2s}.switch:after{content:"";position:absolute;width:18px;height:18px;top:3px;left:3px;border-radius:50%;background:white;transition:.2s}.switch:checked{background:linear-gradient(90deg,var(--pink),var(--violet))}.switch:checked:after{transform:translateX(18px)}.full{width:100%;margin-top:4px}.footer{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;color:var(--muted);padding:26px 4px 0;font-size:.8rem}.footer a{color:var(--cyan)}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#f7f3ff;color:#171020;padding:10px 16px;border-radius:999px;font-weight:850;opacity:0;pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:980px){.studio{grid-template-columns:1fr}.controls{max-height:none}.stage-actions{flex-direction:column}.stagehead{align-items:flex-start}}@media(max-width:620px){.shell{width:min(var(--max),calc(100% - 22px));padding-top:18px}.topbar{margin-bottom:18px}.stage{padding:11px;border-radius:18px}.stagehead{padding:6px 4px}.stage-actions{width:100%;flex-direction:row}.stage-actions .btn{flex:1}.controls{padding:17px;border-radius:18px}.colors{grid-template-columns:1fr 1fr}.colors .swatch:last-child{grid-column:1/-1}}

<body>
  <div class="shell">
    <header class="topbar">
      <a class="back" href="https://www.clintware.com/tools/">← Tools & Apps</a>
      <div class="brand"><span class="mark" aria-hidden="true"></span>VaporType Studio</div>
    </header>
    <main class="studio">
      <section class="stage" aria-labelledby="studio-title">
        <div class="stagehead">
          <div><div class="eyebrow">Live canvas</div><h1 id="studio-title">Make the words hit harder.</h1></div>
          <div class="stage-actions"><button class="btn" id="randomize" type="button">Surprise me</button><button class="btn primary" id="downloadTop" type="button">Export PNG</button></div>
        </div>
        <div class="canvas-wrap"><canvas id="artboard" width="1600" height="900" aria-label="Live preview of your VaporType artwork"></canvas></div>
        <p class="hint">Exports at 1600 × 900 pixels. Transparent mode preserves only the type and glow.</p>
      </section>
      <aside class="controls" aria-label="Typography controls">
        <div class="group">
          <h2>Words</h2>
          <label class="field"><span class="labelrow"><span>Headline</span><span>Up to 3 lines</span></span><textarea class="text-input" id="copy" maxlength="72">MAKE IT
UNMISSABLE</textarea></label>
          <label class="field"><span class="labelrow"><span>Typeface</span></span><select id="font"><option value="Arial Black">Heavy sans</option><option value="Impact">Condensed impact</option><option value="Trebuchet MS">Modern sans</option><option value="Georgia">Editorial serif</option><option value="Courier New">Monospace</option></select></label>
        </div>
        <div class="group">
          <h2>Preset</h2>
          <div class="preset-grid">
            <button class="preset" type="button" data-preset="sunset" aria-pressed="true">Sunset</button>
            <button class="preset" type="button" data-preset="neon" aria-pressed="false">Neon</button>
            <button class="preset" type="button" data-preset="chrome" aria-pressed="false">Chrome</button>
            <button class="preset" type="button" data-preset="laser" aria-pressed="false">Laser</button>
          </div>
        </div>
        <div class="group">
          <h2>Type shape</h2>
          <label class="field"><span class="labelrow"><span>Size</span><span class="value" id="sizeValue"></span></span><input id="size" type="range" min="56" max="190" value="138"></label>
          <label class="field"><span class="labelrow"><span>Letter spacing</span><span class="value" id="trackingValue"></span></span><input id="tracking" type="range" min="-3" max="24" value="5" step="1"></label>
          <label class="field"><span class="labelrow"><span>Line height</span><span class="value" id="lineValue"></span></span><input id="lineHeight" type="range" min="0.75" max="1.35" value="0.88" step="0.01"></label>
          <label class="field"><span class="labelrow"><span>Gradient angle</span><span class="value" id="angleValue"></span></span><input id="angle" type="range" min="0" max="360" value="22"></label>
        </div>
        <div class="group">
          <h2>Color</h2>
          <div class="colors">
            <label class="swatch">Start<input id="color1" type="color" value="#ff4fc8"></label>
            <label class="swatch">Middle<input id="color2" type="color" value="#8d66ff"></label>
            <label class="swatch">Finish<input id="color3" type="color" value="#50e7ff"></label>
          </div>
          <label class="field"><span class="labelrow"><span>Glow</span><span class="value" id="glowValue"></span></span><input id="glow" type="range" min="0" max="70" value="30"></label>
          <div class="colors" style="margin-top:13px">
            <label class="swatch">Glow color<input id="glowColor" type="color" value="#ff4fc8"></label>
            <label class="swatch">Background<input id="background" type="color" value="#090415"></label>
          </div>
          <label class="toggle"><span>Perspective grid</span><input class="switch" id="grid" type="checkbox" checked></label>
          <label class="toggle"><span>Transparent background</span><input class="switch" id="transparent" type="checkbox"></label>
        </div>
        <div class="group"><button class="btn primary full" id="download" type="button">Download high-resolution PNG</button></div>
      </aside>
    </main>
    <footer class="footer"><span>VaporType Studio by Clintware</span><span><a href="https://www.clintware.com/">Home</a> · <a href="https://www.clintware.com/contact/">Contact</a> · <a href="https://www.clintware.com/privacy/">Privacy</a></span></footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite">PNG downloaded</div>
  <script>
    const canvas=document.getElementById('artboard'),ctx=canvas.getContext('2d');
    const ids=['copy','font','size','tracking','lineHeight','angle','color1','color2','color3','glow','glowColor','background','grid','transparent'];
    const el=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
    const presets={
      sunset:{color1:'#ff4fc8',color2:'#8d66ff',color3:'#50e7ff',glowColor:'#ff4fc8',background:'#090415',angle:22,glow:30,grid:true,font:'Arial Black'},
      neon:{color1:'#d7ff38',color2:'#35ffd3',color3:'#46a8ff',glowColor:'#35ffd3',background:'#04110f',angle:7,glow:42,grid:true,font:'Impact'},
      chrome:{color1:'#ffffff',color2:'#6c7691',color3:'#ffffff',glowColor:'#6c8cff',background:'#070914',angle:90,glow:12,grid:false,font:'Arial Black'},
      laser:{color1:'#ff355d',color2:'#ff9b2f',color3:'#fff36b',glowColor:'#ff355d',background:'#140409',angle:0,glow:48,grid:true,font:'Trebuchet MS'}
    };
    function hexToRgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
    function measureTracked(text,spacing){return [...text].reduce((w,ch,i)=>w+ctx.measureText(ch).width+(i?spacing:0),0)}
    function drawTracked(text,x,y,spacing){const chars=[...text],width=measureTracked(text,spacing);let cursor=x-width/2;for(const ch of chars){ctx.fillText(ch,cursor,y);cursor+=ctx.measureText(ch).width+spacing}}
    function drawBackground(){
      if(el.transparent.checked){ctx.clearRect(0,0,canvas.width,canvas.height);return}
      ctx.fillStyle=el.background.value;ctx.fillRect(0,0,canvas.width,canvas.height);
      const haze=ctx.createRadialGradient(800,430,30,800,430,760);haze.addColorStop(0,hexToRgba(el.color2.value,.2));haze.addColorStop(.58,hexToRgba(el.color1.value,.055));haze.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=haze;ctx.fillRect(0,0,1600,900);
      if(!el.grid.checked)return;
      ctx.save();ctx.strokeStyle=hexToRgba(el.color3.value,.18);ctx.lineWidth=2;const horizon=630;
      for(let x=-1100;x<2700;x+=120){ctx.beginPath();ctx.moveTo(800+(x-800)*.12,horizon);ctx.lineTo(x,900);ctx.stroke()}
      for(let y=horizon;y<930;y+=38){const p=(y-horizon)/300;ctx.globalAlpha=.18+p*.35;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1600,y);ctx.stroke()}
      ctx.restore();
    }
    function render(){
      drawBackground();
      const raw=el.copy.value.trim()||'TYPE SOMETHING',lines=raw.split(/\n/).slice(0,3),tracking=Number(el.tracking.value),requested=Number(el.size.value),lineHeight=Number(el.lineHeight.value);
      let fontSize=requested;ctx.font=`900 ${fontSize}px "${el.font.value}",sans-serif`;
      while(fontSize>42&&Math.max(...lines.map(line=>measureTracked(line.toUpperCase(),tracking)))>1380){fontSize-=3;ctx.font=`900 ${fontSize}px "${el.font.value}",sans-serif`}
      const angle=Number(el.angle.value)*Math.PI/180,dx=Math.cos(angle)*800,dy=Math.sin(angle)*450,gradient=ctx.createLinearGradient(800-dx,450-dy,800+dx,450+dy);gradient.addColorStop(0,el.color1.value);gradient.addColorStop(.5,el.color2.value);gradient.addColorStop(1,el.color3.value);
      ctx.save();ctx.textBaseline='middle';ctx.fillStyle=gradient;ctx.shadowColor=el.glowColor.value;ctx.shadowBlur=Number(el.glow.value);ctx.lineJoin='round';ctx.strokeStyle='rgba(255,255,255,.11)';ctx.lineWidth=Math.max(2,fontSize*.025);
      const step=fontSize*lineHeight,total=(lines.length-1)*step;lines.forEach((line,i)=>{const y=430-total/2+i*step;ctx.strokeText(line.toUpperCase(),800-measureTracked(line.toUpperCase(),tracking)/2,y);drawTracked(line.toUpperCase(),800,y,tracking)});ctx.restore();
      document.getElementById('sizeValue').textContent=`${el.size.value}px`;document.getElementById('trackingValue').textContent=`${el.tracking.value}px`;document.getElementById('lineValue').textContent=Number(el.lineHeight.value).toFixed(2);document.getElementById('angleValue').textContent=`${el.angle.value}°`;document.getElementById('glowValue').textContent=`${el.glow.value}px`;
    }
    function applyPreset(name){const p=presets[name];Object.entries(p).forEach(([key,value])=>{if(key==='grid')el.grid.checked=value;else el[key].value=value});document.querySelectorAll('.preset').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.preset===name)));render()}
    function randomize(){const names=Object.keys(presets),name=names[Math.floor(Math.random()*names.length)];applyPreset(name);el.angle.value=Math.floor(Math.random()*361);el.tracking.value=Math.floor(Math.random()*15);render()}
    function download(){render();canvas.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vaportype-artwork.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)},'image/png')}
    ids.forEach(id=>el[id].addEventListener('input',render));document.querySelectorAll('.preset').forEach(btn=>btn.addEventListener('click',()=>applyPreset(btn.dataset.preset)));document.getElementById('randomize').addEventListener('click',randomize);document.getElementById('download').addEventListener('click',download);document.getElementById('downloadTop').addEventListener('click',download);render();
  </script>
</body>
</html>
