<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
<meta name="referrer" content="no-referrer" />
<title>Private Customer Success Demo</title>
<style>
:root{--bg:#0b1117;--panel:#111a21;--line:#28343d;--text:#f5f7f8;--muted:#95a2ab;--accent:#c8f000;--bad:#ff7171}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,"Avenir Next","Helvetica Neue",Arial,sans-serif;background:radial-gradient(circle at 20% 0%,#18232c 0,#0b1117 44%,#080d11 100%);color:var(--text)}#gate{min-height:100%;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:rgba(17,26,33,.96);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.32)}.mark{width:36px;height:5px;background:var(--accent);border-radius:99px;margin-bottom:24px}h1{margin:0;font-size:25px;letter-spacing:-.035em}p{color:var(--muted);margin:9px 0 22px;line-height:1.5}.field{display:grid;gap:7px}label{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#bdc7cd}input{width:100%;border:1px solid #34434d;background:#0a1015;color:#fff;border-radius:10px;padding:12px 13px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,240,0,.1)}button{width:100%;border:0;border-radius:10px;background:var(--accent);color:#0b1117;font-weight:900;padding:12px 14px;margin-top:12px;cursor:pointer}.err{height:18px;margin-top:10px;color:var(--bad);font-size:12px}.fine{font-size:10px;color:#687780;margin-top:18px}#app{display:none;width:100%;height:100%;border:0;background:#fff}body.unlocked #gate{display:none}body.unlocked #app{display:block}
</style>
</head>
<body>
<main id="gate">
  <section class="card" aria-labelledby="gate-title">
    <div class="mark"></div>
    <h1 id="gate-title">Private Customer Success Demo</h1>
    <p>Restricted preview. Enter the access password to continue.</p>
    <form id="access-form" autocomplete="off">
      <div class="field"><label for="pw">Access password</label><input id="pw" name="pw" type="password" autocomplete="current-password" autofocus /></div>
      <button type="submit">Unlock demo</button>
      <div class="err" id="err" role="alert" aria-live="polite"></div>
    </form>
    <div class="fine">Private demonstration environment · Synthetic data only</div>
  </section>
</main>
<iframe id="app" title="Customer Success demo" referrerpolicy="no-referrer"></iframe>
<script>
(()=>{
  const f=document.getElementById('access-form'),p=document.getElementById('pw'),e=document.getElementById('err'),a=document.getElementById('app');
  const key='summertime_demo_access';
  const unlock=()=>{sessionStorage.setItem(key,'1');document.body.classList.add('unlocked');a.src='/dtex-crmdemo/';document.title='Customer Success Command Center'};
  if(sessionStorage.getItem(key)==='1') unlock();
  f.addEventListener('submit',ev=>{ev.preventDefault();if(p.value==='DT3XK0$H2026'){e.textContent='';unlock()}else{e.textContent='Incorrect password.';p.select()}});
})();
</script>
</body>
</html>
