name: clintcal

volumes:
  postgres-data:
  redis-data:

networks:
  private:
    driver: bridge

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clintcal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-clintcal}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clintcal} -d ${POSTGRES_DB:-clintcal}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  web:
    build:
      context: ./runtime
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WEBAPP_URL: https://meet.clintware.com
        NEXT_PUBLIC_API_V2_URL: https://meet.clintware.com/v2
        NEXT_PUBLIC_WEBSITE_TERMS_URL: ${NEXT_PUBLIC_WEBSITE_TERMS_URL:-}
        NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL: ${NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL:-}
        CALCOM_TELEMETRY_DISABLED: "1"
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
        CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY:?CALENDSO_ENCRYPTION_KEY is required}
        DATABASE_URL: postgresql://${POSTGRES_USER:-clintcal}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-clintcal}
        DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-clintcal}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-clintcal}
        CSP_POLICY: non-strict
    restart: unless-stopped
    env_file:
      - ./runtime/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clintcal}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-clintcal}
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-clintcal}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-clintcal}
      NEXT_PUBLIC_WEBAPP_URL: https://meet.clintware.com
      NEXT_PUBLIC_WEBSITE_URL: https://meet.clintware.com
      NEXT_PUBLIC_API_V2_URL: https://meet.clintware.com/v2
      NEXTAUTH_URL: https://meet.clintware.com
      ALLOWED_HOSTNAMES: '"meet.clintware.com","localhost:3000"'
      NEXT_PUBLIC_APP_NAME: ClintCal
      NEXT_PUBLIC_COMPANY_NAME: Clintware
      NEXT_PUBLIC_DISABLE_SIGNUP: "true"
      CALCOM_TELEMETRY_DISABLED: "1"
      CSP_POLICY: non-strict
      GOOGLE_WEBHOOK_URL: https://meet.clintware.com
    depends_on:
      database:
        condition: service_healthy
    networks: [private]

  api:
    build:
      context: ./runtime
      dockerfile: apps/api/v2/Dockerfile
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-clintcal}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-clintcal}
        DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-clintcal}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-clintcal}
    restart: unless-stopped
    env_file:
      - ./runtime/.env
    environment:
      NODE_ENV: production
      API_PORT: "80"
      API_URL: https://meet.clintware.com/v2
      WEB_APP_URL: https://meet.clintware.com
      DATABASE_URL: postgresql://${POSTGRES_USER:-clintcal}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-clintcal}
      DATABASE_READ_URL: postgresql://${POSTGRES_USER:-clintcal}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-clintcal}
      DATABASE_WRITE_URL: postgresql://${POSTGRES_USER:-clintcal}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-clintcal}
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-clintcal}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-clintcal}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REDIS_URL: redis://redis:6379
      REWRITE_API_V2_PREFIX: "true"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [private]

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - web
      - api
    networks: [private]

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      - edge
    networks: [private]
