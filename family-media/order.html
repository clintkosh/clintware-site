<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order | Clintware Family Media Studio</title><link rel="stylesheet" href="assets/css/styles.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">C</span><span>Clintware <small>Family Media Studio</small></span></a><nav class="nav-links"><a href="index.html#pricing">Pricing</a><a href="acceptable-use.html">Acceptable use</a></nav></div></header><main class="section"><div class="container order-grid"><aside class="card summary-card"><div class="eyebrow">Order request</div><h1 id="package-title">Family Media order</h1><div class="price" id="package-price">Review</div><p id="package-description" class="lead"></p><div class="payment-note" id="payment-note">Paid orders receive a PayPal invoice after manual review. Production begins only after payment is confirmed.</div></aside><section class="card"><h2>Tell us what to create</h2><form action="submit-order.php" method="post" enctype="multipart/form-data"><input type="hidden" name="package" id="package-field" value="free"><div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required maxlength="120"></div><div class="field"><label for="email">Email used for the PayPal invoice</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="180"></div><div class="field"><label for="scene">Describe the scene</label><textarea id="scene" name="scene" rows="6" required maxlength="3000" placeholder="Describe the setting, clothing, mood, people or pets, and intended use."></textarea></div><div class="field"><label for="photos">Authorized source photos (up to five, 10 MB each)</label><input id="photos" name="photos[]" type="file" accept="image/jpeg,image/png,image/webp" multiple required></div><label class="check-row"><input type="checkbox" name="rights_confirmed" value="yes" required><span>I own these files or have permission to use them and the depicted people’s likenesses.</span></label><label class="check-row"><input type="checkbox" name="minor_consent" value="yes" required><span>I have parent or legal-guardian permission for every identifiable minor, or no minor is depicted.</span></label><label class="check-row"><input type="checkbox" name="terms_accepted" value="yes" required><span>I accept the <a href="terms.html" target="_blank">Terms</a>, <a href="privacy.html" target="_blank">Privacy Policy</a>, <a href="refunds.html" target="_blank">Refund Policy</a>, and <a href="acceptable-use.html" target="_blank">Acceptable Use Policy</a>.</span></label><button class="button full" type="submit">Submit order for review</button></form></section></div></main><script>const packages={free:['Free Portrait Preview','$0','One watermarked concept for one person or pet.'],mini:['Portrait Mini','$29','Two finished images and one revision round.'],studio:['Studio Session','$79','Six finished images and two revision rounds.'],creator:['Brand & Creator Session','$179','Twelve finished images, three revisions, and a commercial-use license.']};const key=new URLSearchParams(location.search).get('package')||'free';const p=packages[key]||packages.free;document.querySelector('#package-field').value=key;document.querySelector('#package-title').textContent=p[0];document.querySelector('#package-price').textContent=p[1];document.querySelector('#package-description').textContent=p[2];if(key==='free')document.querySelector('#payment-note').textContent='No payment is required for the free preview. Paid upgrades are invoiced through PayPal.';</script></body></html>
